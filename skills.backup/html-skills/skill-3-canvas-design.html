<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <title>🎨 龍魂画布设计工具 v1.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Monaco', monospace;
            background: #0a0e27;
            color: #fff;
            display: flex;
            height: 100vh;
        }
        .toolbar {
            width: 80px;
            background: #151a3f;
            border-right: 2px solid #00d4ff;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .tool-btn {
            width: 60px;
            height: 60px;
            border: 2px solid #00d4ff;
            background: rgba(0,212,255,0.1);
            color: #00d4ff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.5em;
            transition: all 0.3s;
        }
        .tool-btn:hover, .tool-btn.active {
            background: rgba(0,212,255,0.3);
            box-shadow: 0 0 10px #00d4ff;
        }
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .canvas-header {
            padding: 15px;
            background: #151a3f;
            border-bottom: 2px solid #00d4ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .canvas-header h1 {
            background: linear-gradient(90deg, #00d4ff, #00f5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5em;
        }
        canvas {
            flex: 1;
            background: linear-gradient(135deg, rgba(21,26,63,0.5) 0%, rgba(10,14,39,0.8) 100%);
            cursor: crosshair;
            display: block;
        }
        .properties {
            width: 250px;
            background: #151a3f;
            border-left: 2px solid #00d4ff;
            padding: 20px;
            overflow-y: auto;
        }
        .property-group {
            margin-bottom: 20px;
            border-bottom: 1px solid #00d4ff;
            padding-bottom: 15px;
        }
        .property-label {
            color: #00d4ff;
            font-size: 0.9em;
            margin-bottom: 8px;
            display: block;
            font-weight: bold;
        }
        input[type="color"], input[type="range"], input[type="text"], select {
            width: 100%;
            padding: 8px;
            background: rgba(0,212,255,0.1);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            border-radius: 4px;
            font-family: inherit;
        }
        button {
            padding: 8px 16px;
            background: rgba(0,212,255,0.1);
            border: 2px solid #00d4ff;
            color: #00d4ff;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: all 0.3s;
        }
        button:hover {
            background: rgba(0,212,255,0.2);
            box-shadow: 0 0 10px #00d4ff;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button class="tool-btn active" data-tool="select" title="选择">➤</button>
        <button class="tool-btn" data-tool="rect" title="矩形">▢</button>
        <button class="tool-btn" data-tool="circle" title="圆形">⭕</button>
        <button class="tool-btn" data-tool="line" title="直线">╱</button>
        <button class="tool-btn" data-tool="text" title="文本">T</button>
        <button class="tool-btn" data-tool="delete" title="删除">✕</button>
    </div>
    
    <div class="canvas-area">
        <div class="canvas-header">
            <h1>🎨 龍魂画布设计工具</h1>
            <div>
                <button onclick="clearCanvas()" style="width: auto; margin: 0 5px;">清空</button>
                <button onclick="downloadCanvas()" style="width: auto; margin: 0 5px;">导出</button>
            </div>
        </div>
        <canvas id="canvas"></canvas>
    </div>
    
    <div class="properties">
        <h3 style="color: #00d4ff; margin-bottom: 15px;">⚙️ 属性</h3>
        
        <div class="property-group">
            <label class="property-label">填充颜色</label>
            <input type="color" id="fillColor" value="#00d4ff">
        </div>
        
        <div class="property-group">
            <label class="property-label">边框颜色</label>
            <input type="color" id="strokeColor" value="#00f5ff">
        </div>
        
        <div class="property-group">
            <label class="property-label">边框宽度</label>
            <input type="range" id="strokeWidth" min="1" max="10" value="2">
        </div>
        
        <div class="property-group">
            <label class="property-label">透明度</label>
            <input type="range" id="opacity" min="0" max="100" value="100">
        </div>
        
        <div class="property-group">
            <label class="property-label">文本内容</label>
            <input type="text" id="textContent" placeholder="输入文本...">
        </div>
        
        <div class="property-group">
            <label class="property-label">字体大小</label>
            <input type="range" id="fontSize" min="12" max="72" value="24">
        </div>
        
        <button onclick="applyProperties()">应用属性</button>
        <button onclick="downloadCanvas()">📥 导出 PNG</button>
        <button onclick="downloadSVG()">📥 导出 SVG</button>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 响应式canvas
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            redraw();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        let currentTool = 'select';
        let shapes = [];
        let selectedShape = null;
        let isDrawing = false;
        let startX, startY;
        
        // 工具切换
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
            });
        });
        
        // 绘制事件
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            isDrawing = true;
            
            if (currentTool === 'select') {
                selectedShape = shapes.find(s => isPointInShape(startX, startY, s));
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (currentTool === 'select' && selectedShape) {
                selectedShape.x += x - startX;
                selectedShape.y += y - startY;
                startX = x;
                startY = y;
                redraw();
            }
        });
        
        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;
            
            if (currentTool === 'rect') {
                shapes.push({
                    type: 'rect',
                    x: startX,
                    y: startY,
                    width: endX - startX,
                    height: endY - startY,
                    fillColor: document.getElementById('fillColor').value,
                    strokeColor: document.getElementById('strokeColor').value,
                    strokeWidth: parseInt(document.getElementById('strokeWidth').value),
                    opacity: parseInt(document.getElementById('opacity').value) / 100
                });
            } else if (currentTool === 'circle') {
                const radius = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2)) / 2;
                shapes.push({
                    type: 'circle',
                    x: (startX + endX) / 2,
                    y: (startY + endY) / 2,
                    radius: radius,
                    fillColor: document.getElementById('fillColor').value,
                    strokeColor: document.getElementById('strokeColor').value,
                    strokeWidth: parseInt(document.getElementById('strokeWidth').value),
                    opacity: parseInt(document.getElementById('opacity').value) / 100
                });
            } else if (currentTool === 'text') {
                const text = document.getElementById('textContent').value || 'Text';
                shapes.push({
                    type: 'text',
                    x: startX,
                    y: startY,
                    text: text,
                    fontSize: parseInt(document.getElementById('fontSize').value),
                    fillColor: document.getElementById('fillColor').value,
                    opacity: parseInt(document.getElementById('opacity').value) / 100
                });
            } else if (currentTool === 'delete' && selectedShape) {
                shapes = shapes.filter(s => s !== selectedShape);
                selectedShape = null;
            }
            
            isDrawing = false;
            redraw();
        });
        
        function isPointInShape(x, y, shape) {
            if (shape.type === 'rect') {
                return x >= shape.x && x <= shape.x + shape.width &&
                       y >= shape.y && y <= shape.y + shape.height;
            } else if (shape.type === 'circle') {
                const dist = Math.sqrt(Math.pow(x - shape.x, 2) + Math.pow(y - shape.y, 2));
                return dist <= shape.radius;
            }
            return false;
        }
        
        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            shapes.forEach(shape => {
                ctx.globalAlpha = shape.opacity || 1;
                ctx.fillStyle = shape.fillColor || '#00d4ff';
                ctx.strokeStyle = shape.strokeColor || '#00f5ff';
                ctx.lineWidth = shape.strokeWidth || 2;
                
                if (shape.type === 'rect') {
                    ctx.fillRect(shape.x, shape.y, shape.width, shape.height);
                    ctx.strokeRect(shape.x, shape.y, shape.width, shape.height);
                } else if (shape.type === 'circle') {
                    ctx.beginPath();
                    ctx.arc(shape.x, shape.y, shape.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else if (shape.type === 'text') {
                    ctx.font = `${shape.fontSize}px Arial`;
                    ctx.fillText(shape.text, shape.x, shape.y);
                }
            });
            
            ctx.globalAlpha = 1;
        }
        
        function applyProperties() {
            if (selectedShape) {
                selectedShape.fillColor = document.getElementById('fillColor').value;
                selectedShape.strokeColor = document.getElementById('strokeColor').value;
                selectedShape.strokeWidth = parseInt(document.getElementById('strokeWidth').value);
                selectedShape.opacity = parseInt(document.getElementById('opacity').value) / 100;
                redraw();
            }
        }
        
        function clearCanvas() {
            shapes = [];
            selectedShape = null;
            redraw();
        }
        
        function downloadCanvas() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'longhun-canvas.png';
            link.click();
        }
        
        function downloadSVG() {
            let svg = `<svg width="${canvas.width}" height="${canvas.height}" xmlns="http://www.w3.org/2000/svg">`;
            shapes.forEach(shape => {
                if (shape.type === 'rect') {
                    svg += `<rect x="${shape.x}" y="${shape.y}" width="${shape.width}" height="${shape.height}" fill="${shape.fillColor}" stroke="${shape.strokeColor}" stroke-width="${shape.strokeWidth}"/>`;
                } else if (shape.type === 'circle') {
                    svg += `<circle cx="${shape.x}" cy="${shape.y}" r="${shape.radius}" fill="${shape.fillColor}" stroke="${shape.strokeColor}" stroke-width="${shape.strokeWidth}"/>`;
                }
            });
            svg += '</svg>';
            const link = document.createElement('a');
            link.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            link.download = 'longhun-canvas.svg';
            link.click();
        }
    </script>
</body>
</html>
