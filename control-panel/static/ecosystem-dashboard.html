<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龍魂生态实时仪表盘</title>
<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #111827;
    --accent: #f59e0b;
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 18px 24px;
    background: linear-gradient(90deg, #1f2937, #111827);
    border-bottom: 1px solid #374151;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 22px; }
  h1 span { color: var(--accent); }
  .dna { color: var(--muted); font-size: 12px; }
  .refresh { color: var(--muted); font-size: 13px; }

  .grid {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 16px;
    padding: 16px;
    height: calc(100vh - 80px);
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; height: auto; }
  }

  .panel {
    background: var(--panel);
    border-radius: 12px;
    border: 1px solid #374151;
    padding: 16px;
    overflow: auto;
  }
  .panel h2 { margin: 0 0 14px 0; font-size: 16px; color: var(--accent); }

  .gauge {
    margin-bottom: 18px;
  }
  .gauge-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .bar { height: 10px; background: #374151; border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; transition: width 0.6s ease; }
  .low { background: var(--green); }
  .mid { background: var(--yellow); }
  .high { background: var(--red); }

  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px solid #1f2937;
  }
  .stat-row:last-child { border-bottom: none; }

  #network {
    width: 100%;
    height: 100%;
    min-height: 400px;
    border-radius: 12px;
    background: var(--panel);
  }

  .module-count { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .module-tag {
    display: inline-block;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 16px;
    padding: 4px 10px;
    margin: 4px 4px 0 0;
    font-size: 12px;
    color: var(--text);
    cursor: default;
  }
  .module-tag:hover { background: #374151; }

  .footer {
    padding: 10px 24px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid #374151;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>🐉 <span>龍魂生态</span> 实时仪表盘</h1>
    <div class="dna">DNA: #龍芯⚡️2026-06-18-LONGHUN-ECOSYSTEM-DASHBOARD-v1.0</div>
  </div>
  <div class="refresh">每 5 秒自动刷新 · 数据全部来自本地设备</div>
</header>

<div class="grid">
  <aside class="panel">
    <h2>🔥 本机资源消耗</h2>
    <div class="gauge">
      <div class="gauge-label"><span>CPU</span><span id="cpu-val">--%</span></div>
      <div class="bar"><div id="cpu-bar" class="bar-fill low" style="width:0%"></div></div>
    </div>
    <div class="gauge">
      <div class="gauge-label"><span>内存</span><span id="mem-val">--%</span></div>
      <div class="bar"><div id="mem-bar" class="bar-fill low" style="width:0%"></div></div>
    </div>
    <div class="gauge">
      <div class="gauge-label"><span>磁盘</span><span id="disk-val">--%</span></div>
      <div class="bar"><div id="disk-bar" class="bar-fill low" style="width:0%"></div></div>
    </div>

    <div class="stat-row"><span>已用内存</span><span id="mem-used">--</span></div>
    <div class="stat-row"><span>总内存</span><span id="mem-total">--</span></div>
    <div class="stat-row"><span>已用磁盘</span><span id="disk-used">--</span></div>
    <div class="stat-row"><span>总磁盘</span><span id="disk-total">--</span></div>
    <div class="stat-row"><span>系统</span><span id="os-info">--</span></div>
    <div class="stat-row"><span>设备名</span><span id="node-info">--</span></div>

    <h2 style="margin-top:24px">📦 可运行模块</h2>
    <div class="module-count" id="module-count">正在扫描...</div>
    <div id="module-tags"></div>
  </aside>

  <main class="panel" style="padding:0; overflow:hidden;">
    <div id="network"></div>
  </main>
</div>

<div class="footer">
  全部数据本地采集，不上传任何服务器 · 龍魂系统 · 全透明 · 中文 · 不跪 · 普惠
</div>

<script>
let network = null;

function colorForPercent(p) {
  if (p < 50) return '#10b981';
  if (p < 80) return '#f59e0b';
  return '#ef4444';
}
function classForPercent(p) {
  if (p < 50) return 'low';
  if (p < 80) return 'mid';
  return 'high';
}

function setGauge(id, percent, text) {
  const bar = document.getElementById(id + '-bar');
  const val = document.getElementById(id + '-val');
  bar.style.width = Math.min(percent, 100) + '%';
  bar.className = 'bar-fill ' + classForPercent(percent);
  val.textContent = text || (percent + '%');
  val.style.color = colorForPercent(percent);
}

async function loadData() {
  try {
    const res = await fetch('/api/system/status');
    const data = await res.json();

    // 资源
    const r = data.resources || {};
    if (!r.error) {
      setGauge('cpu', r.cpu_percent || 0);
      setGauge('mem', r.memory_percent || 0);
      setGauge('disk', r.disk_percent || 0);
      document.getElementById('mem-used').textContent = (r.memory_used_gb || 0) + ' GB';
      document.getElementById('mem-total').textContent = (r.memory_total_gb || 0) + ' GB';
      document.getElementById('disk-used').textContent = (r.disk_used_gb || 0) + ' GB';
      document.getElementById('disk-total').textContent = (r.disk_total_gb || 0) + ' GB';
    } else {
      document.getElementById('cpu-val').textContent = '未安装 psutil';
    }
    document.getElementById('os-info').textContent = (data.device && data.device.system) || '--';
    document.getElementById('node-info').textContent = (data.device && data.device.node) || '--';

    // 模块标签
    const modules = data.modules || [];
    document.getElementById('module-count').textContent = `共发现 ${modules.length} 个可运行入口`;
    const tagContainer = document.getElementById('module-tags');
    tagContainer.innerHTML = '';
    const seen = new Set();
    modules.forEach(m => {
      if (seen.has(m.名称)) return;
      seen.add(m.名称);
      const tag = document.createElement('span');
      tag.className = 'module-tag';
      tag.title = m.描述 || '';
      tag.textContent = m.名称;
      tagContainer.appendChild(tag);
    });

    // 生态图
    drawNetwork(data.ecosystem || {});
  } catch (e) {
    console.error('刷新失败', e);
  }
}

function drawNetwork(eco) {
  const container = document.getElementById('network');
  if (!eco.nodes) return;

  const nodes = new vis.DataSet(eco.nodes.map(n => ({
    id: n.id,
    label: n.label,
    title: n.title,
    group: n.group,
    shape: n.group === 'human' ? 'dot' : 'box',
    font: { color: '#e5e7eb', size: 14 },
    color: {
      background: groupColor(n.group),
      border: '#f59e0b',
      highlight: { background: '#f59e0b', border: '#fff' }
    }
  })));

  const edges = new vis.DataSet((eco.edges || []).map(e => ({
    from: e.from,
    to: e.to,
    label: e.label,
    arrows: 'to',
    color: { color: '#6b7280', highlight: '#f59e0b' },
    dashes: e.dashes || false,
    font: { color: '#9ca3af', size: 12, align: 'middle' }
  })));

  const options = {
    physics: {
      stabilization: false,
      barnesHut: { gravitationalConstant: -3000, springConstant: 0.04, springLength: 130 }
    },
    interaction: { hover: true, tooltipDelay: 100 },
    layout: { randomSeed: 2 }
  };

  if (network) {
    network.setData({ nodes, edges });
  } else {
    network = new vis.Network(container, { nodes, edges }, options);
    network.on("click", function (params) {
      if (params.nodes.length) {
        const node = nodes.get(params.nodes[0]);
        console.log('选中模块:', node.label, node.title);
      }
    });
  }
}

function groupColor(g) {
  const map = {
    human: '#ef4444',
    core: '#f59e0b',
    brain: '#8b5cf6',
    service: '#3b82f6',
    tool: '#10b981',
    skill: '#ec4899',
    guard: '#06b6d4'
  };
  return map[g] || '#6b7280';
}

loadData();
setInterval(loadData, 5000);
</script>

</body>
</html>
