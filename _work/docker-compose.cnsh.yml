# CNSH 翻译系统 Docker Compose 配置
# DNA: #龍芯⚡️2026-05-27-DOCKER-COMPOSE-CNSH-v1.0

version: '3.8'

services:
  # 主翻译系统
  cnsh-translator:
    build:
      context: .
      dockerfile: Dockerfile.cnsh
    container_name: cnsh-translator
    restart: unless-stopped
    environment:
      - LOG_LEVEL=INFO
      - NOTION_TOKEN=${NOTION_TOKEN}
      - DATABASE_ID=${DATABASE_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4
      - WORKER_PROCESSES=4
      - MAX_CONCURRENT_TASKS=5
      - QUEUE_SCAN_INTERVAL=5
    volumes:
      - ~/.cnsh/config/.env:/app/.env:ro
      - ~/.cnsh/logs:/var/log/cnsh
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cnsh-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis 缓存（可选）
  redis:
    image: redis:7-alpine
    container_name: cnsh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cnsh-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL 数据库（可选）
  postgres:
    image: postgres:15-alpine
    container_name: cnsh-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cnsh_db
      - POSTGRES_USER=cnsh
      - POSTGRES_PASSWORD=${DB_PASSWORD:-cnsh_default_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cnsh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnsh"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  cnsh-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
