[pytest]
# pytest 配置文件

# 测试路径
testpaths = tests

# 最小 Python 版本
minversion = 6.0

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    conflict: 冲突场景测试
    verification: 验证层测试
    query: 查询场景测试

# 覆盖率配置
# 需要 pytest-cov 插件
# [coverage:run]
# source = .
# omit =
#     tests/*
#     setup.py
