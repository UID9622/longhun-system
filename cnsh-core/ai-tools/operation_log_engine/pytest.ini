##龍芯⚡️2026-06-21-CORE-PYTEST-FILE1-v1.0-2
# 君子協議: 本文件受龍魂DNA追溯保護

[pytest]
# pytest 配置文件

# 測試路徑
testpaths = tests

# 最小 Python 版本
minversion = 6.0

# 輸出選項
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 標記定義
markers =
    unit: 單元測試
    integration: 集成測試
    conflict: 衝突場景測試
    verification: 驗證層測試
    query: 查詢場景測試

# 覆蓋率配置
# 需要 pytest-cov 插件
# [coverage:run]
# source = .
# omit =
#     tests/*
#     setup.py
