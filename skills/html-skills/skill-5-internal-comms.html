<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <title>💬 龍魂内部通讯系统 v1.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #151a3f 100%);
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 20px;
        }
        .header h1 {
            background: linear-gradient(90deg, #00d4ff, #00f5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5em;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }
        .messages-area {
            background: rgba(21, 26, 63, 0.8);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            max-height: 600px;
            overflow-y: auto;
        }
        .message {
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(0, 212, 255, 0.05);
            border-left: 4px solid #00d4ff;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .message:hover {
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
        .message.status-update { border-left-color: #4ade80; }
        .message.alert { border-left-color: #ff006e; }
        .message.info { border-left-color: #00d4ff; }
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .message-author {
            color: #00d4ff;
            font-weight: bold;
        }
        .message-time {
            color: #a0aec0;
            font-size: 0.85em;
        }
        .message-type {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 3px;
            font-size: 0.75em;
            color: #00d4ff;
            margin-top: 8px;
        }
        .message-content {
            color: #a0aec0;
            line-height: 1.6;
        }
        .compose-area {
            background: rgba(21, 26, 63, 0.8);
            border: 2px solid #ff006e;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            margin-top: 20px;
        }
        .compose-area h3 {
            color: #ff006e;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            color: #00d4ff;
            font-size: 0.9em;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            border-radius: 6px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: rgba(255, 0, 110, 0.1);
            border: 2px solid #ff006e;
            color: #ff006e;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: rgba(255, 0, 110, 0.2);
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.3);
        }
        .sidebar {
            background: rgba(21, 26, 63, 0.8);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .sidebar h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            border-bottom: 1px solid #00d4ff;
            padding-bottom: 10px;
        }
        .stat-item {
            padding: 12px;
            background: rgba(0, 212, 255, 0.05);
            border-left: 3px solid #00d4ff;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .stat-label {
            color: #a0aec0;
            font-size: 0.85em;
        }
        .stat-value {
            color: #00d4ff;
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 5px;
        }
        .team-member {
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #00d4ff;
            color: #0a0e27;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }
        .status-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: auto;
        }
        .status-badge.online { background: #4ade80; }
        .status-badge.busy { background: #facc15; }
        .status-badge.offline { background: #a0aec0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 龍魂内部通讯系统</h1>
            <p>DNA: #龍芯⚡️2026-06-07-INTERNAL-COMMS-v1.0</p>
            <p>实时消息·团队协作·状态更新·通知中心</p>
        </div>
        
        <div class="content">
            <div>
                <div class="messages-area" id="messagesArea">
                    <!-- 消息将动态插入这里 -->
                </div>
                
                <div class="compose-area">
                    <h3>✉️ 发送消息</h3>
                    
                    <div class="form-group">
                        <label>你的姓名</label>
                        <input type="text" id="senderName" placeholder="输入你的名字" value="UID9622">
                    </div>
                    
                    <div class="form-group">
                        <label>消息类型</label>
                        <select id="messageType">
                            <option value="info">📢 信息通知</option>
                            <option value="status-update">📊 状态更新</option>
                            <option value="alert">🚨 告警通知</option>
                            <option value="announcement">📣 系统公告</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>消息内容</label>
                        <textarea id="messageContent" placeholder="输入消息内容..."></textarea>
                    </div>
                    
                    <button onclick="sendMessage()">🚀 发送</button>
                </div>
            </div>
            
            <div class="sidebar">
                <h3>📊 统计信息</h3>
                
                <div class="stat-item">
                    <div class="stat-label">总消息数</div>
                    <div class="stat-value" id="totalMessages">0</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">未读通知</div>
                    <div class="stat-value" id="unreadCount">0</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">活跃成员</div>
                    <div class="stat-value" id="activeMembers">0</div>
                </div>
                
                <h3 style="margin-top: 30px;">👥 团队成员</h3>
                <div id="teamMembers">
                    <div class="team-member">
                        <div class="avatar">龍</div>
                        <span>龍芯北辰</span>
                        <div class="status-badge online"></div>
                    </div>
                    <div class="team-member">
                        <div class="avatar">宝</div>
                        <span>宝宝系统</span>
                        <div class="status-badge online"></div>
                    </div>
                    <div class="team-member">
                        <div class="avatar">主</div>
                        <span>主控器</span>
                        <div class="status-badge online"></div>
                    </div>
                </div>
                
                <h3 style="margin-top: 30px;">🔔 快速操作</h3>
                <button onclick="loadSampleMessages()" style="background: rgba(0,212,255,0.1); border-color: #00d4ff; color: #00d4ff;">📥 加载示例</button>
                <button onclick="clearMessages()" style="background: rgba(255,0,110,0.1); border-color: #ff006e; color: #ff006e; margin-top: 10px;">🗑️ 清空消息</button>
            </div>
        </div>
    </div>
    
    <script>
        let messages = [];
        
        function sendMessage() {
            const sender = document.getElementById('senderName').value || '匿名';
            const type = document.getElementById('messageType').value;
            const content = document.getElementById('messageContent').value;
            
            if (!content.trim()) {
                alert('请输入消息内容');
                return;
            }
            
            const message = {
                id: Date.now(),
                sender: sender,
                type: type,
                content: content,
                time: new Date().toLocaleTimeString('zh-CN'),
                read: false
            };
            
            messages.unshift(message);
            document.getElementById('messageContent').value = '';
            updateMessages();
            updateStats();
        }
        
        function updateMessages() {
            const container = document.getElementById('messagesArea');
            container.innerHTML = messages.map(msg => {
                const typeEmoji = {
                    'info': '📢',
                    'status-update': '📊',
                    'alert': '🚨',
                    'announcement': '📣'
                };
                
                return `
                    <div class="message ${msg.type}">
                        <div class="message-header">
                            <span class="message-author">${typeEmoji[msg.type]} ${msg.sender}</span>
                            <span class="message-time">${msg.time}</span>
                        </div>
                        <div class="message-content">${msg.content}</div>
                        <div class="message-type">${msg.type}</div>
                    </div>
                `;
            }).join('');
        }
        
        function updateStats() {
            document.getElementById('totalMessages').textContent = messages.length;
            document.getElementById('unreadCount').textContent = messages.filter(m => !m.read).length;
            document.getElementById('activeMembers').textContent = new Set(messages.map(m => m.sender)).size;
        }
        
        function loadSampleMessages() {
            messages = [
                {
                    id: 1,
                    sender: '龍芯北辰',
                    type: 'announcement',
                    content: '🐉 龍魂系統 Phase 3 已完成！',
                    time: new Date().toLocaleTimeString('zh-CN'),
                    read: true
                },
                {
                    id: 2,
                    sender: '宝宝系统',
                    type: 'status-update',
                    content: '📊 系统状态: 全部模块运行正常，CPU占用率 35%',
                    time: new Date().toLocaleTimeString('zh-CN'),
                    read: false
                },
                {
                    id: 3,
                    sender: '主控器',
                    type: 'info',
                    content: '✅ DNA链验证成功，所有签章有效',
                    time: new Date().toLocaleTimeString('zh-CN'),
                    read: false
                }
            ];
            updateMessages();
            updateStats();
        }
        
        function clearMessages() {
            if (confirm('确定要清空所有消息吗？')) {
                messages = [];
                updateMessages();
                updateStats();
            }
        }
        
        // 初始化
        loadSampleMessages();
    </script>
</body>
</html>
