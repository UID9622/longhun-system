serverAddr = "119.13.90.27"
serverPort = 7000

auth.method = "token"
auth.token = "YOUR_FRP_AUTH_TOKEN_HERE"

transport.protocol = "kcp"
transport.tls.enable = true

log.to = "/Users/zuimeidedeyihan/longhun-system/logs/frpc.log"
log.level = "warn"
log.maxDays = 3

