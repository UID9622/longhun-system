# ════════════════════════════════════════════════════════
# HTTPS 443 · api.uid9622.cn → 核心 API
# ════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.uid9622.cn;

    ssl_certificate /etc/letsencrypt/live/uid9622.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uid9622.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_API:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8777/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        limit_req zone=lh_api_limit burst=50 nodelay;
    }
}
