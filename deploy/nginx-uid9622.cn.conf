    # ============================================================
    # 三色审计在线演示
    # ============================================================
    location /demo/tricolor/ {
        proxy_pass http://127.0.0.1:9877/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header X-Longhun-Service "tricolor-demo";
        add_header X-Data-Sovereignty "China-HuaweiCloud-Kunpeng";
    }

    # ════════════════════════════════════════════════════
    # 流量拓扑交付包 · 增量路由 (flow_* zone/upstream 见 conf.d 片段)
    # ════════════════════════════════════════════════════
    location = /auth/verify {
        internal;
        proxy_pass http://flow_longhun_api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Dragon-DNA $http_x_dragon_dna;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /health/flow {
        access_log off;
        default_type text/plain;
        return 200 "🐉 龍魂流量拓扑运行正常\n";
    }

    location /collab/api/ {
        limit_req zone=flow_api_limit burst=20 nodelay;
        proxy_pass http://flow_longhun_collab/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Dragon-DNA $http_x_dragon_dna;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /handoffs/ {
        auth_request /auth/verify;
        alias /opt/longhun/shared/handoffs/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-store" always;
    }

    location /protocols/ {
        auth_request /auth/verify;
        alias /opt/longhun/shared/collaboration/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-store" always;
    }

    location = /chat {
        auth_request /auth/verify;
        limit_req zone=flow_chat_limit burst=10 nodelay;
        proxy_pass http://flow_longhun_bridge/api/v1/chat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Dragon-DNA $http_x_dragon_dna;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /chat/ {
        auth_request /auth/verify;
        limit_req zone=flow_chat_limit burst=10 nodelay;
        proxy_pass http://flow_longhun_bridge/api/v1/chat/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Dragon-DNA $http_x_dragon_dna;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }}

# ════════════════════════════════════════════════════════
# HTTPS 443 · api.uid9622.cn → 核心 API
# ════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.uid9622.cn;

    ssl_certificate /etc/letsencrypt/live/uid9622.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uid9622.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_API:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


    # ════════════════════════════════════════════════════
    # 多源搜索引擎 · api.uid9622.cn/search?q= → :9631
    # ════════════════════════════════════════════════════
    location /search {
        proxy_pass http://127.0.0.1:9631/search;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Longhun-Service "search-engine" always;
        add_header X-Data-Sovereignty "China-HuaweiCloud-Kunpeng" always;
    }

    # ════════════════════════════════════════════════════
    # 量子卦象 · api.uid9622.cn/quantum/* → :9000
    # ════════════════════════════════════════════════════
    location /quantum/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Longhun-Service "quantum-api" always;
        add_header X-Data-Sovereignty "China-HuaweiCloud-Kunpeng" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8777/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        limit_req zone=lh_api_limit burst=50 nodelay;
    }
    # ════════════════════════════════════════════════════
    # 统一门户官网 · uid9622.cn/portal/* → 127.0.0.1:8789
    # ════════════════════════════════════════════════════
    location /portal/ {
        proxy_pass http://127.0.0.1:8789/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header X-Longhun-Service "portal-api" always;
        add_header X-Data-Sovereignty "China-HuaweiCloud-Kunpeng" always;
    }

}
