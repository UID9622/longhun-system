# 🐉 龍魂 · uid9622.cn 域名 Nginx 配置
# DNA: #龍芯⚡️2026-07-17-UID9622-NGINX-v3.0-HTTPS
#
# 子域名映射：
#   uid9622.cn / www.uid9622.cn / dashboard.uid9622.cn → Dashboard (127.0.0.1:9627)
#   api.uid9622.cn                                       → 核心 API (127.0.0.1:8777)
#   pay.uid9622.cn                                       → 支付锚定 (127.0.0.1:19623)
#
# 部署路径：/etc/nginx/conf.d/uid9622.cn.conf

# ═══════════════════════════════════════════════════
# HTTP 80 · 所有域名 · ACME + HTTP→HTTPS 跳转
# ═══════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name uid9622.cn www.uid9622.cn dashboard.uid9622.cn api.uid9622.cn pay.uid9622.cn;

    # ACME 挑战（Certbot 验证）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════════════════════════════════════
# HTTPS 443 · uid9622.cn / www / dashboard → Dashboard
# ═══════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uid9622.cn www.uid9622.cn dashboard.uid9622.cn pay.uid9622.cn;

    ssl_certificate /etc/letsencrypt/live/uid9622.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uid9622.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 支付锚定
    location /pay-anchor/ {
        proxy_pass http://127.0.0.1:19623/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header X-Data-Location "China-HuaweiCloud-Kunpeng" always;
        add_header X-Longhun-Immutable "true" always;
    }

    # 🐉 龍魂宇宙 · 1650万路径3D可视化
    location /universe {
        alias /var/www/longhun-universe;
        index index.html;
        try_files $uri $uri/ /universe/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Longhun-Universe "1650万路径";
        add_header X-Data-Sovereignty "China-HuaweiCloud-Kunpeng";
        add_header X-UID "9622-Lucky";
    }

    # 龍魂 Dashboard
    location / {
        proxy_pass http://127.0.0.1:9627;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 路由（uid9622.cn/api/* → 127.0.0.1:8777/*）
    location /api/ {
        proxy_pass http://127.0.0.1:8777/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ═══════════════════════════════════════════════════
# HTTPS 443 · api.uid9622.cn → 核心 API
# ═══════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.uid9622.cn;

    ssl_certificate /etc/letsencrypt/live/uid9622.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uid9622.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8777/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
