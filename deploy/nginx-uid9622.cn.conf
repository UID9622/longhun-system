# 🐉 龍魂 · uid9622.cn 域名 Nginx 配置
# DNA: #龍芯⚡️2026-08-03-UID9622-NGINX-v3.6-KNOWLEDGE-MATRIX-f1a2b3c4
# 创建者: 诸葛鑫（UID9622）
# 协议: CC BY-NC-SA 4.0
#
# 子域名映射：
#   uid9622.cn / www.uid9622.cn / dashboard.uid9622.cn → Dashboard (127.0.0.1:9627)
#   api.uid9622.cn                                       → 核心 API (127.0.0.1:8777)
#   pay.uid9622.cn                                       → 支付锚定 (127.0.0.1:19623)
#   /xiaoyi/                                             → 小艺桥接 FRP (127.0.0.1:18799 → Mac本地)
#   /api/v1/li/                                          → 知识中枢 API (127.0.0.1:8766)
#   /warp-lab/                                           → 曲速引擎推演舱·静态门户 (本地文件)
#   /five-harms-expose/                                  → 五害曝光台·静态门户 (本地文件)
#   /five-harms/api/                                     → 五害曝光台·API (127.0.0.1:8779)
#   /audit-battle-hub/                                   → 审计对抗中枢·静态门户 (本地文件)
#   /api/audit/                                          → 审计对抗中枢 API (127.0.0.1:9657)
#
# 部署路径：/etc/nginx/conf.d/uid9622.cn.conf
# 部署命令：scp 此文件 → 鲲鹏 /etc/nginx/conf.d/uid9622.cn.conf → nginx -t → nginx -s reload

# ════════════════════════════════════════════════════════
# 全局限流区（API防护）
# ════════════════════════════════════════════════════════
limit_req_zone $binary_remote_addr zone=lh_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=lh_xiaoyi_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=lh_conn_limit:10m;

# ════════════════════════════════════════════════════════
# HTTP 80 · 所有域名 · ACME + HTTP→HTTPS 跳转
# ════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name uid9622.cn www.uid9622.cn dashboard.uid9622.cn api.uid9622.cn pay.uid9622.cn;

    # ACME 挑战（Certbot 验证）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ════════════════════════════════════════════════════════
# HTTPS 443 · uid9622.cn / www / dashboard / pay
# ════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uid9622.cn www.uid9622.cn dashboard.uid9622.cn pay.uid9622.cn;

    # ── SSL 证书 ──
    ssl_certificate /etc/letsencrypt/live/uid9622.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uid9622.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 安全头 ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 通用代理设置 ──
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ════════════════════════════════════════════════════
    # 小艺桥接 · FRP穿透 Mac→鲲鹏
    # 链路: 公网 → nginx:443 → 127.0.0.1:18799(frps) → Mac本地小艺
    # 验证: curl https://uid9622.cn/xiaoyi/api/v1/xiaoyi/status
    # ════════════════════════════════════════════════════
    location /xiaoyi {
        # 无末尾斜杠 → 301加斜杠（保证 /api/ 路径转发正确）
        return 301 /xiaoyi/;
    }

    location /xiaoyi/ {
        proxy_pass http://127.0.0.1:18799/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        limit_req zone=lh_xiaoyi_limit burst=20 nodelay;
        limit_conn lh_conn_limit 10;
    }

    # ════════════════════════════════════════════════════
    # 支付锚定
    # ════════════════════════════════════════════════════
    location /pay-anchor/ {
        proxy_pass http://127.0.0.1:19623/;
        proxy_read_timeout 30s;
        add_header X-Data-Location "China-HuaweiCloud-Kunpeng" always;
        add_header X-Longhun-Immutable "true" always;
    }

    # ════════════════════════════════════════════════════
    # 龍魂宇宙 · 1650万路径3D可视化
    # ════════════════════════════════════════════════════
    location /universe {
        alias /var/www/longhun-universe;
        index index.html;
        try_files $uri $uri/ /universe/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Longhun-Universe "1650万路径";
        add_header X-Data-Sovereignty "China-HuaweiCloud-Kunpeng";
        add_header X-UID "9622-Lucky";
    }

    # ════════════════════════════════════════════════════
    # 曲速引擎推演舱 · 3D交互可视化
    # ════════════════════════════════════════════════════
    location /warp-lab/ {
        alias /opt/longhun-system/portal/warp-lab/;
        index index.html;
        try_files $uri $uri/ /warp-lab/index.html;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Longhun-Service "warp-field-lab";
        add_header X-Data-Sovereignty "China-HuaweiCloud-Kunpeng";
    }

    # ════════════════════════════════════════════════════
    # 五害曝光台 · 静态门户 + API · 必须在 /api/ 和 / 之前
    # ════════════════════════════════════════════════════
    # 静态门户
    location /five-harms-expose/ {
        alias /opt/longhun-system/portal/five-harms-expose/;
        index index.html;
        try_files $uri $uri/ /five-harms-expose/index.html;
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Longhun-Service "five-harms-expose";
    }

    # API · 工具包下载/举报提交/企业验证
    location /five-harms/api/ {
        proxy_pass http://127.0.0.1:8779/api/;
        proxy_read_timeout 30s;
        add_header X-Data-Location "China-HuaweiCloud-Kunpeng" always;
        add_header X-Longhun-Service "five-harms-api" always;
    }

    # ════════════════════════════════════════════════════
    # 龍魂审计对抗中枢 · 左右互搏 + 红蓝对抗 + 数学建模
