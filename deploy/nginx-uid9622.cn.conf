# 🐉 龍魂 · uid9622.cn 域名 Nginx 配置
# DNA: #龍芯⚡️2026-07-06-UID9622-NGINX-v2.0
#
# 子域名映射：
#   uid9622.cn / www.uid9622.cn → Dashboard (127.0.0.1:9627)
#   dashboard.uid9622.cn        → Dashboard (127.0.0.1:9627)
#   api.uid9622.cn              → 核心 API (127.0.0.1:8777)
#
# 部署路径：/etc/nginx/conf.d/uid9622.cn.conf
# ⚠ HTTPS 部分待域名实名审核完成后启用（certbot --nginx -d uid9622.cn -d ...）

# ═══ HTTP 80 · 直接服务（等域名审核通过后，HTTPS 部分将接管） ═══
server {
    listen 80;
    listen [::]:80;
    server_name uid9622.cn www.uid9622.cn dashboard.uid9622.cn api.uid9622.cn;

    # ACME 挑战（Certbot / Let's Encrypt 验证用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 子域名路由
    # ── api.uid9622.cn → 核心 API ──
    if ($host = api.uid9622.cn) {
        rewrite ^/(.*) /api/$1 last;
    }

    # ── 默认 → 龍魂 Dashboard ──
    location / {
        proxy_pass http://127.0.0.1:9627;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API 路由 ──
    location /api/ {
        proxy_pass http://127.0.0.1:8777/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

