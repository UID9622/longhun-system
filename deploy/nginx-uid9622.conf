# 🐉 龍魂 · uid9622.cn 域名 Nginx 入口配置
# DNA: #龍芯⚡️2026-07-06-UID9622-NGINX-v1.0
#
# 用途：将 uid9622.cn / www.uid9622.cn / dashboard.uid9622.cn / api.uid9622.cn
# 全部指向华为云服务器 119.13.90.27，并反代到龍魂后台服务。
#
# 部署路径：/etc/nginx/conf.d/uid9622.cn.conf
# 依赖服务：
#   - Dashboard  http://127.0.0.1:9627
#   - 核心 API   http://127.0.0.1:8777
#   - 静态门户   /var/www/portal（可选）

# ── HTTP 80 端口：统一跳转 HTTPS ──
server {
    listen 80;
    server_name uid9622.cn www.uid9622.cn dashboard.uid9622.cn api.uid9622.cn;

    # ACME 挑战（Certbot / Let's Encrypt 验证用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部 301 跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主域名：龍魂操作台 ──
server {
    listen 443 ssl http2;
    server_name uid9622.cn www.uid9622.cn;

    # SSL 证书路径（需按实际部署替换）
    ssl_certificate     /etc/nginx/ssl/uid9622.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/uid9622.cn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态门户（可选）
    root /var/www/portal;
    index index.html;

    # 默认反代到 Dashboard
    location / {
        proxy_pass http://127.0.0.1:9627;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 核心 API
    location /api/ {
        proxy_pass http://127.0.0.1:8777/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

