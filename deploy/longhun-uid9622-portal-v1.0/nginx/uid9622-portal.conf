# 龍魂·uid9622.cn 三入口门户 Nginx 配置
# DNA: #龍芯⚡️丙午·甲申·丁未·离为火-Nginx-v1.0
# 确认码: #CONFIRM🌌9622-ONLY-ONCE🧬LK9X-772Z

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name www.uid9622.cn uid9622.cn;
    
    location / {
        return 301 https://$host$request_uri;
    }
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# HTTPS 主站点
server {
    listen 443 ssl http2;
    server_name www.uid9622.cn uid9622.cn;
    
    # SSL (Certbot)
    ssl_certificate /etc/letsencrypt/live/uid9622.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uid9622.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # 安全响应头
    include /etc/nginx/security-headers.conf;
    
    # 日志
    access_log /var/log/nginx/uid9622-access.log;
    error_log /var/log/nginx/uid9622-error.log;
    
    # 根目录
    root /var/www/uid9622;
    index index.html knowledge.html;
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # === 普通者入口 (默认) ===
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # === 无障碍入口 ===
    location /accessible/ {
        alias /var/www/uid9622/accessible.html;
        default_type text/html;
        try_files $uri $uri/ =404;
    }
    
    # === 开发者入口 ===
    location /developer/ {
        alias /var/www/uid9622/developer.html;
        default_type text/html;
        try_files $uri $uri/ =404;
    }
    
    # API 代理 (DNA 验证服务器)
    location /api/dna/ {
        proxy_pass http://127.0.0.1:7000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=api_limit burst=20 nodelay;
        limit_except GET POST { deny all; }
    }
    
    # 禁止敏感路径
    location ~ /\.(git|env|ssh|DS_Store) { deny all; return 404; }
    location ~ ^/(admin|manage|wp-admin|phpmyadmin) { deny all; return 404; }
    
    # 错误页面
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
