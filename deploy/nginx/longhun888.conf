# ── 速率限制 ──
limit_req_zone $binary_remote_addr zone=lh888_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=lh888_conn:10m;

# ── HTTP 站点（Cloudflare 终止 HTTPS，源站用 80）──
server {
    listen 80;
    listen [::]:80;
    server_name longhun888.com www.longhun888.com;

    charset utf-8;

    root /var/www/longhun888.com;
    index index.html;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 速率限制
    limit_req zone=lh888_req burst=20 nodelay;
    limit_conn lh888_conn 20;

    # ── 静态文件 ──
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ── CNSH API 反代 → :3000 ──
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ── 健康检查 ──
    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.IO WebSocket ──
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ── 龍魂门户（保留兼容）──
    location /portal/ {
        alias /opt/longhun/portal/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ── 行为密码学仪表盘 ──
    location /bcm/ {
        alias /opt/longhun/portal/;
        index behavioral-crypto.html;
        try_files /behavioral-crypto.html =404;
    }

    # 错误页
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
