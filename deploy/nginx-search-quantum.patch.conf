    # ════════════════════════════════════════════════════
    # 多源搜索引擎 · api.uid9622.cn/search?q= → :9631
    # ════════════════════════════════════════════════════
    location /search {
        proxy_pass http://127.0.0.1:9631/search;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Longhun-Service "search-engine" always;
        add_header X-Data-Sovereignty "China-HuaweiCloud-Kunpeng" always;
    }

    # ════════════════════════════════════════════════════
    # 量子卦象 · api.uid9622.cn/quantum/* → :9000
    # ════════════════════════════════════════════════════
    location /quantum/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Longhun-Service "quantum-api" always;
        add_header X-Data-Sovereignty "China-HuaweiCloud-Kunpeng" always;
    }
