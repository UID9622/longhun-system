---
# ===== ConfigMap: 龍魂核心配置（焊死锚点） =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: longhun-core-config
  namespace: longhun
  labels:
    app: longhun
    layer: L0-base
data:
  # === 身份焊死 ===
  UID: "9622"
  SOVEREIGN: "诸葛鑫·Lucky·龍芯北辰"
  DNA_ROOT: "#龍芯⚡️丙午·丙申·戊申·亥时·䷗复-K3S-BASE-v1.0"
  CONFIRM_CODE: "#CONFIRM🌌9622-ONLY-ONCE🧬LK9X-772Z"
  GPG_FINGERPRINT: "A2D0092CEE2E5BA87035600924C3704A8CC26D5F"

  # === 底座锚点 ===
  FIXED_POINT_369: "sn=369,log369=5.911,perm369=108"
  TRIGRAM_BASE: "䷗复（地雷复·万物复苏）"

  # === 域名 ===
  DOMAIN_PRIMARY: "uid9622.cn"
  DOMAIN_BACKUP: "longhun888.com"

  # === 端口分配 ===
  PORT_KNOWLEDGE_HUB: "8766"
  PORT_MEMORY_API: "8773"
  PORT_SEARCH_ENGINE: "9631"
  PORT_DASHBOARD: "9627"
  PORT_OLLAMA: "11434"
  PORT_HEALTH_CHECKER: "8099"

  # === 数据路径 ===
  DATA_BASE: "/opt/longhun-system"
  MODELS_DIR: "/opt/longhun-system/models"
  LOGS_DIR: "/opt/longhun-system/logs"
  KEY_VAULT: "/opt/longhun/data/quantum_keys/"

  # === 协议版本 ===
  GOVERNANCE_VERSION: "v1.4"
  ALIGNMENT_RULES_VERSION: "v2.4"

  # === 分层许可证 ===
  LICENSE_CORE: "CC BY-NC-SA 4.0"
  LICENSE_CODE: "MulanPSL v2"

  # === 熔断阈值 ===
  MELTDOWN_L3_MAX_FAILURES: "3"
  MELTDOWN_L3_WEIGHT_DRIFT_MAX: "20"
  AUDIT_YELLOW_RECHECK_HOURS: "48"

---
# ===== Secret: 敏感配置引用 =====
apiVersion: v1
kind: Secret
metadata:
  name: longhun-secrets
  namespace: longhun
  labels:
    app: longhun
    layer: L0-secure
type: Opaque
stringData:
  KEY_VAULT_PATH: "/opt/longhun/data/quantum_keys/"
  GPG_KEY_ID: "A2D0092CEE2E5BA87035600924C3704A8CC26D5F"

---
# ===== ServiceAccount: 龍魂运维 =====
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhun-operator
  namespace: longhun
  labels:
    app: longhun
    role: operator

---
# ===== Role: 命名空间权限 =====
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhun-operator
  namespace: longhun
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# ===== RoleBinding =====
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhun-operator
  namespace: longhun
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: longhun-operator
subjects:
- kind: ServiceAccount
  name: longhun-operator
  namespace: longhun
