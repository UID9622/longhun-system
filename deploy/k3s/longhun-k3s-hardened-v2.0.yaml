---
apiVersion: v1
kind: Namespace
metadata:
  name: longhun-local
  labels:
    app: longhun
    purpose: local-track
    dna-version: longhun-k3s-local-v2
  annotations:
    longhun.sovereignty/dna: "#龍芯⚡️丙午·甲申·己亥·䷁坤-K3S-LOCAL-TRACK"
    longhun.sovereignty/description: "本地轨-Nginx-systemd桥接-非API用途"
---
apiVersion: v1
kind: Namespace
metadata:
  name: longhun-api
  labels:
    app: longhun
    purpose: api-track
    dna-version: longhun-k3s-api-v2
  annotations:
    longhun.sovereignty/dna: "#龍芯⚡️丙午·甲申·己亥·䷁坤-K3S-API-TRACK"
    longhun.sovereignty/description: "API轨-对外API接入-外部可访问"

---
# ============================================================
# L0: NetworkPolicy 双轨隔离
# ============================================================
# 原则: local-track 只能与 core 通信，不能与 api-track 通信，反之亦然
# 必须先部署网络插件 (Calico/Cilium) 才能生效

# P0: 默认拒绝所有 ingress（core命名空间）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhun-default-deny
  namespace: longhun
  labels:
    dna-label: "longhun-np-deny-v2"
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# P1: 允许同命名空间内通信
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhun-allow-same-ns
  namespace: longhun
  labels:
    dna-label: "longhun-np-samens-v2"
spec:
  podSelector: {}
  ingress:
  - from:
    - podSelector: {}
  policyTypes:
  - Ingress

---
# P2: 允许 Nginx hostPort 桥接 (通过 hostNetwork)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhun-allow-nginx-bridge
  namespace: longhun
  labels:
    dna-label: "longhun-np-nginx-v2"
spec:
  podSelector: {}
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 80
      protocol: TCP
    - port: 443
      protocol: TCP
  policyTypes:
  - Ingress

