---
# ============================================================
# L0: ServiceAccount + RBAC
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhun-operator
  namespace: longhun
  labels:
    app: longhun
    role: operator
    dna-label: "longhun-sa-v2"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhun-operator
  namespace: longhun
  labels:
    dna-label: "longhun-role-v2"
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhun-operator
  namespace: longhun
  labels:
    dna-label: "longhun-rb-v2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: longhun-operator
subjects:
- kind: ServiceAccount
  name: longhun-operator
  namespace: longhun

---
# ============================================================
# L0: PVC 共享存储（加固：备份标签）
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhun-data-pvc
  namespace: longhun
  labels:
    app: longhun
    layer: L0-storage
    dna-label: "longhun-pvc-v2"
  annotations:
    backup.schedule: "daily-0200"
    backup.retention: "7d"
    backup.target: "/opt/longhun-system/backups/"
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
# ============================================================
# L1: Deployment 健康巡检（加固：探针 + 指标注解）
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhun-health-checker
  namespace: longhun
  labels:
    app: longhun
    component: health-checker
    layer: L1-monitoring
    dna-label: "longhun-deploy-health-v2"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
    tricolor-audit: "🟢"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: longhun
      component: health-checker
  template:
    metadata:
      labels:
        app: longhun
        component: health-checker
        dna-label: "longhun-pod-health-v2"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: longhun-operator
      containers:
      - name: health-checker
        image: python:3.11-slim
        command:
        - /bin/bash
        - -c
        - |
          pip install requests --quiet
          python3 -c "
          import http.server, json, time, os
          from urllib.request import urlopen

          class HealthHandler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/health':
                      self.send_response(200)
                      self.send_header('Content-Type','application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({'status':'ok','service':'longhun-health-checker'}).encode())
                  elif self.path == '/metrics':
                      self.send_response(200)
                      self.send_header('Content-Type','text/plain')
                      self.end_headers()
                      self.wfile.write('# HELP longhun_up 龍魂健康状态\n'.encode('utf-8'))
                      self.wfile.write(b'# TYPE longhun_up gauge\n')
                      self.wfile.write(b'longhun_up 1\n')
                      self.wfile.write('# HELP longhun_audit_pass 三色审计通过次数\n'.encode('utf-8'))
                      self.wfile.write(b'# TYPE longhun_audit_pass counter\n')
                      self.wfile.write(b'longhun_audit_pass_total 0\n')
                  else:
                      self.send_response(404)
                      self.end_headers()

          server = http.server.HTTPServer(('0.0.0.0', 9090), HealthHandler)
          server.serve_forever()
          " &
          echo "[$(date -Iseconds)] 💚 龍魂健康巡检启动"
          while true; do
            echo "[$(date -Iseconds)] 巡检中..."
            sleep 60
          done
        ports:
        - containerPort: 9090
          name: metrics
          protocol: TCP
        # === 加固：liveness/readiness 探针 ===
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      restartPolicy: Always

---
# ============================================================
# L1: CronJob 定时审计（加固：DNA标签 + 三色注解）
# ============================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhun-daily-audit
  namespace: longhun
  labels:
    app: longhun
    component: audit
    layer: L1-audit
    dna-label: "longhun-cj-audit-v2"
  annotations:
    tricolor-audit: "🟢"
    audit.type: "periodic"
    audit.frequency: "every-6h"
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            dna-label: "longhun-job-audit-v2"
        spec:
          containers:
          - name: audit-runner
            image: python:3.11-slim
            command:
            - /bin/bash
            - -c
            - |
              pip install requests --quiet
              echo "[$(date -Iseconds)] 🐉 龍魂定时审计触发"
              # 三色审计入口
              python3 -c "
              import requests, sys
              checks = {
                  '知识中枢': 'http://127.0.0.1:8766/health',
                  '记忆API': 'http://127.0.0.1:8773/health',
                  '搜索引擎': 'http://127.0.0.1:9631/health',
              }
              passed = 0
              failed = 0
              for name, url in checks.items():
                  try:
                      r = requests.get(url, timeout=5)
                      if r.status_code == 200:
                          print(f'  🟢 [{name}] OK')
                          passed += 1
                      else:
                          print(f'  🟡 [{name}] {r.status_code}')
                          failed += 1
                  except Exception as e:
                      print(f'  🔴 [{name}] 不可达: {e}')
                      failed += 1
              print(f'结果: 🟢{passed} 🟡0 🔴{failed}')
              sys.exit(0 if failed == 0 else 1)
              "
              echo "[$(date -Iseconds)] 审计完成"
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "128Mi"
                cpu: "100m"
          restartPolicy: OnFailure

---
# ============================================================
# L1: CronJob PVC 备份（加固新增）
# ============================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhun-pvc-backup
  namespace: longhun
  labels:
    app: longhun
    component: backup
    layer: L1-backup
    dna-label: "longhun-cj-backup-v2"
  annotations:
    backup.type: "pvc-snapshot"
    backup.retention: "7d"
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            dna-label: "longhun-job-backup-v2"
        spec:
          containers:
          - name: backup-runner
            image: alpine:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "[$(date -Iseconds)] 📦 PVC备份开始"
              cd /data || exit 1
              BACKUP_DIR="/opt/longhun-system/backups"
              BACKUP_NAME="longhun-backup-$(date +%Y%m%d-%H%M%S).tar.gz"
              mkdir -p "$BACKUP_DIR"
              tar -czf "$BACKUP_DIR/$BACKUP_NAME" .
              # 保留最近7天备份
              find "$BACKUP_DIR" -name "*.tar.gz" -mtime +7 -delete
              COUNT=$(ls "$BACKUP_DIR"/*.tar.gz 2>/dev/null | wc -l)
              echo "[$(date -Iseconds)] ✅ 备份完成: ${BACKUP_NAME} (保留${COUNT}份)"
            volumeMounts:
            - name: data
              mountPath: /data
          restartPolicy: OnFailure
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: longhun-data-pvc

