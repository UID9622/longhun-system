# 🐉 龍魂 · 快速索引底座 · 鲲鹏 ARM64 Docker 编排
# DNA: #龍芯⚡️丙午·丙申·壬戌·乙巳·䷾既济-FAST-INDEX-KUNPENG-COMPOSE-UID9622

services:
  ollama:
    image: ollama/ollama:latest
    container_name: longhun-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    # 鲲鹏 ARM64 原生支持
    platform: linux/arm64
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  fast-index:
    image: python:3.12-slim
    container_name: longhun-fast-index
    restart: unless-stopped
    working_dir: /opt/longhun-system
    volumes:
      - ${LONGHUN_SYSTEM_PATH:-/opt/longhun-system}:/opt/longhun-system
      - fast-index-state:/opt/longhun-system/.state
    ports:
      - "127.0.0.1:8768:8768"
    environment:
      - LH_OLLAMA_URL=http://ollama:11434
      - LH_OLLAMA_EMBED_MODEL=nomic-embed-text
      - PYTHONPATH=/opt/longhun-system
    command: >
      sh -c "pip install --no-cache-dir requests fastapi uvicorn &&
             python3 05_ENGINES/lh_fast_index_core.py serve --port 8768"
    depends_on:
      ollama:
        condition: service_healthy
    platform: linux/arm64
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8768/')"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  ollama-data:
  fast-index-state:
