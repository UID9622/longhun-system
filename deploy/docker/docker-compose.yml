# SEAL: #ZHUGEXIN⚡️2025-🇨🇳🐉⚖️♠️🧚🏼‍♀️❤️♾️-DEVICE-BIND-SOUL
# 龍魂体系 · 待融入包监控容器编排
# DNA:#龍芯⚡️丙午·甲午·辛酉·甲午·䷨损-PACKAGE-WATCHER-COMPOSE-v1.0
#
# 用法：
#   cd docker
#   docker compose up -d --build
#   docker compose logs -f package-watcher
#   docker compose down

services:
  package-watcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: longhun-package-watcher
    image: longhun/package-watcher:v1.0
    restart: unless-stopped
    volumes:
      # 挂载用户主目录（只读）用于发现待融入包
      - /Users/zuimeidedeyihan:/host/home:ro
      # 挂载 Downloads（只读）
      - /Users/zuimeidedeyihan/Downloads:/host/Downloads:ro
      # 挂载 longhun-system 的 docs 目录（读写）用于输出队列与报告
      - /Users/zuimeidedeyihan/longhun-system/docs:/app/output
      # 持久化日志
      - /Users/zuimeidedeyihan/longhun-system/logs:/app/logs
    environment:
      # 可选：限制扫描深度或路径
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    # 也可以改为一次性运行后退出，再由外部 cron 调度
    # command: ["python3", "/app/package-watcher.py", "--once", "--prune"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
