# 🐉 龍魂 · 默认站点（IP直连 + 鲲鹏本地服务优先）
# 任何未匹配的域名（包括 IP 直连）都到这里
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    charset utf-8;

    # 🏠 Portal 门户 — 本地5002→隧道8090
    location /local/ {
        rewrite ^/local/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── 龍魂视频工坊 / 引擎主控仪表盘（鲲鹏本地服务）──
    location /video-studio/ {
        alias /opt/longhun/portal/video-studio/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    location /dashboard/ {
        alias /opt/longhun/portal/dashboard/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # 🧭 龍魂路径规划推演舱
    location /pathfinder-lab/ {
        alias /opt/longhun/portal/pathfinder-lab/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    location /api/pathfinder/ {
        rewrite ^/api/pathfinder/(.*) /$1 break;
        proxy_pass http://127.0.0.1:9650;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # 🎫 龍魂激活经济舱（一元起步·上不封顶）
    location /activation-lab/ {
        alias /opt/longhun/portal/activation-lab/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    location /api/activation/ {
        rewrite ^/api/activation/(.*) /$1 break;
        proxy_pass http://127.0.0.1:9656;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # 🛡️ 龍魂审计对抗中枢 · 左右互搏 + 红蓝对抗
    location /audit-battle-hub/ {
        alias /opt/longhun/portal/audit-battle-hub/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    location /api/audit/health {
        proxy_pass http://127.0.0.1:9657/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /api/audit/ {
        rewrite ^/api/audit/(.*) /audit/$1 break;
        proxy_pass http://127.0.0.1:9657;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /videos/ {
        alias /opt/longhun/videos/;
        add_header Cache-Control "no-cache" always;
    }

    location /api/videos/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /api/video-metrics {
        proxy_pass http://127.0.0.1:8788/api/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # 🐉 统一后端 API → 鲲鹏本地 9630
    location /api/ {
        proxy_pass http://127.0.0.1:9630;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # 🤖 Ollama AI — 本地11434→隧道8093
    location /ollama/ {
        rewrite ^/ollama/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Ollama API 需要长超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 🧠 智能中枢 — 本地5001→隧道8092
    location /hub/ {
        rewrite ^/hub/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 📦 Release 下载
    location /releases/ {
        alias /opt/longhun-system/releases/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Content-Disposition "attachment";
    }
    location / {
        return 200 "🐉 龍魂 · 鲲鹏本地服务
================================
🎬 视频工坊    → /video-studio/
🧭 路径规划    → /pathfinder-lab/
🎫 激活经济舱  → /activation-lab/
📊 仪表盘      → /dashboard/
🏠 Portal      → /local/
🧠 智能中枢     → /hub/
🤖 Ollama AI   → /ollama/
================================
";
        add_header Content-Type "text/plain; charset=utf-8";
    }
}
