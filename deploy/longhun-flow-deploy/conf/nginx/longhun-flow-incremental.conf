# 🐉 流量拓扑交付包 · nginx 增量片段 (生产适配版)
# 说明: 交付包原始 nginx.conf/sites-available/longhun 设计为"独占 uid9622.cn
# 全流量", 而鲲鹏生产 nginx.conf 已 include conf.d/* 与 sites-enabled/*。
# 本文件作为独立 conf.d 片段挂载, 只补【生产缺失】的 zone/upstream/map,
# 路由部分经 deploy 脚本合并进现有主站 443 server 块 (全部为新增路径)。
#
# 冲突规避:
#   zone       → flow_ 前缀 (生产已有 api_limit/conn_limit 等, 不重名)
#   upstream   → flow_ 前缀 (生产无任何 upstream)
#   map        → flow_p0_dna_missing (生产无此 map)
# ==============================================================================

# ===== 限流 zone (flow_ 前缀, 独立于生产) =====
limit_req_zone $binary_remote_addr zone=flow_api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=flow_chat_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=flow_global_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=flow_conn_limit:10m;

# ===== P0 DNA 头存在性检查 (flow_ 前缀) =====
map $http_x_dragon_dna $flow_p0_dna_missing {
    default 0;
    ""      1;
}

# ===== 上游服务 (flow_ 前缀; bridge 端口 18799→18800) =====
upstream flow_longhun_api {
    server 127.0.0.1:8970 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream flow_longhun_collab {
    server 127.0.0.1:19622 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream flow_longhun_bridge {
    server 127.0.0.1:18800 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

