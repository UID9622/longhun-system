# /etc/nginx/nginx.conf —— 龍魂 · nginx 主配置（唯一合法入口）

user www-data;
worker_processes auto;
pid /run/nginx.pid;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ===== 基础设置 =====
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ===== gzip 压缩 (修正17: 与参数对照表对齐) =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # ===== 日志格式（含DNA追溯，JSON 落盘供 mtail/textfile 采集 5xx 率） =====
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'DNA: $http_x_dragon_dna';

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"dna":"$http_x_dragon_dna",'
        '"tricolor":"$sent_http_x_longhun_tricolor"'
    '}';

    access_log /var/log/nginx/access.log json;

    # ===== 限流配置 (修正18: 新增 chat_limit 5r/s 独立 zone) =====
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ===== P0 DNA 头存在性检查 (修正5: 仅为审计标记头, 非鉴权; 鉴权走后端 auth_request) =====
    # 配合站点配置: if ($p0_dna_missing) { return 403; } + error_page 403 = @p0_denied
    map $http_x_dragon_dna $p0_dna_missing {
        default 0;
        ""      1;
    }

    # ===== 上游服务定义（keepalive 写法保留） =====
    upstream longhun_api {
        server 127.0.0.1:8970 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream longhun_collab {
        server 127.0.0.1:19622 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream longhun_bridge {
        server 127.0.0.1:18799 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ===== 站点配置 =====
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
