# ────────────────────────────────────────────
# 龍魂·审计即服务 · Nginx HTTPS 反代
# DNA: #龍芯⚡️丙午·癸未·甲子·既济-AUDIT-NGINX-v1.0
# 鲲鹏路径: /etc/nginx/sites-available/longhun-audit
# 启用: ln -s /etc/nginx/sites-available/longhun-audit /etc/nginx/sites-enabled/
# ────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name uid9622.cn;

    # ── SSL ──
    ssl_certificate     /etc/letsencrypt/live/uid9622.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uid9622.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── 安全头 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-LongHun-DNA "longhun-api-guard-v1.0" always;

    # ── 请求大小限制 ──
    client_max_body_size 10m;

    # ── /audit → 审计即服务 ──
    location /audit {
        proxy_pass http://127.0.0.1:8771;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;

        # 速率限制
        limit_req zone=audit_limit burst=10 nodelay;
        limit_conn audit_conn 20;
    }

    # ── /badges → 徽章目录（Nginx直接serve） ──
    location /badges {
        alias /root/longhun-system/brand;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "image/svg+xml";
        try_files $uri =404;
    }

    # ── /hunter → 仪表盘 ──
    location /hunter {
        alias /root/longhun-system/portal/hunter;
        index index.html;
        try_files $uri $uri/ /hunter/index.html;
        expires 1d;
    }
}

# ── 速率限制定义 ──
limit_req_zone $binary_remote_addr zone=audit_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=audit_conn:10m;

# ── HTTP → HTTPS 重定向 ──
server {
    listen 80;
    server_name uid9622.cn;
    return 301 https://$host$request_uri;
}
