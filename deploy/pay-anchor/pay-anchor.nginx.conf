# 🧬 龍魂·支付锚定·Nginx 反代配置

# 追加到 uid9622.cn 的 Nginx 配置中
# 路径: /etc/nginx/sites-available/uid9622.cn

# ── 支付锚定 API ──
location /pay-anchor/ {
    proxy_pass http://127.0.0.1:19623/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Longhun-Immutable "true";
    proxy_set_header X-Data-Sovereign "China-HuaweiCloud";
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
}

# ── 支付锚定 API 端点 ──
# GET  https://uid9622.cn/pay-anchor/health
# GET  https://uid9622.cn/pay-anchor/status
# GET  https://uid9622.cn/pay-anchor/anchors
# POST https://uid9622.cn/pay-anchor/activate     { "amount": 0.01, "purpose": "..." }
# POST https://uid9622.cn/pay-anchor/trace        { "dna": "#龍芯⚡️..." }
# POST https://uid9622.cn/pay-anchor/legal-lookup { "dna": "...", "auth": "...", "agency": "...", "reason": "..." }
# POST https://uid9622.cn/pay-anchor/verify
