# openEuler 22.03 LTS SP4 自动安装 Kickstart
# 鲲鹏 ARM64 · 128GB · 无人值守

text
cdrom
lang zh_CN.UTF-8
keyboard cn
timezone Asia/Shanghai --utc

# Port1 固定 IP
network --bootproto=static --device=eth0 --ip=192.168.1.100 --netmask=255.255.255.0 --gateway=192.168.1.1 --nameserver=223.5.5.5 --hostname=longhun-kunpeng --activate

# 磁盘
zerombr
clearpart --all --initlabel
autopart

# 账户
rootpw --iscrypted $6$qYyeqzSfCqZiZyPd$os.nf80I3dIeoE0Omnfurf0xobOLvi.4hnd0UPnwipXwWdCbXKrJMErD2Hag5xGWxq27h0cAhpVZ1aREQLo9U.
user --name=longhun --password=$6$qYyeqzSfCqZiZyPd$os.nf80I3dIeoE0Omnfurf0xobOLvi.4hnd0UPnwipXwWdCbXKrJMErD2Hag5xGWxq27h0cAhpVZ1aREQLo9U. --iscrypted --groups=wheel

# 软件包
%packages
@^minimal-environment
@standard
vim
curl
wget
git
net-tools
openssh-server
openssh-clients
python3
python3-pip
rsync
htop
sysstat
chrony
%end

%post --log=/root/ks-post.log
systemctl enable sshd
systemctl disable firewalld
hostnamectl set-hostname longhun-kunpeng
cat > /etc/motd << 'MOTD'
  🐉 龍魂 · 鲲鹏服务器
  longhun-kunpeng
  openEuler 22.03 LTS · ARM64
MOTD
date > /root/.install-complete
%end

reboot
