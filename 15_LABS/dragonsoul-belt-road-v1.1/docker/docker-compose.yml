version: "3.8"
# 龍魂 · 一带一路入门包 · Docker Compose 快速启动配置 v1.1
# DNA: #龍芯⚡️丙午·丙申·戊午·戊午·䷱鼎-BELT-ROAD-PACK-UID9622
# 确认码: #CONFIRM🌌9622-ONLY-ONCE🧬LK9X-772Z
# 许可: MulanPSL v2
# 用途: 一键编排龍魂全栈服务（推理+网关+监控+反向代理）

services:
  dragonsoul:
    image: dragonsoul/belt-road:${DRAGONSOUL_VERSION:-1.1}
    container_name: dragonsoul-belt-road
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - DRAGONSOUL_VERSION=${DRAGONSOUL_VERSION:-1.1}
      - DEFAULT_LANG=${DEFAULT_LANG:-en}
      - MODEL_SIZE=${MODEL_SIZE:-7b}
      - OFFLINE_MODE=${OFFLINE_MODE:-0}
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
      - LOGS_DIR=/app/logs
      - CONFIGS_DIR=/app/configs
      - SCENARIOS_DIR=/app/scenarios
      - API_KEY=${API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./scenarios:/app/scenarios
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT:-16G}
          cpus: ${CPU_LIMIT:-4}
        reservations:
          memory: ${MEM_RESERVE:-8G}
          cpus: ${CPU_RESERVE:-2}
    networks:
      - dragonsoul-net

  nginx:
    image: nginx:alpine
    container_name: dragonsoul-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/public:/usr/share/nginx/html:ro
    depends_on:
      dragonsoul:
        condition: service_healthy
    networks:
      - dragonsoul-net

  # 可选：监控栈（启用方式: docker-compose --profile monitoring up -d）
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: dragonsoul-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    profiles:
      - monitoring
    networks:
      - dragonsoul-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: dragonsoul-grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-dragonsoul}
      - GF_USERS_ALLOW_SIGN_UP=false
    profiles:
      - monitoring
    networks:
      - dragonsoul-net

  # 可选：Redis 缓存/任务队列（用于多节点协同）
  redis:
    image: redis:7-alpine
    container_name: dragonsoul-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    profiles:
      - distributed
    networks:
      - dragonsoul-net

volumes:
  prometheus-data:
  grafana-data:
  redis-data:

networks:
  dragonsoul-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
