    alias: ["登记注册表", "入库"]
    en: "registry add"
    cnsh: "入账"
    gua: "䷚颐"
    status: "种子"
    note: "写入dna_registry"
  - term: "指纹"
    alias: ["哈希", "校验和"]
    en: "sha256/sm3"
    cnsh: "指纹"
    gua: "䷛大过"
    status: "种子"
    note: "内容指纹校验"
  - term: "锚定"
    alias: ["绑定", "DNA锚定"]
    en: "anchor"
    cnsh: "锚定"
    gua: "䷜坎"
    status: "种子"
    note: "身份/设备锚定"
