<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龍魂·批量打标器 | M1</title>
<style>
body{margin:0;background:#0a0a0c;color:#e8e4d8;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
header{border-bottom:1px solid #8a742a;padding:16px 26px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;background:linear-gradient(180deg,#141310,#0a0a0c);}
h1{font-size:18px;letter-spacing:3px;color:#d4af37;margin:0;}
.dna{font-size:11px;color:#8a742a;font-family:monospace;text-align:right;}
a.back{color:#a09a8a;font-size:12px;text-decoration:none;}
main{max-width:1100px;margin:0 auto;padding:22px 26px;}
textarea{width:100%;min-height:180px;background:#000;color:#e8e4d8;border:1px solid #2a2a30;border-radius:6px;padding:14px;font-size:14px;line-height:1.8;box-sizing:border-box;}
.btn{background:#d4af37;color:#000;border:none;padding:10px 24px;font-size:14px;letter-spacing:2px;cursor:pointer;border-radius:4px;margin:12px 8px 12px 0;font-weight:bold;}
.btn.ghost{background:none;border:1px solid #8a742a;color:#d4af37;}
.badge{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11px;font-weight:bold;}
.badge.shi{background:#d4af37;color:#000;box-shadow:0 0 8px rgba(212,175,55,.6);}
.badge.yan{background:#3a3a40;color:#9aa0a6;border:1px dashed #5c6066;}
.badge.yi{background:#e5484d;color:#fff;animation:blink 1.2s infinite;}
@keyframes blink{50%{opacity:.55;}}
.line{display:flex;align-items:baseline;gap:10px;padding:8px 10px;border-bottom:1px solid #1c1c20;font-size:14px;line-height:1.7;flex-wrap:wrap;}
.line.shi{border-left:3px solid #d4af37;background:rgba(212,175,55,.05);}
.line.yan{border-left:3px solid #5c6066;color:#9aa0a6;font-style:italic;}
.line.yi{border-left:3px solid #e5484d;background:rgba(229,72,77,.06);}
.meta{font-size:11px;color:#a09a8a;}
select{background:#000;color:#d4af37;border:1px solid #2a2a30;padding:2px 6px;font-size:11px;}
#out{background:#000;border:1px solid #2a2a30;border-radius:8px;padding:14px;margin-top:8px;min-height:80px;}
.stats{display:flex;gap:16px;margin:10px 0;font-size:13px;color:#a09a8a;flex-wrap:wrap;}
.note{font-size:12px;color:#a09a8a;margin-top:10px;}
footer{border-top:1px solid #2a2a30;padding:14px 26px;font-size:11px;color:#a09a8a;text-align:center;}
</style>
</head>
<body>
<header>
  <h1>龍魂 · 批量打标器 <span style="font-size:11px;color:#a09a8a;letter-spacing:1px">M1 · 粘贴文案 → 自动实/演/疑判定</span> <a class="back" href="index.html">← 返回协议主页</a></h1>
  <div class="dna">#龍芯⚡️丙午·乙未·丁未·天风姤-批量打标-V1.0</div>
</header>
<main>
<p style="font-size:13px;color:#a09a8a">每行一条内容（短视频文案/广告/聊天记录均可）。规则引擎先本地初判；部署鲲鹏后自动走 AI 复核（接口已留，见 js/lh_interface.js）。判定可人工改标，改标记录入导出 JSON（不删除只冻结）。</p>
<textarea id="in">三个月包你进大厂，年薪百万不是梦，名额有限速抢！
据国家统计局公告，2025年居民人均可支配收入实际增长5.1%。
网传某品牌手机充电五分钟能用一个月，太震惊了速看！
本视频为情景剧场，剧情演绎请勿模仿。
公安部反诈中心提示：公检法机关不会电话办案。</textarea>
<button class="btn" onclick="run()">▶ 批量判定</button>
<button class="btn ghost" onclick="exportJSON()">⬇ 导出打标 JSON</button>
<div class="stats" id="stats"></div>
<div id="out"></div>
<p class="note">STUB 模式：当前仅规则引擎。鲲鹏部署后把 js/lh_interface.js 中 MODE 改为 'LOCAL' 即接入 AI 复核。</p>
</main>
<footer>龍魂系统 UID9622 · 真实性标识协议 · M1 批量打标器 · 免费开源 · 零黑箱</footer>
<script src="js/lh_interface.js"></script>
<script>
var RESULTS=[];
function run(){
  var lines=document.getElementById('in').value.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  RESULTS=[];var seq=lines.map(function(l){return LH_API.aiJudge(l).then(function(r){RESULTS.push({text:l,tag:r.tag,by:r.by,overridden:null});});});
  Promise.all(seq).then(render);
}
function render(){
  var c={实:0,演:0,疑:0};
  var h='';
  RESULTS.forEach(function(r,i){
    c[r.tag]++;
    var cls=r.tag==='实'?'shi':r.tag==='演'?'yan':'yi';
    h+='<div class="line '+cls+'"><span class="badge '+cls+'">'+r.tag+'</span><span>'+r.text+'</span>'
      +'<span class="meta">判定:'+r.by+(r.overridden?' · 人工改标:'+r.overridden:'')+'</span>'
      +'<select onchange="override('+i+',this.value)"><option value="">改标…</option><option>实</option><option>演</option><option>疑</option></select></div>';
  });
  document.getElementById('out').innerHTML=h;
  document.getElementById('stats').innerHTML='实 <b style="color:#d4af37">'+c['实']+'</b> · 演 <b style="color:#9aa0a6">'+c['演']+'</b> · 疑 <b style="color:#e5484d">'+c['疑']+'</b>';
}
function override(i,v){
  if(!v)return;
  RESULTS[i].overridden=RESULTS[i].tag+'→'+v; // 冻结原判定，追加改标记录
  RESULTS[i].tag=v;
  render();
}
function exportJSON(){
  LH_API.dnaSign('批量打标','导出').then(function(d){
    var payload={dna:d.dna,module:'M1-批量打标器',protocol:'龍魂真实性标识协议V1.0',results:RESULTS};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lh_truthtag_export.json';a.click();
  });
}
</script>
</body>
</html>
