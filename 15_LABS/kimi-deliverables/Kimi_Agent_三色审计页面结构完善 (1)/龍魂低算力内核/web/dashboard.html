<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐉 龍魂 · 算力节约实时看板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1117; color:#e6edf3; font-family:"PingFang SC","Microsoft YaHei",sans-serif; padding:24px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .dna { color:#8b949e; font-size:12px; margin-bottom:24px; word-break:break-all; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:20px; }
  .card h3 { font-size:13px; color:#8b949e; margin-bottom:8px; }
  .big { font-size:32px; font-weight:700; }
  .green { color:#3fb950; } .yellow { color:#d29922; } .red { color:#f85149; } .blue { color:#58a6ff; }
  .bar-wrap { background:#21262d; border-radius:8px; height:14px; overflow:hidden; margin-top:8px; }
  .bar { height:100%; border-radius:8px; transition:width .6s; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { padding:10px 12px; border-bottom:1px solid #21262d; text-align:right; }
  th:first-child,td:first-child { text-align:left; }
  th { color:#8b949e; font-weight:500; }
  .tag { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px; }
  .tag.g { background:rgba(63,185,80,.15); color:#3fb950; }
  section { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:20px; margin-bottom:24px; }
  canvas { width:100%; height:160px; }
</style>
</head>
<body>
<h1>🐉 龍魂 · 算力节约实时看板</h1>
<div class="dna" id="dna"></div>

<div class="grid">
  <div class="card"><h3>系统健康（三色审计）</h3><div class="big green">🟢 通过</div><div style="font-size:12px;color:#8b949e">R值 <span id="rval">100</span> / 100</div></div>
  <div class="card"><h3>内核内存占用</h3><div class="big blue"><span id="mem">0</span><small style="font-size:14px"> MB</small></div><div class="bar-wrap"><div class="bar" id="membar" style="background:#58a6ff"></div></div><div style="font-size:12px;color:#8b949e;margin-top:6px">大厂典型 8–16GB · 目标 ≤256MB</div></div>
  <div class="card"><h3>流式吞吐</h3><div class="big blue"><span id="tps">0</span><small style="font-size:14px"> token/s</small></div></div>
  <div class="card"><h3>年轮链</h3><div class="big green"><span id="chain">0</span><small style="font-size:14px"> 条 · 完整</small></div></div>
  <div class="card"><h3>累计节约估算</h3><div class="big green">¥<span id="saved">0</span></div><div style="font-size:12px;color:#8b949e">对比同量 token 走大厂API刊例均价</div></div>
</div>

<section>
<h3 style="margin-bottom:12px">龍魂 vs 大厂 · 单次推理画像（实测值 vs 行业典型值）</h3>
<table>
<thead><tr><th>指标</th><th>大厂典型</th><th>龍魂实测</th><th>结论</th></tr></thead>
<tbody id="compare"></tbody>
</table>
</section>

<section>
<h3 style="margin-bottom:12px">过去24小时吞吐曲线（模拟接入 live 数据前的演示数据）</h3>
<canvas id="cv" width="800" height="160"></canvas>
</section>

<section>
<h3 style="margin-bottom:12px">耻辱墙（最近错误）</h3>
<table><tbody>
<tr><td>—</td><td>暂无记录 · 系统干净</td><td><span class="tag g">🟢</span></td></tr>
</tbody></table>
</section>

<script>
// ===== 实测数据注入点：部署时用 reports/low-power-report.json 覆盖 MEASURED =====
const MEASURED = {"DNA": "#龍芯⚡️丙午·丙申·丁巳·丙午·䷟恒-LOW-POWER-BENCH-UID9622", "内核载入后内存MB": 113, "流式token吞吐_token每秒": 327785, "DNA生成吞吐_条每秒": 44875, "年轮链落笔吞吐_条每秒": 11250, "年轮链长度": 10000, "累计节约估算元": 20974};
document.getElementById('dna').textContent = 'DNA: ' + MEASURED.DNA;
function anim(id, target, suffix='', dur=1200){
  const el = document.getElementById(id); const t0 = performance.now();
  function step(t){ const p = Math.min(1,(t-t0)/dur);
    el.textContent = Math.round(target*p).toLocaleString() + suffix;
    if(p<1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
anim('mem', MEASURED.内核载入后内存MB);
document.getElementById('membar').style.width = Math.min(100, MEASURED.内核载入后内存MB/256*100) + '%';
anim('tps', MEASURED.流式token吞吐_token每秒);
anim('chain', MEASURED.年轮链长度);
anim('saved', MEASURED.累计节约估算元, '', 1600);

const rows = [
  ['单次推理内存', '8–16 GB', MEASURED.内核载入后内存MB + ' MB', '≥97% ↓'],
  ['DNA生成吞吐', '—（无此能力）', MEASURED.DNA生成吞吐_条每秒.toLocaleString() + ' 条/s', '独有'],
  ['年轮链落笔', '—（无此能力）', MEASURED.年轮链落笔吞吐_条每秒.toLocaleString() + ' 条/s', '独有'],
  ['流式吞吐', '依赖云端', MEASURED.流式token吞吐_token每秒.toLocaleString() + ' token/s', '本地实时'],
  ['部署网络', '必须联网', '不需要', '断网可跑'],
];
document.getElementById('compare').innerHTML = rows.map(r =>
  `<tr><td>${r[0]}</td><td>${r[1]}</td><td style="color:#58a6ff">${r[2]}</td><td><span class="tag g">${r[3]}</span></td></tr>`).join('');

// 演示曲线
const cv = document.getElementById('cv').getContext('2d');
const data = Array.from({length:48}, (_,i)=> 200000 + Math.sin(i/5)*80000 + Math.random()*40000);
cv.strokeStyle = '#3fb950'; cv.lineWidth = 2; cv.beginPath();
data.forEach((v,i)=>{ const x=i/(data.length-1)*800, y=160-(v-100000)/400000*140;
  i?cv.lineTo(x,y):cv.moveTo(x,y); });
cv.stroke();
</script>
</body>
</html>
