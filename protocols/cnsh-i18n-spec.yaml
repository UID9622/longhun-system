# cnsh-i18n-spec.yaml
# CNSH 语法 · 一带一路语言扩展

protocol: "CNSH-I18N-v0.1"
dna: "ZHUGEXIN⚡️2025-🇨🇳🐉⚖️♠️🧚🏼‍♀️❤️♾️"
uid: "9622"

# === 核心设计 ===
# CNSH = Chinese Native Syntax Hybrid
# 不是翻译，是语法骨架统一，表皮语言本地化

compiler:
  input: "*.cnsh"
  output: "bash/python/lua"
  target_os: "EulerOS/Kylin/Loongnix"

# === 语言映射表（一带一路） ===
language_skins:
  
  # 中文（母体）
  zh:
    grammar: "native"
    keywords:
      if: "如果"
      else: "否则"
      for: "循环"
      while: "当"
      function: "函数"
      return: "返回"
      print: "输出"
    comment: "#"
    
  # 柬埔寨（高棉语）
  km:
    grammar: "cnsh"
    keywords:
      if: "បើ"
      else: "ផ្សេង"
      for: "វិល"
      while: "ពេល"
      function: "មុខងារ"
      return: "ត្រឡប់"
      print: "បង្ហាញ"
    comment: "#"
    rtl: false
    
  # 俄语（中俄本币结算）
  ru:
    grammar: "cnsh"
    keywords:
      if: "если"
      else: "иначе"
      for: "для"
      while: "пока"
      function: "функция"
      return: "вернуть"
      print: "вывод"
    comment: "#"
    
  # 阿拉伯语（中沙/中阿）
  ar:
    grammar: "cnsh"
    keywords:
      if: "إذا"
      else: "آخر"
      for: "لأجل"
      while: "بينما"
      function: "دالة"
      return: "إرجاع"
      print: "طباعة"
    comment: "#"
    rtl: true
    
  # 波斯语（中伊25年）
  fa:
    grammar: "cnsh"
    keywords:
      if: "اگر"
      else: "否则"
      for: "برای"
      while: "تا"
      function: "تابع"
      return: "برگشت"
      print: "چاپ"
    comment: "#"
    rtl: true
    
  # 泰语
  th:
    grammar: "cnsh"
    keywords:
      if: "ถ้า"
      else: "มิฉะนั้น"
      for: "สำหรับ"
      while: "ในขณะที่"
      function: "ฟังก์ชัน"
      return: "ส่งคืน"
      print: "แสดง"
    comment: "#"
    
  # 葡萄牙语（中巴）
  pt:
    grammar: "cnsh"
    keywords:
      if: "se"
      else: "senão"
      for: "para"
      while: "enquanto"
      function: "função"
      return: "retornar"
      print: "imprimir"
    comment: "#"
    
  # 越南语
  vi:
    grammar: "cnsh"
    keywords:
      if: "nếu"
      else: "khác"
      for: "cho"
      while: "trong khi"
      function: "hàm"
      return: "trả về"
      print: "in"
    comment: "#"

# === 编译规则 ===
compilation:
  stage_1: "skin_strip"
  stage_2: "syntax_validate"
  stage_3: "target_generate"
  stage_4: "sovereignty_sign"
  
# === 终端执行 ===
runtime:
  shell: "bash"
  encoding: "UTF-8"
  locale: "auto-detect"
  fallback: "zh_CN.UTF-8"
