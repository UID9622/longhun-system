tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: /Users/zuimeidedeyihan/.cloudflared/REPLACE_WITH_TUNNEL_ID.json

ingress:
  # AI 网关健康检查
  - hostname: api.yourdomain.com
    path: /health
    service: http://127.0.0.1:9633/api/v1/health

  # AI 网关 provider 列表
  - hostname: api.yourdomain.com
    path: /providers
    service: http://127.0.0.1:9633/api/v1/providers

  # Ollama 聊天入口
  - hostname: api.yourdomain.com
    path: /chat/ollama
    service: http://127.0.0.1:9633/api/v1/ollama/chat

  # Notion webhook 入口
  - hostname: api.yourdomain.com
    path: /webhook/notion
    service: http://127.0.0.1:9623/notion_webhook

  # Notion webhook 健康检查
  - hostname: api.yourdomain.com
    path: /webhook/health
    service: http://127.0.0.1:9623/health

  # 审计引擎（建议后续加鉴权；先只暴露 health）
  - hostname: api.yourdomain.com
    path: /audit/health
    service: http://127.0.0.1:9622/health

  - service: http_status:404
