# 配套: Dockerfile（同目录）· 用法见 docs/安装指南.md「方式四 · Docker 网关」

services:
  longhun-gateway:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    image: longhun-gateway:4.0.0
    container_name: longhun-gateway
    ports:
      # 默认只绑宿主本机（安全）；需对外开放时显式改为 "0.0.0.0:9622:9622"
      - "127.0.0.1:9622:9622"
    volumes:
      # 持久化：日志/PID/密钥等运行时数据（容器内 /root/.longhun ↔ 宿主机 ~/.longhun）
      - ~/.longhun:/root/.longhun
    environment:
      # 龙魂源码树挂载点（lh_api.py 通过它定位 bin/lh.py）
      LONGHUN_ROOT: /app
    healthcheck:
      # 存活探测：GET /health 失败即重启
      test: ["CMD-SHELL", "curl -f http://localhost:9622/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
