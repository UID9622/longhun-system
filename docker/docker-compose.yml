# 龍魂體系 · 待融入包監控容器編排
# DNA: #龍芯⚡️2026-06-16-PACKAGE-WATCHER-COMPOSE-v1.0
#
# 用法：
#   cd docker
#   docker compose up -d --build
#   docker compose logs -f package-watcher
#   docker compose down

services:
  package-watcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: longhun-package-watcher
    image: longhun/package-watcher:v1.0
    restart: unless-stopped
    volumes:
      # 掛載用戶主目錄（只讀）用於發現待融入包
      - /Users/zuimeidedeyihan:/host/home:ro
      # 掛載 Downloads（只讀）
      - /Users/zuimeidedeyihan/Downloads:/host/Downloads:ro
      # 掛載 longhun-system 的 docs 目錄（讀寫）用於輸出隊列與報告
      - /Users/zuimeidedeyihan/longhun-system/docs:/app/output
      # 持久化日誌
      - /Users/zuimeidedeyihan/longhun-system/logs:/app/logs
    environment:
      # 可選：限制掃描深度或路徑
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    # 也可以改為一次性運行後退出，再由外部 cron 調度
    # command: ["python3", "/app/package-watcher.py", "--once", "--prune"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
