<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI溯源与审计 · DNA仪表盘</title>
<style>
:root {
  --bg:#0a0a0f; --surface:#12121a; --card:#1a1a28;
  --gold:#D4A574; --gold-dim:#8a6a4a; --red:#d9534f; --green:#5cb85c; --yellow:#f0ad4e;
  --text:#d4d4d4; --text-dim:#888;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,sans-serif; }
header {
  background:linear-gradient(135deg,#1a1a28 0%,#0a0a0f 100%);
  padding:24px 32px; border-bottom:1px solid var(--gold-dim);
  display:flex; align-items:center; gap:16px;
}
header h1 { color:var(--gold); font-size:24px; }
header .subtitle { color:var(--text-dim); font-size:13px; margin-top:4px; }
.container { max-width:1400px; margin:0 auto; padding:24px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; }
.card {
  background:var(--card); border:1px solid #222; border-radius:12px; padding:20px;
}
.card:hover { border-color:var(--gold-dim); }
.card h3 { color:var(--gold); font-size:16px; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid #222; }
textarea {
  width:100%; min-height:120px; background:var(--surface); color:var(--text);
  border:1px solid #333; border-radius:8px; padding:12px; font-size:13px;
  font-family:monospace; resize:vertical;
}
textarea:focus { outline:none; border-color:var(--gold); }
.btn {
  background:var(--gold); color:#000; border:none; padding:10px 20px; border-radius:8px;
  cursor:pointer; font-size:14px; font-weight:bold; margin:8px 8px 0 0;
}
.btn:hover { opacity:0.85; }
.result-box {
  background:var(--surface); border:1px solid #333; border-radius:8px; padding:16px;
  margin-top:12px; font-family:monospace; font-size:13px; white-space:pre-wrap;
  max-height:400px; overflow-y:auto;
}
.result-box .ok { color:var(--green); }
.result-box .warn { color:var(--yellow); }
.result-box .err { color:var(--red); }
.result-box .dna { color:var(--gold); }
.status-badge {
  display:inline-block; padding:4px 12px; border-radius:12px; font-size:13px; font-weight:bold;
}
.stat-row { display:flex; gap:12px; flex-wrap:wrap; }
.stat-box {
  flex:1; min-width:100px; background:var(--surface); border-radius:8px;
  padding:14px; text-align:center;
}
.stat-box .num { font-size:22px; font-weight:bold; }
.stat-box .lbl { font-size:11px; color:var(--text-dim); margin-top:4px; }
.tabs { display:flex; gap:0; margin-bottom:20px; }
.tab {
  padding:10px 24px; background:var(--surface); border:1px solid #333;
  color:var(--text-dim); cursor:pointer; font-size:14px;
}
.tab:first-child { border-radius:8px 0 0 8px; }
.tab:last-child { border-radius:0 8px 8px 0; }
.tab.active { background:var(--gold); color:#000; border-color:var(--gold); }
.mono { font-family:monospace; font-size:12px; word-break:break-all; }
.timestamp { font-size:11px; color:var(--text-dim); margin-top:16px; text-align:right; }
.loading { text-align:center; color:var(--text-dim); padding:40px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🧬 AI溯源与审计协议</h1>
    <div class="subtitle">给所有AI内容打上不可伪造的"出生证明"</div>
  </div>
  <div style="margin-left:auto;">
    <button class="btn" onclick="loadStats()">🔄 刷新</button>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('generate')">🏷️ 生成DNA</div>
    <div class="tab" onclick="switchTab('verify')">🔍 验证DNA</div>
    <div class="tab" onclick="switchTab('stats')">📊 统计</div>
  </div>

  <div id="tab-generate">
    <div class="grid-2">
      <div class="card">
        <h3>📝 原始内容</h3>
        <textarea id="gen-text" placeholder="输入AI生成的原始内容...">数据主权是数字时代的根本权利。每一个用户都应该拥有对自己数据的完全控制权。</textarea>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
          <select id="gen-model" style="background:var(--surface);color:var(--text);border:1px solid #333;padding:8px;border-radius:6px;">
            <option>CodeBuddy</option><option>DeepSeek-v3.1</option><option>Kimi-v2.7</option>
            <option>Claude</option><option>Gemini</option>
          </select>
          <input id="gen-version" value="v1.0" style="background:var(--surface);color:var(--text);border:1px solid #333;padding:8px;border-radius:6px;width:80px;">
          <button class="btn" onclick="generateDNA()">🏷️ 生成DNA+双标识</button>
        </div>
      </div>
      <div class="card">
        <h3>🏷️ 带标识的输出</h3>
        <div id="gen-result" class="result-box" style="color:var(--text-dim);">点击"生成DNA+双标识"开始...</div>
      </div>
    </div>
  </div>

  <div id="tab-verify" style="display:none;">
    <div class="grid-2">
      <div class="card">
        <h3>🔍 待验证文本</h3>
        <textarea id="verify-text" placeholder="粘贴一段带DNA追溯码的AI内容..."></textarea>
        <button class="btn" onclick="verifyDNA()" style="margin-top:8px;">🔍 验证</button>
        <div style="margin-top:8px;font-size:12px;color:var(--text-dim);">
          也支持验证在线内容：<input id="verify-url" placeholder="https://..." style="background:var(--surface);color:var(--text);border:1px solid #333;padding:6px;border-radius:6px;width:300px;margin-left:8px;">
          <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="verifyURL()">验证URL</button>
        </div>
      </div>
      <div class="card">
        <h3>📋 验证结果</h3>
        <div id="verify-result" class="result-box" style="color:var(--text-dim);">等待验证...</div>
      </div>
    </div>
  </div>

  <div id="tab-stats" style="display:none;">
    <div id="stats-content" class="loading">加载统计中...</div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8783';

async function fetchJSON(url, opts={}) {
  const r = await fetch(`${API}${url}`, opts);
  return r.json();
}

function switchTab(tab) {
  ['generate','verify','stats'].forEach(t => {
    document.getElementById(`tab-${t}`).style.display = t===tab?'block':'none';
  });
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['generate','verify','stats'][i]===tab);
  });
  if (tab==='stats') loadStats();
}

async function generateDNA() {
  const text = document.getElementById('gen-text').value;
  const model = document.getElementById('gen-model').value;
  const version = document.getElementById('gen-version').value;

  const data = await fetchJSON('/dna/generate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      text, model_name:model, model_version:version,
      user_id:'UID9622', action:'GENERATE'
    })
  });

  document.getElementById('gen-result').innerHTML = `
    <span class="ok">✅ DNA已生成</span>
    <span class="dna">${data.dna_code}</span>
    <span style="color:var(--text-dim)">内容哈希: ${data.content_hash}</span>

    <div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px;border:1px solid #333;">
      <div style="color:var(--gold);margin-bottom:8px;">带双标识的完整输出：</div>
      <div class="mono" style="max-height:300px;overflow-y:auto;">${escapeHtml(data.labeled_text)}</div>
    </div>

    <div style="margin-top:8px;font-size:12px;color:var(--text-dim);">
      ✅ 显式水印: ${data.has_visible} | ✅ 隐式元数据: ${data.has_invisible}
    </div>
  `;
}

async function verifyDNA() {
  const text = document.getElementById('verify-text').value;
  if (!text) { alert('请粘贴待验证文本'); return; }

  const data = await fetchJSON('/dna/verify', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ text })
  });

  document.getElementById('verify-result').innerHTML = formatVerifyResult(data);
}

async function verifyURL() {
  const url = document.getElementById('verify-url').value;
  if (!url) { alert('请输入URL'); return; }

  const data = await fetchJSON('/dna/verify-url', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ url })
  });

  document.getElementById('verify-result').innerHTML = formatVerifyResult(data);
}

function formatVerifyResult(data) {
  const statusClass = data.tampered?'err':data.has_visible_label?'ok':'warn';
  return `
    <div class="status-badge" style="background:${data.tampered?'var(--red)':data.has_visible_label?'var(--green)':'var(--yellow)'};color:#fff;">
      ${data.status}
    </div>

    <div style="margin-top:12px;">
      <div>显式标识: ${data.has_visible_label?'<span class="ok">✅</span>':'<span class="err">❌</span>'}
        ${data.visible_dna?` <span class="dna">${data.visible_dna}</span>`:''}
      </div>
      <div>隐式标识: ${data.has_invisible_label?'<span class="ok">✅</span>':'<span class="err">❌</span>'}</div>
      <div>内容哈希: <span class="mono">${data.content_hash||'N/A'}</span></div>
      <div>篡改: ${data.tampered?'<span class="err">🔴 是</span>':'<span class="ok">🟢 否</span>'}</div>
      ${data.mismatch_detail?`<div class="err">⚠️ ${data.mismatch_detail}</div>`:''}
    </div>

    ${data.invisible_meta?`
    <div style="margin-top:12px;padding:8px;background:var(--bg);border-radius:6px;">
      <div style="color:var(--gold);font-size:12px;">隐式元数据:</div>
      <div class="mono">${JSON.stringify(data.invisible_meta,null,2)}</div>
    </div>`:''}
  `;
}

async function loadStats() {
  try {
    const data = await fetchJSON('/dna/stats');
    document.getElementById('stats-content').innerHTML = `
      <div class="grid-3" style="margin-bottom:20px;">
        <div class="card">
          <h3>📊 验证统计</h3>
          <div class="stat-row">
            <div class="stat-box"><div class="num" style="color:var(--gold)">${data.total_verifications}</div><div class="lbl">总验证次数</div></div>
            <div class="stat-box"><div class="num" style="color:var(--green)">${data.verified_authentic}</div><div class="lbl">真实可信</div></div>
            <div class="stat-box"><div class="num" style="color:var(--red)">${data.tampered_detected}</div><div class="lbl">篡改检出</div></div>
          </div>
        </div>
        <div class="card">
          <h3>🎯 真实率</h3>
          <div style="font-size:48px;text-align:center;color:var(--gold);padding:16px;">${data.authenticity_rate}</div>
          <div style="text-align:center;font-size:12px;color:var(--text-dim);">已验证内容中未被篡改的比例</div>
        </div>
        <div class="card">
          <h3>📂 来源分布</h3>
          ${Object.entries(data.source_distribution||{}).slice(0,8).map(([s,c]) => `
            <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;">
              <span>${s}</span><span style="color:var(--gold)">${c}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } catch(e) {
    document.getElementById('stats-content').innerHTML = '<div class="loading">API不可达 (端口:8783)</div>';
  }
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
