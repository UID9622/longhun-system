# DNA: #龍芯⚡️丙午·丙申·庚戌·䷙大畜-SCRIPT-MANAGER-v1.2-UID9622
# CONFIRM: #CONFIRM🌌9622-ONLY-ONCE🧬LK9X-772Z
# SEAL: #ZHUGEXIN⚡️2025-🇨🇳🐉⚖️♠️🧚🏼‍♀️❤️♾️-DEVICE-BIND-SOUL
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七因子行为密码学 · 信用仪表盘</title>
<style>
:root {
  --bg: #0a0a0f; --surface: #12121a; --card: #1a1a28;
  --gold: #D4A574; --gold-dim: #8a6a4a; --red: #d9534f; --green: #5cb85c; --yellow: #f0ad4e;
  --text: #d4d4d4; --text-dim: #888;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,sans-serif; min-height:100vh; }
header {
  background:linear-gradient(135deg, #1a1a28 0%, #0a0a0f 100%);
  padding:24px 32px; border-bottom:1px solid var(--gold-dim); display:flex; align-items:center; gap:16px;
}
header h1 { color:var(--gold); font-size:24px; }
header .subtitle { color:var(--text-dim); font-size:13px; margin-top:4px; }
.container { max-width:1400px; margin:0 auto; padding:24px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; }
.card {
  background:var(--card); border:1px solid #222; border-radius:12px; padding:20px;
  transition:border-color .2s;
}
.card:hover { border-color:var(--gold-dim); }
.card h3 { color:var(--gold); font-size:16px; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid #222; }
.card h3 .icon { margin-right:8px; }

/* 信用分仪表 */
.score-circle {
  width:160px; height:160px; border-radius:50%; margin:10px auto 16px;
  display:flex; align-items:center; justify-content:center;
  background:conic-gradient(var(--gold) var(--pct), #222 var(--pct));
  position:relative;
}
.score-inner {
  width:120px; height:120px; border-radius:50%; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.score-value { font-size:36px; font-weight:bold; color:var(--gold); }
.score-label { font-size:11px; color:var(--text-dim); }

/* 统计格 */
.stat-row { display:flex; justify-content:space-between; gap:12px; }
.stat-box {
  flex:1; background:var(--surface); border-radius:8px; padding:12px; text-align:center;
}
.stat-box .num { font-size:22px; font-weight:bold; }
.stat-box .lbl { font-size:11px; color:var(--text-dim); margin-top:4px; }
.num-green { color:var(--green); }
.num-red { color:var(--red); }
.num-gold { color:var(--gold); }

/* 实体列表 */
.entity-item {
  display:flex; align-items:center; gap:12px; padding:10px 12px;
  background:var(--surface); border-radius:8px; margin-bottom:8px;
  border-left:3px solid #333;
}
.entity-item .name { flex:1; font-size:14px; }
.entity-item .score { font-weight:bold; font-size:16px; }
.entity-item .pattern-tag {
  font-size:11px; padding:2px 8px; border-radius:10px; background:#222; color:var(--text-dim);
}

/* 事件流 */
.event-item {
  padding:10px 12px; background:var(--surface); border-radius:8px; margin-bottom:8px;
  border-left:3px solid #444; font-size:13px;
}
.event-item .promise { color:var(--gold); }
.event-item .detail { color:var(--text-dim); font-size:12px; margin-top:4px; }
.event-item .delta { float:right; font-weight:bold; }
.delta-pos { color:var(--green); }
.delta-neg { color:var(--red); }

/* 雷达图占位 */
.radar-placeholder {
  text-align:center; color:var(--text-dim); padding:40px;
  border:1px dashed #333; border-radius:8px;
}

/* 按钮 */
.btn {
  background:var(--gold); color:#000; border:none; padding:10px 20px; border-radius:8px;
  cursor:pointer; font-size:14px; font-weight:bold; transition:opacity .2s;
}
.btn:hover { opacity:0.85; }
.btn-sm { padding:6px 12px; font-size:12px; }

.bar-row { margin-bottom:10px; }
.bar-label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; }
.bar-track { height:6px; background:#222; border-radius:3px; overflow:hidden; }
.bar-fill { height:100%; border-radius:3px; transition:width .5s; }
.bar-gold { background:var(--gold); }
.bar-green { background:var(--green); }
.bar-red { background:var(--red); }

.loading { text-align:center; color:var(--text-dim); padding:40px; }
.timestamp { font-size:11px; color:var(--text-dim); margin-top:16px; text-align:right; }
</style>
</head>
<body>

<header>
  <div>
    <h1>⚡ 七因子行为密码学</h1>
    <div class="subtitle">承诺→兑现→信用→DNA — 给所有AI和用户戴上的"测谎仪"</div>
  </div>
  <div style="margin-left:auto;display:flex;gap:12px;">
    <button class="btn btn-sm" onclick="loadDashboard()">🔄 刷新</button>
    <button class="btn btn-sm" style="background:#222;color:var(--gold)" onclick="simulateEvent()">🧪 模拟事件</button>
  </div>
</header>

<div class="container">
  <div id="main-content" class="loading">加载中...</div>
</div>

<script>
const API = 'http://127.0.0.1:8782';

async function fetchJSON(url) {
  const r = await fetch(`${API}${url}`);
  return r.json();
}

async function loadDashboard() {
  const [dash, entities, score] = await Promise.all([
    fetchJSON('/seven-factor/dashboard'),
    fetchJSON('/seven-factor/entities'),
    fetchJSON('/seven-factor/score/UID9622'),
  ]);

  const entitiesList = entities.entities || [];

  document.getElementById('main-content').innerHTML = `
    <div class="grid-3" style="margin-bottom:20px;">
      <div class="card">
        <h3>📊 系统概览</h3>
        <div style="display:flex;gap:16px;flex-wrap:wrap;">
          <div class="stat-box"><div class="num num-gold">${dash.entities}</div><div class="lbl">实体数</div></div>
          <div class="stat-box"><div class="num">${dash.total_events}</div><div class="lbl">事件总数</div></div>
          <div class="stat-box"><div class="num num-green">${dash.avg_score}</div><div class="lbl">平均信用分</div></div>
          <div class="stat-box"><div class="num num-red">${dash.high_risk_count}</div><div class="lbl">高风险</div></div>
        </div>
      </div>

      <div class="card">
        <h3>👤 ${score?.entity_id || 'UID9622'}</h3>
        <div class="score-circle" style="--pct:${(score?.current_score||100)/200*360}deg">
          <div class="score-inner">
            <div class="score-value">${score?.current_score||100}</div>
            <div class="score-label">信用分</div>
          </div>
        </div>
        <div style="text-align:center;font-size:12px;color:var(--text-dim);">
          承诺${score?.promises_made||0} · 兑现${score?.promises_kept||0} · 失信${score?.promises_broken||0}
        </div>
      </div>

      <div class="card">
        <h3>📈 模式分布</h3>
        ${Object.entries(dash.pattern_distribution||{}).map(([p,c]) => `
          <div class="bar-row">
            <div class="bar-label"><span>${p}</span><span>${c}</span></div>
            <div class="bar-track"><div class="bar-fill ${p.includes('失')?'bar-red':'bar-gold'}" style="width:${c/Math.max(1,dash.entities)*100}%"></div></div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>🧩 实体信用排行</h3>
        ${entitiesList.slice(0,15).map(e => `
          <div class="entity-item" style="border-left-color:${e.score>=80?'var(--green)':e.score>=50?'var(--yellow)':'var(--red)'}">
            <div class="name">${e.entity_id} <span style="font-size:11px;color:var(--text-dim)">[${e.entity_type}]</span></div>
            <div class="pattern-tag">${e.pattern}</div>
            <div class="score" style="color:${e.score>=80?'var(--green)':e.score>=50?'var(--yellow)':'var(--red)'}">${e.score}</div>
          </div>
        `).join('')}
        ${entitiesList.length===0?'<div style="text-align:center;color:var(--text-dim);padding:20px;">暂无数据，提交行为事件后显示</div>':''}
      </div>

      <div class="card" id="history-panel">
        <h3>📜 最近事件流</h3>
        <div style="text-align:center;color:var(--text-dim);padding:20px;">选择实体查看</div>
      </div>
    </div>

    <div class="timestamp">最后更新: ${dash.updated_at || '-'}</div>
  `;

  // 点击实体查看历史
  document.querySelectorAll('.entity-item').forEach(el => {
    el.style.cursor = 'pointer';
    el.addEventListener('click', async function() {
      const eid = this.querySelector('.name').textContent.split(' ')[0];
      await loadHistory(eid);
    });
  });
}

async function loadHistory(eid) {
  const data = await fetchJSON(`/seven-factor/history/${eid}?limit=15`);
  const panel = document.getElementById('history-panel');
  panel.innerHTML = `
    <h3>📜 ${eid} · 行为记录 (共${data.total_events}条)</h3>
    ${data.events.slice(0,15).map(e => `
      <div class="event-item" style="border-left-color:${e.fulfilled?'var(--green)':'var(--red)'}">
        <span class="delta ${e.credit_delta>=0?'delta-pos':'delta-neg'}">${e.credit_delta>0?'+':''}${e.credit_delta}</span>
        <div class="promise">${e.promise}</div>
        <div class="detail">情绪:${e.emotion} | 受众:${e.audience} | 认错:${e.admit} | ${e.fulfilled?'✅兑现':'❌失信'}</div>
      </div>
    `).join('')}
  `;
}

async function simulateEvent() {
  const res = await fetch(`${API}/seven-factor/event`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      entity_id:'UID9622',
      entity_type:'user',
      promise:'仪表盘测试承诺',
      promised_deadline:new Date().toISOString(),
      fulfilled:Math.random()>0.3,
      fulfillment_detail:'自动测试',
      actual_time:new Date().toISOString(),
      emotion:['心甘情愿','积极','中性'][Math.floor(Math.random()*3)],
      audience:'老大',
      explanation:'不解释',
      admit:'真改',
      source:'仪表盘模拟',
      tags:['测试']
    })
  });
  const data = await res.json();
  alert(`事件已提交! credit_delta=${data.credit_delta}`);
  loadDashboard();
}

loadDashboard();
</script>
</body>
</html>
