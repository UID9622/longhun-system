<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>龍魂系统 · 引擎主控仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- DNA: #龍芯⚡️丙午·丙申·癸酉·庚申·临-LH-CTL-DASHBOARD-v1.0-9E8D7C6B -->

<style>
:root {
  --bg:#060810; --panel:rgba(8,8,20,0.96); --border:rgba(201,168,76,0.18);
  --gold:#c9a84c; --gold-dim:rgba(201,168,76,0.1);
  --green:#4ade80; --green-bg:rgba(74,222,128,0.08);
  --orange:#fb923c; --orange-bg:rgba(251,146,60,0.08);
  --red:#f87171; --red-bg:rgba(248,113,113,0.08);
  --cyan:#22d3ee; --purple:#a78bfa;
  --text:#d4d4d8; --dim:#71717a; --bright:#f0f0f0;
  --radius:12px; --radius-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--cyan);text-decoration:none}
a:hover{color:var(--gold)}
::selection{background:var(--gold-dim);color:#fff}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

#app{max-width:1200px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}

/* Header & Nav */
header{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;backdrop-filter:blur(12px)}
header .left{display:flex;flex-direction:column;gap:2px}
header h1{font-size:18px;color:var(--gold);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
header h1 .icon{font-size:22px}
header .sub{font-size:11px;color:var(--dim)}
header .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nav-links{display:flex;gap:16px;align-items:center;list-style:none;font-size:12px}
.nav-links a{color:var(--dim);transition:color .2s}
.nav-links a:hover{color:var(--gold)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-dot.online{background:var(--green);box-shadow:0 0 8px var(--green)}
.status-dot.degraded{background:var(--orange);box-shadow:0 0 8px var(--orange)}
.status-dot.offline{background:var(--red);box-shadow:0 0 8px var(--red)}
.refresh-btn{padding:8px 14px;background:var(--gold-dim);border:1px solid var(--border);color:var(--gold);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;transition:all .2s}
.refresh-btn:hover{background:rgba(201,168,76,0.2)}
.refresh-btn:disabled{opacity:.5;cursor:not-allowed}
.time-badge{font-size:11px;color:var(--dim);font-family:monospace}

/* Stats Row */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.stat-card .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.stat-card .value{font-size:28px;font-weight:700;letter-spacing:.02em}
.val-green{color:var(--green)}
.val-orange{color:var(--orange)}
.val-red{color:var(--red)}
.val-gold{color:var(--gold)}
.val-cyan{color:var(--cyan)}
.val-purple{color:var(--purple)}

/* Services Grid */
.section-title{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;padding:4px 0;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.service-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:all .2s}
.service-card:hover{border-color:rgba(201,168,76,0.35)}
.service-card .info{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.service-card .name{font-size:13px;font-weight:600;color:var(--bright);display:flex;align-items:center;gap:6px}
.service-card .detail{font-size:10px;color:var(--dim);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.service-card .summary{font-size:10px;color:var(--cyan);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.service-card .controls{display:flex;gap:6px}
.service-card button{width:28px;height:28px;border:1px solid var(--border);background:var(--gold-dim);border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.service-card button:hover{background:rgba(201,168,76,0.25);border-color:var(--gold)}
.service-card button:disabled{opacity:.3;cursor:not-allowed}
.health-badge{font-size:9px;padding:1px 6px;border-radius:10px;background:var(--green-bg);color:var(--green)}
.health-badge.warn{background:var(--orange-bg);color:var(--orange)}
.health-badge.crit{background:var(--red-bg);color:var(--red)}

/* Charts Section */
.charts-section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.chart-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
.chart-card h4{font-size:12px;color:var(--gold);margin-bottom:10px;letter-spacing:.05em}
.chart-wrap{position:relative;height:220px}
.comment-row{font-size:11px;color:var(--dim);padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.comment-row:last-child{border:none}

/* Log Section */
.log-section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.log-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.log-header .title{font-size:13px;font-weight:600;color:var(--bright)}
.log-body{padding:8px 16px;max-height:260px;overflow-y:auto;font-family:"SF Mono","Fira Code","Consolas",monospace;font-size:11px;line-height:1.8}
.log-entry{display:flex;gap:10px;padding:2px 0}
.log-entry .time{color:var(--dim);flex-shrink:0}
.log-entry.warn{color:var(--orange)}
.log-entry.error{color:var(--red)}
.log-entry.info{color:var(--dim)}
.log-entry.success{color:var(--green)}

/* Actions Row */
.actions-row{display:flex;flex-wrap:wrap;gap:8px}
.action-btn{padding:10px 18px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:6px}
.action-btn.primary{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}
.action-btn.primary:hover{background:#d4b356}
.action-btn.secondary{background:var(--gold-dim);color:var(--gold)}
.action-btn.secondary:hover{background:rgba(201,168,76,0.2)}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:var(--radius-sm);font-size:12px;z-index:999;animation:slideIn .3s ease;max-width:320px}
.toast.success{background:var(--green-bg);border:1px solid var(--green);color:var(--green)}
.toast.error{background:var(--red-bg);border:1px solid var(--red);color:var(--red)}
.toast.info{background:var(--gold-dim);border:1px solid var(--border);color:var(--gold)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Responsive */
@media(max-width:640px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .services-grid{grid-template-columns:1fr}
  header{flex-direction:column;align-items:flex-start}
  .nav-links{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="left">
      <h1><span class="icon">🐉</span>龍魂 · 引擎主控仪表盘</h1>
      <span class="sub">1011 引擎统一入口 · 运行日志摘要 · 闭环反馈</span>
    </div>
    <div class="right">
      <ul class="nav-links">
        <li><a href="/">🏠 首页</a></li>
        <li><a href="/portal/video-studio/">🎬 视频工坊</a></li>
        <li><a href="https://app.notion.com/p/3ab7125a9c9f8185beb0f22f9f0eeec7" target="_blank">📋 引擎注册表</a></li>
        <li><a href="/knowledge/">📚 记忆库</a></li>
      </ul>
      <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)">
        <span class="status-dot online" id="sysDot"></span>
        <span id="sysStatus">加载中...</span>
      </span>
      <button class="refresh-btn" id="refreshBtn" onclick="refreshAll()">⟳ 刷新</button>
      <span class="time-badge" id="clock">--:--:--</span>
    </div>
  </header>

  <div class="stats-row" id="statsRow">
    <div class="stat-card"><span class="label">引擎总数</span><span class="value val-gold" id="statTotal">-</span></div>
    <div class="stat-card"><span class="label">平均健康分</span><span class="value val-cyan" id="statHealth">-</span></div>
    <div class="stat-card"><span class="label">活跃引擎</span><span class="value val-green" id="statActive">-</span></div>
    <div class="stat-card"><span class="label">最近任务</span><span class="value val-purple" id="statJobs">-</span></div>
  </div>

  <div class="section-title">📊 统一数据视图（引擎 + 视频 + 任务）</div>
  <div class="charts-section">
    <div class="charts-grid">
      <div class="chart-card"><h4>引擎分类分布</h4><div class="chart-wrap"><canvas id="chartCategories"></canvas></div></div>
      <div class="chart-card"><h4>任务执行统计</h4><div class="chart-wrap"><canvas id="chartJobs"></canvas></div></div>
      <div class="chart-card"><h4>视频风格分布</h4><div class="chart-wrap"><canvas id="chartVideoStyles"></canvas></div></div>
      <div class="chart-card"><h4>每日视频互动</h4><div class="chart-wrap"><canvas id="chartVideoDaily"></canvas></div></div>
      <div class="chart-card" style="grid-column:1/-1"><h4>最近评论</h4><div id="recentComments" style="max-height:220px;overflow-y:auto"></div></div>
    </div>
  </div>

  <div class="section-title">🖥 引擎状态（来自 Notion 注册表）</div>
  <div class="services-grid" id="servicesGrid">
    <div class="service-card"><span style="color:var(--dim)">加载中...</span></div>
  </div>

  <div class="section-title">⚡ 一键操作</div>
  <div class="actions-row">
    <button class="action-btn secondary" onclick="runEngine('audit')">🛡 运行审计</button>
    <button class="action-btn secondary" onclick="runEngine('search','龙魂')">🔍 测试搜索</button>
    <button class="action-btn secondary" onclick="syncNotion()">📥 同步 Notion</button>
    <button class="action-btn secondary" onclick="run3d()">🧊 图生三维</button>
    <a class="action-btn primary" href="https://app.notion.com/p/3ab7125a9c9f8185beb0f22f9f0eeec7" target="_blank">📋 打开注册表</a>
  </div>

  <div class="log-section">
    <div class="log-header">
      <span class="title">📋 最近运行日志（lh-ctl）</span>
      <span style="font-size:10px;color:var(--dim)" id="logCount">0 条</span>
    </div>
    <div class="log-body" id="logBody">
      <div class="log-entry info"><span class="time">--:--:--</span><span>等待数据...</span></div>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
const API_BASE='/api';

let engineList=[];
let charts={};
let metricsData=null;

document.addEventListener('DOMContentLoaded',()=>{
  setInterval(updateClock,1000);
  updateClock();
  refreshAll();
  setInterval(refreshAll,30000);
});

function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleString('zh-CN',{hour12:false});
}

async function refreshAll(){
  const btn=document.getElementById('refreshBtn');
  if(btn){btn.textContent='⟳ 刷新中...';btn.disabled=true;}
  await Promise.all([fetchEngines(),fetchLogs(),fetchMetrics()]);
  updateStats();
  if(btn){btn.textContent='⟳ 刷新';btn.disabled=false;}
}

async function api(path,opts={}){
  const res=await fetch(`${API_BASE}${path}`,opts);
  if(!res.ok){
    const txt=await res.text();
    throw new Error(`${res.status}: ${txt}`);
  }
  return res.json();
}

async function fetchEngines(){
  const grid=document.getElementById('servicesGrid');
  try{
    const data=await api('/status');
    engineList=data.engines||[];
    grid.innerHTML='';
    engineList.slice(0,30).forEach(eng=>{
      const card=document.createElement('div');
      card.className='service-card';
      const healthCls=eng.health>=80?'':eng.health>=60?'warn':'crit';
      const summary=eng.summary?eng.summary:'';
      card.innerHTML=`
        <div class="info">
          <span class="name">
            <span class="status-dot ${eng.status==='active'?'online':'degraded'}"></span>
            ${eng.name}
            <span class="health-badge ${healthCls}">${eng.health}</span>
          </span>
          <span class="detail">${eng.category||''} · ${eng.subcategory||''} · ${eng.type||''}</span>
          ${summary?`<span class="summary">📝 ${summary}</span>`:''}
        </div>
        <div class="controls">
          <button onclick="viewEngine('${eng.id}')" title="详情">👁</button>
        </div>
      `;
      grid.appendChild(card);
    });
    if(engineList.length>30){
      const more=document.createElement('div');
      more.className='service-card';
      more.style.justifyContent='center';
      more.innerHTML=`<span style="color:var(--dim);font-size:12px">还有 ${engineList.length-30} 个引擎，请在 Notion 注册表查看完整列表 →</span>`;
      grid.appendChild(more);
    }
    document.getElementById('sysStatus').textContent=`注册表已同步 · ${engineList.length} 引擎`;
    document.getElementById('sysDot').className='status-dot online';
  }catch(e){
    grid.innerHTML=`<div class="service-card"><span style="color:var(--red)">加载失败: ${e.message}</span></div>`;
    document.getElementById('sysStatus').textContent='注册表读取失败';
    document.getElementById('sysDot').className='status-dot offline';
  }
}

async function fetchLogs(){
  const body=document.getElementById('logBody');
  try{
    const data=await api('/logs?tail=20');
    const jobs=data.jobs||[];
    document.getElementById('logCount').textContent=`${jobs.length} 条`;
    if(!jobs.length){
      body.innerHTML='<div class="log-entry info"><span class="time">--:--:--</span><span>暂无运行日志</span></div>';
      return;
    }
    body.innerHTML=jobs.map(j=>{
      const t=j.started_at?j.started_at.split('T')[1].slice(0,8):'--:--:--';
      const cls=j.exit_code===0?'success':j.exit_code?'error':'warn';
      return `<div class="log-entry ${cls}"><span class="time">${t}</span><span>[${j.command}] ${j.summary||''} ${j.job_id?'· '+j.job_id:''}</span></div>`;
    }).join('');
  }catch(e){
    body.innerHTML=`<div class="log-entry error"><span class="time">--:--:--</span><span>日志加载失败: ${e.message}</span></div>`;
  }
}

function updateStats(){
  document.getElementById('statTotal').textContent=engineList.length;
  const active=engineList.filter(e=>e.status==='active').length;
  document.getElementById('statActive').textContent=active;
  const avg=engineList.length?Math.round(engineList.reduce((a,b)=>a+(b.health||0),0)/engineList.length):0;
  document.getElementById('statHealth').textContent=avg;
  const logCount=parseInt(document.getElementById('logCount').textContent)||0;
  document.getElementById('statJobs').textContent=logCount;
}

async function runEngine(command,arg){
  toast(`正在触发: ${command}...`,'info');
  try{
    const payload={command,args:{}};
    if(command==='search') payload.args.query=arg||'龙魂';
    const data=await api('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    toast(`任务已提交: ${data.job.job_id}`,'success');
    setTimeout(refreshAll,3000);
  }catch(e){
    toast(`提交失败: ${e.message}`,'error');
  }
}

async function syncNotion(){
  toast('Notion 同步任务后台执行中...','info');
  // 这里调用 lh_ctl.py 的 status --refresh，或直接调用 syncer
  setTimeout(refreshAll,5000);
}

function viewEngine(id){
  const eng=engineList.find(e=>e.id===id);
  if(!eng)return;
  toast(`${eng.name} · 健康分 ${eng.health} · ${eng.description||'无描述'}`,'info');
}

async function fetchMetrics(){
  try{
    metricsData=await api('/metrics');
    renderMetricCharts();
  }catch(e){
    console.error('metrics load failed',e);
  }
}

function renderMetricCharts(){
  if(!metricsData)return;
  const e=metricsData.engines||{};
  renderDoughnut('chartCategories', Object.keys(e.by_category||{}), Object.values(e.by_category||{}));
  const j=metricsData.jobs||{};
  renderBar('chartJobs', Object.keys(j.by_command||{}), Object.values(j.by_command||{}));
  const v=metricsData.videos||{};
  renderDoughnut('chartVideoStyles', Object.keys(v.by_style||{}), Object.values(v.by_style||{}), true);
  const daily=v.daily||[];
  renderLine('chartVideoDaily', daily.map(d=>d.date.slice(5)), daily.map(d=>d.views), daily.map(d=>d.downloads), daily.map(d=>d.shares), daily.map(d=>d.comments));
  renderRecentComments(v.recent_comments||[]);
}

function renderDoughnut(canvasId, labels, data, smallLegend=false){
  const ctx=document.getElementById(canvasId).getContext('2d');
  const colors=['#c9a84c','#22d3ee','#a78bfa','#4ade80','#fb923c','#f87171','#60a5fa'];
  if(charts[canvasId])charts[canvasId].destroy();
  charts[canvasId]=new Chart(ctx,{
    type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:smallLegend?'right':'bottom',labels:{color:'#71717a',font:{size:10}}}}}
  });
}

function renderBar(canvasId, labels, data){
  const ctx=document.getElementById(canvasId).getContext('2d');
  if(charts[canvasId])charts[canvasId].destroy();
  charts[canvasId]=new Chart(ctx,{
    type:'bar',
    data:{labels,datasets:[{label:'次数',data,backgroundColor:'rgba(201,168,76,.7)',borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#71717a'},grid:{color:'rgba(255,255,255,.05)'}},y:{ticks:{color:'#71717a'},grid:{color:'rgba(255,255,255,.05)'},beginAtZero:true}}}
  });
}

function renderLine(canvasId, labels, views, downloads, shares, comments){
  const ctx=document.getElementById(canvasId).getContext('2d');
  if(charts[canvasId])charts[canvasId].destroy();
  charts[canvasId]=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[
      {label:'浏览',data:views,borderColor:'#22d3ee',backgroundColor:'rgba(34,211,238,.1)',tension:.3,fill:true},
      {label:'下载',data:downloads,borderColor:'#4ade80',backgroundColor:'rgba(74,222,128,.1)',tension:.3,fill:true},
      {label:'转发',data:shares,borderColor:'#a78bfa',backgroundColor:'rgba(167,139,250,.1)',tension:.3,fill:true},
      {label:'评论',data:comments,borderColor:'#fb923c',backgroundColor:'rgba(251,146,60,.1)',tension:.3,fill:true}
    ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#71717a',font:{size:10}}}},scales:{x:{ticks:{color:'#71717a'},grid:{color:'rgba(255,255,255,.05)'}},y:{ticks:{color:'#71717a'},grid:{color:'rgba(255,255,255,.05)'},beginAtZero:true}}}
  });
}

function renderRecentComments(comments){
  const box=document.getElementById('recentComments');
  if(!comments.length){box.innerHTML='<div class="comment-row">暂无评论</div>';return;}
  box.innerHTML=comments.map(c=>`
    <div class="comment-row">
      <span style="color:var(--gold)">${escHtml(c.nickname||'匿名')}</span>
      <span style="color:var(--dim);margin:0 6px">·</span>
      <span style="color:${c.source&&c.source.includes('水军')?'var(--red)':'var(--cyan)'};margin-right:6px">${escHtml(c.source||'真实用户')}</span>
      ${escHtml(c.content||'').slice(0,60)}${(c.content||'').length>60?'...':''}
      <span style="float:right;color:var(--dim)">${c.created_at?c.created_at.slice(0,16).replace('T',' '):''}</span>
    </div>
  `).join('');
}

function escHtml(s){
  if(!s)return '';
  const div=document.createElement('div');div.textContent=s;return div.innerHTML;
}

async function run3d(){
  const input=prompt('输入图像路径', 'data/3d_forge/test_input.png');
  if(!input) return;
  const category=prompt('分类 (object/character/building/nature/military)', 'object');
  if(!category) return;
  const style=prompt('风格 (realistic/stylized)', 'realistic');
  toast('正在提交 3D 生成任务...','info');
  try{
    const data=await api('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:'3d',args:{input,category,style}})});
    toast(`3D 任务已提交: ${data.job.job_id}`,'success');
    setTimeout(refreshAll,3000);
  }catch(e){
    toast(`提交失败: ${e.message}`,'error');
  }
}

function toast(msg,type='info'){
  const container=document.getElementById('toastContainer');
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.textContent=msg;
  container.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300)},4000);
}
</script>
</body>
</html>
