# DNA: #龍芯⚡️丙午·丙申·庚戌·䷙大畜-SCRIPT-MANAGER-v1.2-UID9622
# CONFIRM: #CONFIRM🌌9622-ONLY-ONCE🧬LK9X-772Z
# SEAL: #ZHUGEXIN⚡️2025-🇨🇳🐉⚖️♠️🧚🏼‍♀️❤️♾️-DEVICE-BIND-SOUL
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNSH标准词典 · 龍魂语义库</title>
<style>
:root {
  --gold: #c9a84c;
  --gold-dim: rgba(201,168,76,0.15);
  --gold-light: rgba(201,168,76,0.08);
  --bg: #0d0d0d;
  --bg-card: #141414;
  --bg-input: #1a1a1a;
  --text: #e0d5c1;
  --text-dim: #8a8070;
  --border: #2a2520;
  --red: #c94c4c;
  --green: #4cc94c;
  --yellow: #c9a84c;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
.container { max-width: 900px; margin: 0 auto; padding: 16px; }

/* 头部 */
.header {
  text-align: center;
  padding: 40px 16px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
.header h1 {
  font-size: 28px;
  color: var(--gold);
  margin-bottom: 8px;
  letter-spacing: 2px;
}
.header .subtitle {
  font-size: 14px;
  color: var(--text-dim);
}
.header .dna {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 12px;
  font-family: monospace;
  opacity: 0.6;
}

/* 搜索 */
.search-box {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.search-box input {
  flex: 1;
  padding: 12px 16px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus {
  border-color: var(--gold);
}
.search-box button {
  padding: 12px 20px;
  background: var(--gold);
  color: #0d0d0d;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.search-box button:hover { opacity: 0.85; }

/* 分类标签 */
.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 20px;
}
.cat-tag {
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
  transition: all 0.2s;
  white-space: nowrap;
}
.cat-tag:hover, .cat-tag.active {
  border-color: var(--gold);
  color: var(--gold);
  background: var(--gold-dim);
}
.cat-tag .count {
  font-size: 10px;
  margin-left: 4px;
  opacity: 0.6;
}

/* 结果区 */
.results-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--text-dim);
}
.results-count { color: var(--gold); }

/* 卡片 */
.entry-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.entry-card:hover {
  border-color: var(--gold);
}
.entry-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.entry-cnsh {
  font-size: 20px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 1px;
}
.entry-en {
  font-size: 13px;
  color: var(--text-dim);
  font-family: monospace;
}
.entry-cat {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--gold-dim);
  color: var(--gold);
  white-space: nowrap;
}
.entry-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  font-size: 13px;
}
.entry-body .label {
  color: var(--text-dim);
  font-size: 11px;
  margin-bottom: 2px;
}
.entry-body .value {
  color: var(--text);
}
.entry-usage {
  margin-top: 10px;
  padding: 8px 12px;
  background: var(--bg-input);
  border-radius: 6px;
  font-family: monospace;
  font-size: 12px;
  color: var(--gold);
  border-left: 2px solid var(--gold);
}
.entry-origin {
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-dim);
  font-style: italic;
}

/* 统计面板 */
.stats-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}
.stat-item {
  flex: 1;
  min-width: 80px;
  padding: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-align: center;
}
.stat-item .num {
  font-size: 24px;
  font-weight: 700;
  color: var(--gold);
}
.stat-item .lbl {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* 命名原则 */
.principles {
  margin-top: 32px;
  padding: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.principles h3 {
  color: var(--gold);
  margin-bottom: 12px;
  font-size: 16px;
}
.principles .grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 6px;
}
.principle-item {
  padding: 8px 12px;
  background: var(--gold-light);
  border-radius: 6px;
  font-size: 12px;
}
.principle-item .prefix {
  color: var(--gold);
  font-weight: 700;
  font-size: 14px;
  margin-right: 4px;
}

/* 空状态 */
.empty {
  text-align: center;
  padding: 60px 16px;
  color: var(--text-dim);
}
.empty .icon { font-size: 48px; margin-bottom: 12px; }

/* 加载 */
.loading {
  text-align: center;
  padding: 40px;
  color: var(--text-dim);
}

@media (max-width: 600px) {
  .entry-body { grid-template-columns: 1fr; }
  .stats-bar { gap: 4px; }
  .stat-item { padding: 8px; }
  .stat-item .num { font-size: 18px; }
}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>🐉 CNSH标准词典</h1>
    <div class="subtitle">深度学习生态对照表 · 中国古人智慧命名 · 不求西方认可</div>
    <div class="dna">#龍芯⚡️丙午·乙未·乙未·酉时·☷坤-CNSH-DICTIONARY-v1.0</div>
  </div>

  <!-- 统计 -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-item"><div class="num" id="statTotal">-</div><div class="lbl">总条目</div></div>
    <div class="stat-item"><div class="num" id="statCats">-</div><div class="lbl">分类</div></div>
    <div class="stat-item"><div class="num" id="statActions">-</div><div class="lbl">动作前缀</div></div>
    <div class="stat-item"><div class="num" id="statSuffix">-</div><div class="lbl">层级后缀</div></div>
  </div>

  <!-- 搜索 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索英文/CNSH/中文… 如: 加密、分身、thread、淬炼" 
           onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
  </div>

  <!-- 分类 -->
  <div class="categories" id="catTags"></div>

  <!-- 结果 -->
  <div class="results-header">
    <span id="resultsInfo"></span>
    <span id="resultsCount" class="results-count"></span>
  </div>
  <div id="results"></div>

  <!-- 命名原则 -->
  <div class="principles" id="principlesBox" style="display:none">
    <h3>📜 CNSH命名原则</h3>
    <div id="principlesList"></div>
  </div>

</div>

<script>
const API_BASE = '/xiaoyi/api/v1/xiaoyi/cnsh';
let allCategories = [];
let activeCat = '';

async function init() {
  try {
    const r = await fetch(`${API_BASE}/categories`);
    const d = await r.json();
    if (!d.success) return;
    
    document.getElementById('statTotal').textContent = d.total_entries;
    document.getElementById('statCats').textContent = d.categories.length;
    
    // 分类标签
    allCategories = d.categories;
    renderCategories();
    
    // 默认显示全部
    doSearch();
  } catch(e) {
    document.getElementById('results').innerHTML = '<div class="empty"><div class="icon">🔌</div>API未连接</div>';
  }
}

function renderCategories() {
  const el = document.getElementById('catTags');
  el.innerHTML = `
    <span class="cat-tag ${activeCat===''?'active':''}" onclick="selectCat('')">
      全部<span class="count">${allCategories.reduce((s,c)=>s+c.count,0)}</span>
    </span>
  ` + allCategories.map(c => `
    <span class="cat-tag ${activeCat===c.code?'active':''}" onclick="selectCat('${c.code}')">
      ${c.name}<span class="count">${c.count}</span>
    </span>
  `).join('');
}

function selectCat(code) {
  activeCat = code;
  renderCategories();
  doSearch();
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  const resultsEl = document.getElementById('results');
  
  resultsEl.innerHTML = '<div class="loading">搜索中...</div>';
  
  let url = `${API_BASE}/search?`;
  if (q) url += `q=${encodeURIComponent(q)}&`;
  if (activeCat) url += `category=${encodeURIComponent(activeCat)}`;
  
  try {
    const r = await fetch(url);
    const d = await r.json();
    
    if (!d.success || d.count === 0) {
      resultsEl.innerHTML = `<div class="empty"><div class="icon">🔍</div>未找到"${q || '全部'}"相关条目</div>`;
      document.getElementById('resultsCount').textContent = '';
      document.getElementById('resultsInfo').textContent = '';
      return;
    }
    
    document.getElementById('resultsInfo').textContent = q ? `搜索: "${q}"` : '浏览全部';
    document.getElementById('resultsCount').textContent = `${d.count} 条`;
    
    resultsEl.innerHTML = d.results.map(e => `
      <div class="entry-card">
        <div class="entry-header">
          <div>
            <span class="entry-cnsh">${e.cnsh}</span>
            <span class="entry-en" style="margin-left:8px">${e.en}</span>
          </div>
          <span class="entry-cat">${e.category_name || e.category}</span>
        </div>
        <div class="entry-body">
          <div>
            <div class="label">中文直译</div>
            <div class="value">${e.cn_direct}</div>
          </div>
          <div>
            <div class="label">人话解释</div>
            <div class="value">${e.explanation}</div>
          </div>
          ${e.scene ? `<div>
            <div class="label">龍魂场景</div>
            <div class="value">${e.scene}</div>
          </div>` : ''}
        </div>
        ${e.cnsh_usage ? `<div class="entry-usage">${e.cnsh_usage}</div>` : ''}
        ${e.cultural_origin ? `<div class="entry-origin">📖 ${e.cultural_origin}</div>` : ''}
      </div>
    `).join('');
    
  } catch(e) {
    resultsEl.innerHTML = '<div class="empty"><div class="icon">⚠️</div>查询失败</div>';
  }
}

// 命名原则
async function loadPrinciples() {
  try {
    const r = await fetch(`${API_BASE}/categories`);
    const d = await r.json();
    if (d.principles) {
      document.getElementById('principlesBox').style.display = 'block';
      document.getElementById('principlesList').innerHTML = 
        '<div class="grid">' + d.principles.map(p => 
          `<div class="principle-item"><span class="prefix">▸</span>${p}</div>`
        ).join('') + '</div>';
    }
  } catch(e) {}
}

init();
loadPrinciples();
</script>
</body>
</html>
