# 龍魂统一门户 · Docker Compose
# DNA: #龍芯⚡️2026-07-04-LONGHUN888-PORTAL-COMPOSE-v1.0
version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: longhun888-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/longhun888.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/portal:ro
    depends_on:
      - cnsh-editor-api
    networks:
      - longhun-net

  cnsh-editor-api:
    image: ${SWR_IMAGE:-cnsh-editor-api:latest}
    container_name: longhun888-cnsh-api
    restart: unless-stopped
    environment:
      - CNSH_API_TIER=paid
      - CNSH_API_HOST=0.0.0.0
      - CNSH_API_PORT=8000
    networks:
      - longhun-net

networks:
  longhun-net:
    driver: bridge
