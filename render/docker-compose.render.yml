version: '3.8'
services:
  lh-render:
    build:
      context: .
      dockerfile: render/Dockerfile.render
    platform: linux/amd64   # 鲲鹏实测 x86_64 (Intel Xeon 6348)
    ports:
      - "8788:8788"   # 2026-08-30 同步迁移: 8972 已被本机 flow-field-api 占用
    volumes:
      - ./data/renders:/app/data/renders
      - ./render/templates:/app/render/templates
      - ./render/config/render.yaml:/app/render/config/render.yaml
    environment:
      - LH_UID=UID9622
      - LH_LOCAL_ONLY=true
      - LH_MAX_CONCURRENCY=8
    shm_size: 2gb
    restart: unless-stopped
