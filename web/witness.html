<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐲 龍魂·维权证据固化台</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --card: #12122a;
            --border: #2a2a5a;
            --gold: #d4af37;
            --gold-dim: #8a7a2a;
            --text: #e8e8f0;
            --muted: #9090a8;
            --red: #ff6b6b;
            --green: #6bff8a;
            --blue: #6b8aff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 32px;
        }
        header h1 {
            margin: 0;
            font-size: 28px;
            color: var(--gold);
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
        }
        header p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 14px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--muted);
        }
        textarea {
            width: 100%;
            min-height: 180px;
            background: #0d0d20;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 14px;
            font-size: 15px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: var(--gold);
        }
        .options {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
        }
        .options input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--gold);
        }
        .options label {
            margin: 0;
            color: var(--text);
            cursor: pointer;
        }
        .hint {
            font-size: 12px;
            color: var(--muted);
            margin-left: 28px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--gold-dim), var(--gold));
            border: none;
            border-radius: 8px;
            color: #0a0a1a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            display: none;
            margin-top: 20px;
        }
        .result.show { display: block; }
        .result-title {
            color: var(--green);
            font-weight: bold;
            margin-bottom: 12px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .result-row:last-child { border-bottom: none; }
        .result-key { color: var(--muted); }
        .result-value { color: var(--text); text-align: right; max-width: 60%; word-break: break-all; }
        .error {
            color: var(--red);
            margin-top: 12px;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .spinner {
            display: none;
            text-align: center;
            margin-top: 16px;
            color: var(--gold);
        }
        footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin-top: 40px;
        }
        footer .dna {
            color: var(--gold-dim);
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐲 龍魂·维权证据固化台</h1>
            <p>数据根留本地 · 国密 SM4 加密 · 可选 GPG 签章 · Agent 审计链</p>
        </header>

        <div class="card">
            <label for="evidence">证据内容</label>
            <textarea id="evidence" placeholder="请详细描述事件经过、时间、平台、涉及账号等信息。支持多行输入。"></textarea>

            <div class="options">
                <input type="checkbox" id="signMode" checked>
                <label for="signMode">启用 Agent 审计 + GPG 签章</label>
            </div>
            <div class="hint">开启后，P05 上帝之眼、P15 乔前辈、S3 人民维权助手将预审证据，并附加 GPG 分离签名。</div>

            <button id="submitBtn" onclick="submitEvidence()">🛡️ 固化证据</button>
            <div class="spinner" id="spinner">⏳ 正在固化，请稍候...</div>
            <div class="error" id="error"></div>
        </div>

        <div class="card result" id="result">
            <div class="result-title">✅ 证据已固化</div>
            <div class="result-row"><span class="result-key">证据ID</span><span class="result-value" id="resId"></span></div>
            <div class="result-row"><span class="result-key">加密文件</span><span class="result-value" id="resEnc"></span></div>
            <div class="result-row"><span class="result-key">签名文件</span><span class="result-value" id="resAsc"></span></div>
            <div class="result-row"><span class="result-key">Agent 审计</span><span class="result-value" id="resAudit"></span></div>
            <div class="result-row"><span class="result-key">SHA-256</span><span class="result-value" id="resHash"></span></div>
        </div>

        <footer>
            <p>DNA: <span class="dna">#龍芯⚡️丙午·癸未·甲申-WITNESS-WEB-v1.0-UID9622</span></p>
            <p>所有数据仅保存在本地，不上传任何第三方服务器。</p>
        </footer>
    </div>

    <script>
        async function submitEvidence() {
            const content = document.getElementById('evidence').value.trim();
            if (!content) {
                showError('请先输入证据内容');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const error = document.getElementById('error');
            const result = document.getElementById('result');

            btn.disabled = true;
            spinner.style.display = 'block';
            error.textContent = '';
            result.classList.remove('show');

            try {
                const resp = await fetch('/api/witness', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: content,
                        sign: document.getElementById('signMode').checked
                    })
                });
                const data = await resp.json();
                if (!resp.ok || data.error) {
                    throw new Error(data.error || '服务器返回错误');
                }
                showResult(data);
            } catch (e) {
                showError(e.message);
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        }

        function showError(msg) {
            document.getElementById('error').textContent = '❌ ' + msg;
        }

        function showResult(data) {
            document.getElementById('resId').textContent = data.witness_id || '-';
            document.getElementById('resEnc').textContent = data.enc_file || '-';
            document.getElementById('resAsc').textContent = data.asc_file || '未启用';
            document.getElementById('resAudit').textContent = data.audit || '未启用';
            document.getElementById('resHash').textContent = (data.sha256 || '').slice(0, 32) + '...';
            document.getElementById('result').classList.add('show');
        }
    </script>
<!-- 龍魂生态准入弹窗 · 自动注入 · 勿手动修改 -->
<style>
#lh-eco-popup-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85); z-index: 99999; justify-content: center; align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
#lh-eco-popup-overlay.active { display: flex; }
.lh-popup-card {
    background: linear-gradient(145deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
    border: 1px solid #c9a54b; border-radius: 12px; padding: 32px 40px;
    max-width: 480px; width: 90%; text-align: center; color: #e0d5c1;
    box-shadow: 0 0 60px rgba(201, 165, 75, 0.15), 0 8px 32px rgba(0,0,0,0.6);
}
.lh-popup-title {
    font-size: 28px; font-weight: 700; color: #c9a54b; margin-bottom: 8px;
    letter-spacing: 2px;
}
.lh-popup-subtitle {
    font-size: 14px; color: #8a7a5a; margin-bottom: 24px;
}
.lh-status-badge {
    display: inline-block; padding: 6px 18px; border-radius: 20px;
    font-size: 13px; font-weight: 600; margin: 16px 0; letter-spacing: 1px;
}
.lh-status-alive { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
.lh-status-expired { background: rgba(241, 196, 15, 0.15); color: #f1c40f; border: 1px solid rgba(241, 196, 15, 0.3); }
.lh-status-builder { background: rgba(201, 165, 75, 0.15); color: #c9a54b; border: 1px solid rgba(201, 165, 75, 0.3); }
.lh-popup-detail { font-size: 13px; color: #8a8a8a; line-height: 1.8; margin: 16px 0; }
.lh-popup-btn {
    display: inline-block; margin: 6px; padding: 10px 24px; border-radius: 6px;
    font-size: 14px; font-weight: 600; cursor: pointer; border: none; letter-spacing: 1px;
    transition: all 0.2s ease;
}
.lh-btn-primary {
    background: linear-gradient(135deg, #c9a54b, #e2c87a); color: #0a0a0f;
}
.lh-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(201,165,75,0.4); }
.lh-btn-secondary { background: transparent; color: #c9a54b; border: 1px solid #c9a54b; }
.lh-btn-secondary:hover { background: rgba(201,165,75,0.1); }
.lh-popup-footer { font-size: 11px; color: #5a5a5a; margin-top: 20px; }
.lh-popup-footer a { color: #c9a54b; text-decoration: none; }
</style>

<div id="lh-eco-popup-overlay">
    <div class="lh-popup-card">
        <div class="lh-popup-title">🌐 龍魂生态</div>
        <div class="lh-popup-subtitle">月度活人验证 · 生态准入关</div>
        <div id="lh-status-badge" class="lh-status-badge">加载中...</div>
        <div class="lh-popup-detail" id="lh-popup-detail"></div>
        <div>
            <button class="lh-popup-btn lh-btn-primary" onclick="lhEcoRenew()">💓 续费心跳 ¥1/月</button>
            <button class="lh-popup-btn lh-btn-secondary" onclick="lhEcoClose()">稍后再说</button>
        </div>
        <div class="lh-popup-footer">
            每月1元证明你是活人 · 数据永远归你 · <a href="https://uid9622.cn/protocol" target="_blank">协议全文</a>
        </div>
    </div>
</div>

<script>
(function() {
    var API_BASE = '/api/eco';
    var popup = document.getElementById('lh-eco-popup-overlay');
    var lastShown = localStorage.getItem('lh_eco_popup_last');
    var now = Date.now();
    
    // 24小时内不重复弹窗
    if (lastShown && (now - parseInt(lastShown)) < 86400000) return;
    
    function showPopup() {
        if (popup) popup.classList.add('active');
        localStorage.setItem('lh_eco_popup_last', now.toString());
    }
    
    function fetchStatus() {
        fetch(API_BASE + '/alive-status')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var badge = document.getElementById('lh-status-badge');
                var detail = document.getElementById('lh-popup-detail');
                if (!badge || !detail) return;
                
                if (data.status === 'alive') {
                    badge.textContent = '🟢 生态内';
                    badge.className = 'lh-status-badge lh-status-alive';
                    detail.innerHTML = '验证有效 · 到期: ' + (data.expiry || '—') + '<br>剩余: ' + (data.days_left || 0) + '天';
                    // 生态内不弹窗
                } else if (data.status === 'builder') {
                    badge.textContent = '⚪ 共建者';
                    badge.className = 'lh-status-badge lh-status-builder';
                    detail.innerHTML = '连续12月+ · 生态内全功能 + 治理投票';
                } else {
                    badge.textContent = '🟡 生态外';
                    badge.className = 'lh-status-badge lh-status-expired';
                    detail.innerHTML = '月度验证已过期<br>数据保留·可导出·不锁功能<br>续费1元即刻回归生态内';
                    showPopup();
                }
            })
            .catch(function() {
                // API不可达时不弹窗
            });
    }
    
    // 页面加载后2秒检查
    setTimeout(fetchStatus, 2000);
    
    // 暴露全局函数
    window.lhEcoRenew = function() {
        fetch(API_BASE + '/renew', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({uid: 'UID9622'}) })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.qr_code || data.payment_url) {
                    window.open(data.payment_url || data.qr_code, '_blank');
                }
                if (popup) popup.classList.remove('active');
                setTimeout(fetchStatus, 3000);
            });
    };
    window.lhEcoClose = function() {
        if (popup) popup.classList.remove('active');
    };
})();
</script>
<!-- /龍魂生态准入弹窗 -->
</body>
</html>
