<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐲 龙魂·维权证据固化台</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --card: #12122a;
            --border: #2a2a5a;
            --gold: #d4af37;
            --gold-dim: #8a7a2a;
            --text: #e8e8f0;
            --muted: #9090a8;
            --red: #ff6b6b;
            --green: #6bff8a;
            --blue: #6b8aff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 32px;
        }
        header h1 {
            margin: 0;
            font-size: 28px;
            color: var(--gold);
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
        }
        header p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 14px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--muted);
        }
        textarea {
            width: 100%;
            min-height: 180px;
            background: #0d0d20;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 14px;
            font-size: 15px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: var(--gold);
        }
        .options {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
        }
        .options input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--gold);
        }
        .options label {
            margin: 0;
            color: var(--text);
            cursor: pointer;
        }
        .hint {
            font-size: 12px;
            color: var(--muted);
            margin-left: 28px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--gold-dim), var(--gold));
            border: none;
            border-radius: 8px;
            color: #0a0a1a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            display: none;
            margin-top: 20px;
        }
        .result.show { display: block; }
        .result-title {
            color: var(--green);
            font-weight: bold;
            margin-bottom: 12px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .result-row:last-child { border-bottom: none; }
        .result-key { color: var(--muted); }
        .result-value { color: var(--text); text-align: right; max-width: 60%; word-break: break-all; }
        .error {
            color: var(--red);
            margin-top: 12px;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .spinner {
            display: none;
            text-align: center;
            margin-top: 16px;
            color: var(--gold);
        }
        footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin-top: 40px;
        }
        footer .dna {
            color: var(--gold-dim);
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐲 龙魂·维权证据固化台</h1>
            <p>数据根留本地 · 国密 SM4 加密 · 可选 GPG 签章 · Agent 审计链</p>
        </header>

        <div class="card">
            <label for="evidence">证据内容</label>
            <textarea id="evidence" placeholder="请详细描述事件经过、时间、平台、涉及账号等信息。支持多行输入。"></textarea>

            <div class="options">
                <input type="checkbox" id="signMode" checked>
                <label for="signMode">启用 Agent 审计 + GPG 签章</label>
            </div>
            <div class="hint">开启后，P05 上帝之眼、P15 乔前辈、S3 人民维权助手将预审证据，并附加 GPG 分离签名。</div>

            <button id="submitBtn" onclick="submitEvidence()">🛡️ 固化证据</button>
            <div class="spinner" id="spinner">⏳ 正在固化，请稍候...</div>
            <div class="error" id="error"></div>
        </div>

        <div class="card result" id="result">
            <div class="result-title">✅ 证据已固化</div>
            <div class="result-row"><span class="result-key">证据ID</span><span class="result-value" id="resId"></span></div>
            <div class="result-row"><span class="result-key">加密文件</span><span class="result-value" id="resEnc"></span></div>
            <div class="result-row"><span class="result-key">签名文件</span><span class="result-value" id="resAsc"></span></div>
            <div class="result-row"><span class="result-key">Agent 审计</span><span class="result-value" id="resAudit"></span></div>
            <div class="result-row"><span class="result-key">SHA-256</span><span class="result-value" id="resHash"></span></div>
        </div>

        <footer>
            <p>DNA: <span class="dna">#龍芯⚡️丙午·癸未·甲申-WITNESS-WEB-v1.0-UID9622</span></p>
            <p>所有数据仅保存在本地，不上传任何第三方服务器。</p>
        </footer>
    </div>

    <script>
        async function submitEvidence() {
            const content = document.getElementById('evidence').value.trim();
            if (!content) {
                showError('请先输入证据内容');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const error = document.getElementById('error');
            const result = document.getElementById('result');

            btn.disabled = true;
            spinner.style.display = 'block';
            error.textContent = '';
            result.classList.remove('show');

            try {
                const resp = await fetch('/api/witness', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: content,
                        sign: document.getElementById('signMode').checked
                    })
                });
                const data = await resp.json();
                if (!resp.ok || data.error) {
                    throw new Error(data.error || '服务器返回错误');
                }
                showResult(data);
            } catch (e) {
                showError(e.message);
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        }

        function showError(msg) {
            document.getElementById('error').textContent = '❌ ' + msg;
        }

        function showResult(data) {
            document.getElementById('resId').textContent = data.witness_id || '-';
            document.getElementById('resEnc').textContent = data.enc_file || '-';
            document.getElementById('resAsc').textContent = data.asc_file || '未启用';
            document.getElementById('resAudit').textContent = data.audit || '未启用';
            document.getElementById('resHash').textContent = (data.sha256 || '').slice(0, 32) + '...';
            document.getElementById('result').classList.add('show');
        }
    </script>
</body>
</html>
