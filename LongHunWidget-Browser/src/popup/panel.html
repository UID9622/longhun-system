<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龍魂DNA追溯助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 420px;
            min-height: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, #d4af37 0%, #f4a460 100%);
            color: #000;
            padding: 16px;
            text-align: center;
            border-bottom: 2px solid #d4af37;
        }

        .header h1 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.8;
        }

        .status-bar {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: space-around;
            font-size: 12px;
        }

        .status-item {
            text-align: center;
        }

        .status-value {
            font-size: 16px;
            font-weight: bold;
            color: #d4af37;
        }

        .content {
            padding: 16px;
        }

        .section {
            margin-bottom: 16px;
            background: rgba(212, 175, 55, 0.1);
            border-left: 3px solid #d4af37;
            padding: 12px;
            border-radius: 4px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #d4af37;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 10px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #d4af37;
            color: #000;
        }

        .btn-primary:hover {
            background: #f4a460;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-secondary {
            background: rgba(212, 175, 55, 0.3);
            color: #d4af37;
            border: 1px solid #d4af37;
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.5);
        }

        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .dna-display {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #d4af37;
            padding: 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            margin-bottom: 8px;
            color: #90EE90;
        }

        .result-box {
            background: rgba(0, 0, 0, 0.5);
            border-left: 3px solid #90EE90;
            padding: 8px;
            margin-top: 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .result-box.success {
            border-left-color: #90EE90;
            color: #90EE90;
        }

        .result-box.danger {
            border-left-color: #e74c3c;
            color: #e74c3c;
        }

        .result-box.warning {
            border-left-color: #f4a460;
            color: #f4a460;
        }

        .hooks-list {
            font-size: 11px;
            margin-top: 8px;
            max-height: 120px;
            overflow-y: auto;
        }

        .hook-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            margin: 4px 0;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
        }

        .hook-name {
            color: #d4af37;
        }

        .hook-count {
            color: #90EE90;
        }

        .footer {
            padding: 12px;
            font-size: 10px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            color: #999;
        }

        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐉 龍魂DNA追溯助手</h1>
        <p>为原创守护 · 为抄袭开刀</p>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <div>已发现DNA</div>
            <div class="status-value" id="dna-count">0</div>
        </div>
        <div class="status-item">
            <div>钩子识别</div>
            <div class="status-value" id="hook-count">0</div>
        </div>
        <div class="status-item">
            <div>黑名单</div>
            <div class="status-value" id="blacklist-count">0</div>
        </div>
    </div>

    <div class="content">
        <!-- 快速扫描 -->
        <div class="section">
            <div class="section-title">⚡ 快速扫描</div>
            <div class="button-group">
                <button class="btn-primary" id="scan-btn">🔍 扫描页面</button>
                <button class="btn-secondary" id="settings-btn">⚙️ 设置</button>
            </div>
            <div id="scan-result" class="hidden"></div>
        </div>

        <!-- DNA显示 -->
        <div class="section" id="dna-section" class="hidden">
            <div class="section-title">📋 检测到的DNA</div>
            <div id="dna-list"></div>
            <div class="button-group">
                <button class="btn-secondary" id="copy-dna-btn">📋 复制DNA</button>
                <button class="btn-secondary" id="verify-dna-btn">✅ 验证</button>
            </div>
        </div>

        <!-- 钩子分析 -->
        <div class="section" id="hooks-section" class="hidden">
            <div class="section-title">🎣 钩子识别 (18+11类)</div>
            <div class="hooks-list" id="hooks-list"></div>
        </div>

        <!-- 快速操作 -->
        <div class="section">
            <div class="section-title">🚀 快速操作</div>
            <div class="button-group">
                <button class="btn-danger" id="report-btn">🚨 标记侵权</button>
                <button class="btn-primary" id="add-dna-btn">✍️ 添加DNA</button>
            </div>
        </div>

        <!-- 证据管理 -->
        <div class="section">
            <div class="section-title">📦 证据管理</div>
            <div class="button-group">
                <button class="btn-secondary" id="view-evidence-btn">👁️ 查看证据</button>
                <button class="btn-secondary" id="export-btn">📥 导出证据包</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>龍魂系統 · UID9622 · DNA #龍芯⚡️20260525</p>
        <p>为中华文化传承 · 为数字主权守护</p>
    </div>

    <script src="panel.js"></script>
</body>
</html>
