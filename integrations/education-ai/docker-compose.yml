# docker-compose.yml
# 龍魂 · 教育AI全栈部署

version: '3.8'

services:
  # === API服务 ===
  longhun-api:
    build: ./api
    container_name: longhun-api
    ports:
      - "8000:8000"
    environment:
      - DNA=ZHUGEXIN⚡️2025-🇨🇳🐉⚖️♠️🧚🏼‍♀️❤️♾️
      - UID=9622
      - LLM_MODEL=deepseek-chat
      - EMBEDDING_MODEL=BAAI/bge-large-zh
      - VECTOR_DB=milvus
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - milvus
      - postgres
    networks:
      - longhun-net

  # === 向量数据库 ===
  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: longhun-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    networks:
      - longhun-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: longhun-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
    networks:
      - longhun-net

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: longhun-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ACCESS_KEY=longhun9622
      - MINIO_SECRET_KEY=ZHUGEXIN2025
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - longhun-net

  # === 关系数据库 ===
  postgres:
    image: postgres:15
    container_name: longhun-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=longhun
      - POSTGRES_PASSWORD=ZHUGEXIN2025
      - POSTGRES_DB=education
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - longhun-net

  # === 监控 ===
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: longhun-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - longhun-net

networks:
  longhun-net:
    driver: bridge

volumes:
  milvus-data:
  minio-data:
  postgres-data:
  prometheus-data:
