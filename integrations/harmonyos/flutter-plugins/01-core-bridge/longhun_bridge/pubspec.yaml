name: longhun_bridge
description: 🐉 龍魂·鸿蒙核心通信桥接插件 - 提供MethodChannel和EventChannel统一封装，自带DNA追溯、三色审计、主权锚定
version: 2.0.0
homepage: https://github.com/UID9622/longhun-system
repository: https://github.com/UID9622/longhun-system

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      openharmony:
        pluginClass: LonghunBridgePlugin
        fileName: LonghunBridgePlugin.ets
