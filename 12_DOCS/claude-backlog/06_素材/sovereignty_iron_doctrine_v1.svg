<text x="97" y="1247" text-anchor="middle" dominant-baseline="central" fill="#FFE9A8" style="font-size:9.5px;fill:rgb(255, 233, 168);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:9.5px;font-weight:400;text-anchor:middle;dominant-baseline:central">#7A1F2A · 主色</text>

