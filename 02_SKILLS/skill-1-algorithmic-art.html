# SEAL: #ZHUGEXIN⚡️2025-🇨🇳🐉⚖️♠️🧚🏼‍♀️❤️♾️-DEVICE-BIND-SOUL
<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 龍魂算法艺术生成器 v1.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #151a3f 100%);
            color: #ffffff;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 20px;
        }
        
        .header h1 {
            background: linear-gradient(90deg, #00d4ff, #00f5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #a0aec0;
            font-size: 0.9em;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }
        
        .canvas-wrapper {
            background: rgba(21, 26, 63, 0.8);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        #canvas {
            display: block;
            margin: 0 auto;
            border: 1px solid #00d4ff;
            border-radius: 8px;
        }
        
        .controls {
            background: rgba(21, 26, 63, 0.8);
            border: 2px solid #ff006e;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            font-size: 0.85em;
            margin-bottom: 8px;
            color: #00d4ff;
            font-weight: bold;
        }
        
        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(0, 212, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
            box-shadow: 0 0 10px #00d4ff;
        }
        
        .control-group input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
            border: none;
        }
        
        .value-display {
            display: inline-block;
            background: rgba(0, 212, 255, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            color: #00d4ff;
            margin-top: 4px;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 10px 15px;
            border: 2px solid #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        button:hover {
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }
        
        .stats {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #00d4ff;
            font-size: 0.85em;
            color: #a0aec0;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .stat-label {
            color: #00d4ff;
        }
        
        .stat-value {
            color: #00f5ff;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 龍魂算法艺术生成器</h1>
            <p>DNA: #龍芯⚡️丙午·甲午·壬子·丙午·䷙大畜-ALGORITHMIC-ART-v1.0</p>
            <p>Perlin 噪声·Flow Field·粒子系统·实时参数调整</p>
        </div>
        
        <div class="content">
            <div class="canvas-wrapper">
                <div id="p5-container"></div>
            </div>
            
            <div class="controls">
                <h3 style="margin-bottom: 20px; border-bottom: 1px solid #ff006e; padding-bottom: 10px;">
                    ⚙️ 参数控制
                </h3>
                
                <div class="control-group">
                    <label>粒子数量</label>
                    <input type="range" id="particleCount" min="50" max="5000" value="1000" step="50">
                    <div class="value-display"><span id="particleValue">1000</span></div>
                </div>
                
                <div class="control-group">
                    <label>噪声缩放</label>
                    <input type="range" id="noiseScale" min="0.001" max="0.1" value="0.01" step="0.001">
                    <div class="value-display"><span id="noiseValue">0.01</span></div>
                </div>
                
                <div class="control-group">
                    <label>流速</label>
                    <input type="range" id="flowSpeed" min="0.1" max="5" value="1" step="0.1">
                    <div class="value-display"><span id="speedValue">1</span></div>
                </div>
                
                <div class="control-group">
                    <label>粒子大小</label>
                    <input type="range" id="particleSize" min="1" max="50" value="2" step="1">
                    <div class="value-display"><span id="sizeValue">2</span></div>
                </div>
                
                <div class="control-group">
                    <label>透明度</label>
                    <input type="range" id="opacity" min="0" max="100" value="50" step="5">
                    <div class="value-display"><span id="opacityValue">50</span>%</div>
                </div>
                
                <div class="control-group">
                    <label>配色方案</label>
                    <select id="colorScheme" style="width: 100%; padding: 8px; background: rgba(0,212,255,0.1); color: #00d4ff; border: 1px solid #00d4ff; border-radius: 4px; font-family: inherit;">
                        <option value="ocean">🌊 海洋蓝</option>
                        <option value="fire">🔥 火焰红</option>
                        <option value="forest">🌲 森林绿</option>
                        <option value="sunset">🌅 日落橙</option>
                        <option value="cyber">💻 赛博紫</option>
                        <option value="mono">⚫ 黑白</option>
                    </select>
                </div>
                
                <div class="button-group">
                    <button onclick="resetSketch()">🔄 重置</button>
                    <button onclick="downloadImage()">📥 下载</button>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">FPS:</span>
                        <span class="stat-value" id="fps">60</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">帧数:</span>
                        <span class="stat-value" id="frames">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">状态:</span>
                        <span class="stat-value">🟢 运行中</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let particles = [];
        let particleCount = 1000;
        let noiseScale = 0.01;
        let flowSpeed = 1;
        let particleSize = 2;
        let opacity = 50;
        let colorScheme = 'ocean';
        let frameCounter = 0;
        let lastFps = 60;
        let time = 0;
        
        const colorSchemes = {
            ocean: { h: () => random(180, 240), s: () => 100, l: () => random(30, 70) },
            fire: { h: () => random(0, 30), s: () => 100, l: () => random(30, 70) },
            forest: { h: () => random(80, 140), s: () => 100, l: () => random(30, 70) },
            sunset: { h: () => random(10, 50), s: () => 100, l: () => random(30, 70) },
            cyber: { h: () => random(240, 300), s: () => 100, l: () => random(30, 70) },
            mono: { h: () => 0, s: () => 0, l: () => random(20, 80) }
        };
        
        function sketch(p) {
            p.setup = function() {
                let container = document.getElementById('p5-container');
                let w = container.parentElement.offsetWidth - 40;
                let h = Math.min(600, window.innerHeight - 200);
                
                let canvas = p.createCanvas(w, h);
                canvas.parent('p5-container');
                p.colorMode(p.HSL);
                p.background(10, 10, 15);
                initParticles();
            };
            
            p.draw = function() {
                p.background(10, 10, 15, 5);
                
                time += 0.005 * flowSpeed;
                
                for (let particle of particles) {
                    let angle = p.noise(
                        particle.x * noiseScale,
                        particle.y * noiseScale,
                        time
                    ) * p.TWO_PI * 4;
                    
                    particle.vx = p.cos(angle) * 2;
                    particle.vy = p.sin(angle) * 2;
                    
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    
                    if (particle.x < 0) particle.x = p.width;
                    if (particle.x > p.width) particle.x = 0;
                    if (particle.y < 0) particle.y = p.height;
                    if (particle.y > p.height) particle.y = 0;
                    
                    let scheme = colorSchemes[colorScheme];
                    p.stroke(scheme.h(), scheme.s(), scheme.l(), opacity);
                    p.strokeWeight(particleSize);
                    p.point(particle.x, particle.y);
                }
                
                updateStats();
            };
            
            p.windowResized = function() {
                if (window.innerWidth > 0) {
                    let container = document.getElementById('p5-container');
                    if (container && container.parentElement) {
                        let w = container.parentElement.offsetWidth - 40;
                        let h = Math.min(600, window.innerHeight - 200);
                        p.resizeCanvas(w, h);
                    }
                }
            };
        }
        
        function initParticles() {
            particles = [];
            let p = new p5(sketch);
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * p.width,
                    y: Math.random() * p.height,
                    vx: 0,
                    vy: 0
                });
            }
        }
        
        function updateStats() {
            frameCounter++;
            if (frameCounter % 30 === 0) {
                lastFps = Math.round(frameRate());
                document.getElementById('fps').textContent = lastFps;
                document.getElementById('frames').textContent = frameCounter;
            }
        }
        
        function resetSketch() {
            if (window.p5Instance) {
                window.p5Instance.remove();
            }
            window.p5Instance = new p5(sketch);
            frameCounter = 0;
            time = 0;
        }
        
        function downloadImage() {
            if (window.p5Instance) {
                window.p5Instance.saveCanvas('longhun-art', 'png');
            }
        }
        
        // 参数同步
        document.getElementById('particleCount').addEventListener('input', (e) => {
            particleCount = parseInt(e.target.value);
            document.getElementById('particleValue').textContent = particleCount;
            initParticles();
        });
        
        document.getElementById('noiseScale').addEventListener('input', (e) => {
            noiseScale = parseFloat(e.target.value);
            document.getElementById('noiseValue').textContent = noiseScale.toFixed(4);
        });
        
        document.getElementById('flowSpeed').addEventListener('input', (e) => {
            flowSpeed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = flowSpeed;
        });
        
        document.getElementById('particleSize').addEventListener('input', (e) => {
            particleSize = parseFloat(e.target.value);
            document.getElementById('sizeValue').textContent = particleSize;
        });
        
        document.getElementById('opacity').addEventListener('input', (e) => {
            opacity = parseInt(e.target.value);
            document.getElementById('opacityValue').textContent = opacity;
        });
        
        document.getElementById('colorScheme').addEventListener('change', (e) => {
            colorScheme = e.target.value;
        });
        
        window.addEventListener('load', () => {
            window.p5Instance = new p5(sketch);
        });
    </script>
</body>
</html>
