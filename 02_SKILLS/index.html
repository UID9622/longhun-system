    <script type="text/babel">
        const { useState, useEffect } = React;
        
        function AutofillAgent() {
            const [currentGate, setCurrentGate] = useState(1);
            const [entries, setEntries] = useState([]);
            const [selectedEntry, setSelectedEntry] = useState(null);
            const [formData, setFormData] = useState({});
            const [loading, setLoading] = useState(false);
            const [previewMode, setPreviewMode] = useState(false);
            
            // Mock entries - in production these would come from Notion API
            useEffect(() => {
                const mockEntries = [
                    { id: '1', title: 'React Hooks 深度解析', category: '编程与开发', status: '待评估' },
                    { id: '2', title: 'TypeScript 类型系统', category: '编程与开发', status: '待评估' },
                    { id: '3', title: '三色审计架构原理', category: '基础理论', status: '待评估' },
                    { id: '4', title: '龍魂DNA追溯系统', category: '系统架构', status: '待评估' },
                    { id: '5', title: 'CNSH 中文编程语言', category: '编程与开发', status: '待评估' },
                ];
                setEntries(mockEntries);
                if (mockEntries.length > 0) {
                    setSelectedEntry(mockEntries[0].id);
                }
            }, []);
            
            const handleSelectEntry = (id) => {
                setSelectedEntry(id);
                setFormData({});
            };
            
            const handleFormChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };
            
            const gateSteps = [
                { num: 1, name: '扫描(Scan)', desc: '读取知识点入口' },
                { num: 2, name: '解析(Parse)', desc: '提取关键信息' },
                { num: 3, name: '差异(Diff)', desc: '对比预期值' },
                { num: 4, name: '应用(Apply)', desc: '更新到数据库' }
            ];
            
            const auditOptions = ['🟢通过', '🟡待确认', '🔴不可用'];
            const systemOptions = ['✅已接入', '🔧接入中', '❌未接入'];
            const routeOptions = ['P72龍盾', 'P01诸葛亮', 'P03雯雯', 'P04鲁班', 'P05上帝之眼'];
            
            const currentEntryData = entries.find(e => e.id === selectedEntry);
            
            return (
                <div className="container">
                    <div className="header">
                        <h1>批量填表 Agent · Autofill Agent v1.0</h1>
                        <p>龍魂系统 · 自动化知识审核与路由系统 | DNA Traceability: #龍芯⚡️20260430-AGENT-A1F8C9K2</p>
                    </div>
                    
                    <div className="stats">
                        <div className="stat-card">
                            <div className="stat-number">{entries.length}</div>
                            <div className="stat-label">待评估条目</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-number">{Object.keys(formData).length}</div>
                            <div className="stat-label">已填字段</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-number">{currentGate}</div>
                            <div className="stat-label">当前闸门</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-number">5</div>
                            <div className="stat-label">目标字段</div>
                        </div>
                    </div>
                    
                    <div className="gates-container">
                        {gateSteps.map(step => (
                            <div key={step.num} className={`gate ${currentGate >= step.num ? 'active' : ''}`}>
                                <div>
                                    <span className="gate-number">{step.num}</span>
                                    <h3>{step.name}</h3>
                                </div>
                                <p>{step.desc}</p>
                                <div className="dna-trace">#龍芯⚡️GATE-{step.num}</div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="content-area">
                        {/* Left Panel: Entry List */}
                        <div className="panel">
                            <div className="panel-header">
                                📋 知识点条目 ({entries.length})
                            </div>
                            <div className="panel-content">
                                {entries.length === 0 ? (
                                    <div className="empty-state">
                                        <p>正在连接数据库...</p>
                                    </div>
                                ) : (
                                    entries.map(entry => (
                                        <div
                                            key={entry.id}
                                            className={`entry-item ${selectedEntry === entry.id ? 'selected' : ''}`}
                                            onClick={() => handleSelectEntry(entry.id)}
                                        >
                                            <div className="entry-title">{entry.title}</div>
                                            <div className="entry-meta">
                                                分类: {entry.category}
                                                <br/>
                                                状态: {entry.status}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                        
                        {/* Right Panel: Evaluation Form or Preview */}
                        <div className="panel">
                            {previewMode ? (
                                <>
                                    <div className="panel-header">
                                        ✓ 变更预览 (应用前确认)
                                    </div>
                                    <div className="panel-content">
                                        {currentEntryData && (
                                            <>
                                                <div className="preview-item">
                                                    <div className="preview-label">知识点</div>
                                                    <div className="preview-value">{currentEntryData.title}</div>
                                                </div>
                                                
                                                {formData.audit && (
                                                    <div className="preview-item">
                                                        <div className="preview-label">三色审计（知识点）</div>
                                                        <div className="preview-value"><span className="status-badge status-yellow">{formData.audit}</span></div>
                                                    </div>
                                                )}
                                                
                                                {formData.system && (
                                                    <div className="preview-item">
                                                        <div className="preview-label">是否进入系统</div>
                                                        <div className="preview-value"><span className="status-badge status-green">{formData.system}</span></div>
                                                    </div>
                                                )}
                                                
                                                {formData.route && (
                                                    <div className="preview-item">
                                                        <div className="preview-label">人格路由</div>
                                                        <div className="preview-value">{formData.route}</div>
                                                    </div>
                                                )}
                                                
                                                {formData.direction && (
                                                    <div className="preview-item">
                                                        <div className="preview-label">去向建议</div>
                                                        <div className="preview-value">{formData.direction}</div>
                                                    </div>
                                                )}
                                                
                                                {formData.formula && (
                                                    <div className="preview-item">
                                                        <div className="preview-label">核心公式</div>
                                                        <div className="preview-value">{formData.formula}</div>
                                                    </div>
                                                )}
                                                
                                                {formData.pitfall && (
                                                    <div className="preview-item">
                                                        <div className="preview-label">常见误区</div>
                                                        <div className="preview-value">{formData.pitfall}</div>
                                                    </div>
                                                )}
                                                
                                                <div className="button-group">
                                                    <button className="btn-secondary" onClick={() => setPreviewMode(false)}>
                                                        ← 返回编辑
                                                    </button>
                                                    <button className="btn-primary" onClick={() => {
                                                        setCurrentGate(4);
                                                        setLoading(true);
                                                        setTimeout(() => {
                                                            alert('✓ 已应用到数据库！\n条目已更新。');
                                                            setLoading(false);
                                                            setPreviewMode(false);
                                                            setFormData({});
                                                        }, 1000);
                                                    }}>
                                                        ✓ 确认应用 (Gate 4)
                                                    </button>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div className="panel-header">
                                        📝 批量填表评估 (Gate {Math.min(currentGate, 3)})
                                    </div>
                                    <div className="panel-content">
                                        {!selectedEntry ? (
                                            <div className="empty-state">
                                                <p>请选择一个知识点开始评估</p>
                                            </div>
                                        ) : (
                                            <>
                                                <div className="form-group">
                                                    <label>📌 当前知识点</label>
                                                    <input type="text" value={currentEntryData?.title || ''} disabled style={{ background: '#f8f9fc' }} />
                                                </div>
                                                
                                                <div className="form-group">
                                                    <label>🟡 三色审计（知识点）</label>
                                                    <select value={formData.audit || ''} onChange={(e) => handleFormChange('audit', e.target.value)}>
                                                        <option value="">-- 选择 --</option>
                                                        {auditOptions.map(opt => (
                                                            <option key={opt} value={opt}>{opt}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                                
                                                <div className="form-group">
                                                    <label>✅ 是否进入系统</label>
                                                    <select value={formData.system || ''} onChange={(e) => handleFormChange('system', e.target.value)}>
                                                        <option value="">-- 选择 --</option>
                                                        {systemOptions.map(opt => (
                                                            <option key={opt} value={opt}>{opt}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                                
                                                <div className="form-group">
                                                    <label>🎭 人格路由</label>
                                                    <select value={formData.route || ''} onChange={(e) => handleFormChange('route', e.target.value)}>
                                                        <option value="">-- 选择 --</option>
                                                        {routeOptions.map(opt => (
                                                            <option key={opt} value={opt}>{opt}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                                
                                                <div className="form-group">
                                                    <label>🎯 去向建议</label>
                                                    <textarea value={formData.direction || ''} onChange={(e) => handleFormChange('direction', e.target.value)} placeholder="例如：推荐进入基础理论 → 进阶系统架构" />
                                                </div>
                                                
                                                <div className="form-group">
                                                    <label>🧬 核心公式</label>
                                                    <input type="text" value={formData.formula || ''} onChange={(e) => handleFormChange('formula', e.target.value)} placeholder="例如：DNA = 知识点 + 追溯码 + 应用场景" />
                                                </div>
                                                
                                                <div className="form-group">
                                                    <label>⚠️ 常见误区</label>
                                                    <textarea value={formData.pitfall || ''} onChange={(e) => handleFormChange('pitfall', e.target.value)} placeholder="例如：混淆三色审计的判断标准" />
                                                </div>
                                                
                                                <div className="button-group">
                                                    <button className="btn-secondary" onClick={() => {
                                                        setSelectedEntry(null);
                                                        setFormData({});
                                                    }}>
                                                        清除表单
                                                    </button>
                                                    <button className="btn-primary" onClick={() => {
                                                        if (Object.keys(formData).length < 3) {
                                                            alert('请至少填写 3 个字段');
                                                            return;
                                                        }
                                                        setCurrentGate(3);
                                                        setPreviewMode(true);
                                                    }}>
                                                        预览变更 → (Gate 3)
                                                    </button>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<AutofillAgent />, document.getElementById('root'));
    </script>
