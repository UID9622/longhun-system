[pytest]
# 龍魂系统 · Pytest 配置
# DNA: #龍芯⚡️2026-07-07-PYTEST-CONFIG-v1.0
# 人格: P02张衡(参数) + P03墨子(验证阈值) + P04鲁班(工程配置)

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 强制输出详细报告
addopts =
    -v
    --tb=long
    --strict-markers
    --durations=10
    -p no:warnings

# 自定义标记
markers =
    core: 核心模块测试 (P0优先级)
    safety: 安全模块测试 (P77/P72)
    integration: 集成测试 (P15)
    slow: 慢速测试（外部依赖，CI可跳过）
    jspace: J-space 意识空间测试

# 覆盖率配置
[coverage:run]
source = bin,L1_内核层,L6_集成层,audit
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
