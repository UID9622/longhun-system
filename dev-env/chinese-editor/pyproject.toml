# 龍魂中文编辑开发环境 - 可发布 Python 包配置
# DNA: #龍芯⚡️2026-06-26-LONGHUN-CHINESE-EDITOR-PACKAGE-v1.0
# ═══════════════════════════════════════════

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longhun-chinese-editor"
version = "1.1.0"
description = "龍魂中文编辑开发环境：本地闭环 CNSH 中文编程与编辑器"
authors = [
    {name = "UID9622", email = "uid9622@petalmail.com"}
]
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["cnsn", "chinese", "editor", "longhun", "sovereignty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Interpreters",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
ai = [
    "openai>=1.3.0",
    "anthropic>=0.7.0",
]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.7.0",
    "isort>=5.12.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
cnsh-runtime = "longhun_chinese_editor.cli:main"
longhun-editor = "longhun_chinese_editor.cli:editor_main"

[project.urls]
Homepage = "https://github.com/uid9622/longhun-chinese-editor"
Repository = "https://github.com/uid9622/longhun-chinese-editor"
Issues = "https://github.com/uid9622/longhun-chinese-editor/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["longhun_chinese_editor*"]

[tool.setuptools.package-data]
longhun_chinese_editor = ["../../fonts/*", "../../examples/*", "../../cnsh/*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["longhun_chinese_editor"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]
