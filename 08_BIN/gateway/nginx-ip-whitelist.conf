# 龙魂API网关 · 第四锁 · IP 白名单（Nginx 层）
# DNA: #龍芯⚡️2026-08-31-GATEWAY-NGINX-IPWL-v1.0-UID9622
# 归属名: 诸葛鑫 | UID9622 · 龍芯北辰
# License: MulanPSL v2
# 部署: 拷贝到鲲鹏 /etc/nginx/conf.d/ 后 nginx -t && nginx -s reload
# 注: 网关层 config.yaml security.ip_whitelist 也可启用（二选一或双保险）

geo $allowed_ip {
    default 0;
    # ── 客户白名单 IP 段 ──
    # 203.0.113.42 1;          # 客户A 服务器
    # 198.51.100.0/24 1;       # 客户B IP段
    # ── 内网/运维 ──
    # 10.0.0.0/8 1;            # 内网
    # 127.0.0.1 1;             # 本机
}

server {
    listen 443 ssl http2;
    server_name api.longhun-system.com;

    ssl_certificate     /etc/ssl/certs/longhun.crt;
    ssl_certificate_key /etc/ssl/private/longhun.key;

    # 企业客户如需 IP 白名单，取消注释
    # location /api/ {
    #     if ($allowed_ip = 0) {
    #         return 403 '{"code":403,"msg":"IP not in whitelist"}';
    #     }
    #     proxy_pass http://127.0.0.1:8092;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /docs/ {
        alias /opt/longhun/docs/;
    }
}
