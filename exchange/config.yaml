  host: "127.0.0.1"
  port: 8899
  debug: false
  # 🔴 鉴权密钥：从环境变量 ECNY_SECRET_KEY 注入（禁明文入库·P77）·留空则拒绝启动
  secret_key: ""

# 汇率源（按优先级降级）
rate_sources:
  primary: "frankfurter"      # 免费·无需API Key·欧央行数据
  secondary: "exchangerate"   # 免费备用
  tertiary: "pboc"            # 央行中间价（需要解析）
  cache_ttl_seconds: 300      # 汇率缓存5分钟

# 数字人民币结算通道
ecny:
  mode: "sandbox"             # sandbox（本地模拟）| live（真实API）
  sandbox_confirm_delay: 0.1  # 沙盒秒数
  live_api_base: "https://api.ecny.shubida.com/v1"
  api_key: ""                 # 🔴 从环境变量 ECNY_API_KEY 注入（禁明文入库·P77）·有值自动升 live
  merchant_id: "UID9622"
  notify_url: ""              # 🔴 live 模式必填·从环境变量 ECNY_NOTIFY_URL 注入·禁硬编码假域名（P77）

# 计费标准
billing:
  developer_monthly_ecny: 1.0    # 普通开发者 1 eCNY/月
  audit_per_call_ecny: 0.01      # 审计调用 0.01 eCNY/次
  enterprise_per_10k_ecny: 50.0  # 企业版 50 eCNY/万次

# 支持的货币（ISO 4217 + 加密货币）
