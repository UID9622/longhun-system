# 龍魂统一门户 · Nginx 入口
# DNA: #龍芯⚡️2026-07-04-LONGHUN888-NGINX-v1.0
server {
    listen 80;
    server_name longhun888.com;
    root /var/www/portal;
    index index.html;

    # 静态门户
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CNSH Editor API 代理
    location /api/v1/ {
        proxy_pass http://cnsh-editor-api:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI 规范
    location /openapi.json {
        proxy_pass http://cnsh-editor-api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Swagger UI
    location /docs {
        proxy_pass http://cnsh-editor-api:8000/docs;
        proxy_set_header Host $host;
    }

    # CNSH 在线编辑器
    location /editor/ {
        proxy_pass http://cnsh-editor-api:8000/editor/;
        proxy_set_header Host $host;
    }

    # 静态资源
    location /static/ {
        proxy_pass http://cnsh-editor-api:8000/static/;
        proxy_set_header Host $host;
    }

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
