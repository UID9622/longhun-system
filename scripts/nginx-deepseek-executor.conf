# 龍魂 DeepSeek 唯一监管加密执行者 Nginx 配置片段
# 引入到 /etc/nginx/sites-enabled/longhun888.com 的 server {} 块内
# DNA: #龍芯⚡️20260628-DEEPSEEK-EXECUTOR-NGINX-v1.0

# 外部唯一入口：DeepSeek 执行器
location ^~ /executor/ {
    proxy_pass http://127.0.0.1:9453/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 1m;
}

# 以下路径仅供本地/执行器访问，外部直接访问应被拒绝。
# 由于后端已绑定 127.0.0.1，Nginx 层再加一层 allow/deny 兜底。
location ^~ /api/ {
    allow 127.0.0.1;
    allow ::1;
    # 如需允许特定办公室/堡垒机 IP，取消下一行注释并替换 IP
    # allow 203.0.113.10;
    deny all;

    proxy_pass http://127.0.0.1:8443;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

