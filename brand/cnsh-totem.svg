<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- 龍魂金渐变 -->
    <linearGradient id="lh-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D48B;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#C9A84C;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#A07D2C;stop-opacity:1"/>
    </linearGradient>
    <!-- 边框金 -->
    <linearGradient id="border-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#E8D48B;stop-opacity:0.4"/>
    </linearGradient>
    <!-- 底色深黑 -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#1a1410;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0806;stop-opacity:1"/>
    </radialGradient>
    <!-- 八卦符号滤镜 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="500" height="500" rx="12" fill="url(#bg-glow)"/>
  
  <!-- 外框电路纹（技术规矩） -->
  <rect x="15" y="15" width="470" height="470" rx="10" fill="none" stroke="url(#border-gold)" stroke-width="2"/>
  <rect x="22" y="22" width="456" height="456" rx="8" fill="none" stroke="#C9A84C" stroke-width="0.5" stroke-dasharray="6,4" opacity="0.4"/>
  
  <!-- 四角节点 -->
  <circle cx="15" cy="15" r="4" fill="#E8D48B" opacity="0.9"/>
  <circle cx="485" cy="15" r="4" fill="#E8D48B" opacity="0.9"/>
  <circle cx="15" cy="485" r="4" fill="#E8D48B" opacity="0.9"/>
  <circle cx="485" cy="485" r="4" fill="#E8D48B" opacity="0.9"/>

  <!-- 四象守角 -->
  <text x="40" y="48" font-size="18" fill="#C9A84C" opacity="0.7">朱雀</text>
  <text x="440" y="48" font-size="18" fill="#C9A84C" opacity="0.7">玄武</text>
  <text x="40" y="482" font-size="18" fill="#C9A84C" opacity="0.7">青龙</text>
  <text x="440" y="482" font-size="18" fill="#C9A84C" opacity="0.7">白虎</text>

  <!-- 八卦外环 -->
  <g filter="url(#glow)" opacity="0.6">
    <text x="250" y="80" text-anchor="middle" font-size="20" fill="#C9A84C">☰</text>
    <text x="440" y="170" text-anchor="middle" font-size="20" fill="#C9A84C">☷</text>
    <text x="440" y="340" text-anchor="middle" font-size="20" fill="#C9A84C">☳</text>
    <text x="250" y="440" text-anchor="middle" font-size="20" fill="#C9A84C">☴</text>
    <text x="60" y="340" text-anchor="middle" font-size="20" fill="#C9A84C">☵</text>
    <text x="60" y="170" text-anchor="middle" font-size="20" fill="#C9A84C">☲</text>
    <text x="170" y="80" text-anchor="middle" font-size="20" fill="#C9A84C">☶</text>
    <text x="340" y="80" text-anchor="middle" font-size="20" fill="#C9A84C">☱</text>
  </g>

  <!-- DNA 双螺旋（缠绕中心） -->
  <g opacity="0.3">
    <path d="M180,130 Q250,180 180,250 Q250,320 180,370" fill="none" stroke="#E8D48B" stroke-width="1.5"/>
    <path d="M320,130 Q250,180 320,250 Q250,320 320,370" fill="none" stroke="#E8D48B" stroke-width="1.5"/>
    <line x1="180" y1="160" x2="320" y2="160" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
    <line x1="180" y1="220" x2="320" y2="220" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
    <line x1="180" y1="280" x2="320" y2="280" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
    <line x1="180" y1="340" x2="320" y2="340" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- 中心「龍」字 -->
  <text x="250" y="280" text-anchor="middle" font-size="120" font-weight="bold" fill="url(#lh-gold)" font-family="serif" filter="url(#glow)">龍</text>

  <!-- 369三数（洛书） -->
  <text x="250" y="190" text-anchor="middle" font-size="28" fill="#E8D48B" opacity="0.8" font-family="monospace">3</text>
  <text x="210" y="330" text-anchor="middle" font-size="28" fill="#E8D48B" opacity="0.8" font-family="monospace">6</text>
  <text x="290" y="330" text-anchor="middle" font-size="28" fill="#E8D48B" opacity="0.8" font-family="monospace">9</text>

  <!-- 24节气刻度点（外环） -->
  <g opacity="0.4">
    <circle cx="250" cy="48" r="2" fill="#C9A84C"/><circle cx="327" cy="50" r="2" fill="#C9A84C"/>
    <circle cx="397" cy="70" r="2" fill="#C9A84C"/><circle cx="447" cy="120" r="2" fill="#C9A84C"/>
    <circle cx="470" cy="190" r="2" fill="#C9A84C"/><circle cx="475" cy="265" r="2" fill="#C9A84C"/>
    <circle cx="455" cy="340" r="2" fill="#C9A84C"/><circle cx="410" cy="405" r="2" fill="#C9A84C"/>
    <circle cx="345" cy="445" r="2" fill="#C9A84C"/><circle cx="270" cy="462" r="2" fill="#C9A84C"/>
    <circle cx="190" cy="450" r="2" fill="#C9A84C"/><circle cx="120" cy="410" r="2" fill="#C9A84C"/>
    <circle cx="70" cy="345" r="2" fill="#C9A84C"/><circle cx="48" cy="265" r="2" fill="#C9A84C"/>
    <circle cx="55" cy="190" r="2" fill="#C9A84C"/><circle cx="90" cy="120" r="2" fill="#C9A84C"/>
    <circle cx="145" cy="68" r="2" fill="#C9A84C"/><circle cx="210" cy="48" r="2" fill="#C9A84C"/>
    <circle cx="365" cy="446" r="2" fill="#C9A84C"/><circle cx="448" cy="250" r="2" fill="#C9A84C"/>
    <circle cx="448" cy="170" r="2" fill="#C9A84C"/><circle cx="375" cy="55" r="2" fill="#C9A84C"/>
    <circle cx="145" cy="445" r="2" fill="#C9A84C"/><circle cx="52" cy="250" r="2" fill="#C9A84C"/>
  </g>

  <!-- 篆书核心理念（左右边框内部） -->
  <text x="75" y="200" font-size="14" fill="#C9A84C" opacity="0.5" writing-mode="vertical-rl">不可易</text>
  <text x="75" y="310" font-size="14" fill="#C9A84C" opacity="0.5" writing-mode="vertical-rl">行为纹</text>
  <text x="75" y="420" font-size="14" fill="#C9A84C" opacity="0.5" writing-mode="vertical-rl">足迹链</text>
  <text x="410" y="200" font-size="14" fill="#C9A84C" opacity="0.5" writing-mode="vertical-rl">通心译</text>
  <text x="410" y="310" font-size="14" fill="#C9A84C" opacity="0.5" writing-mode="vertical-rl">五色审计</text>
  <text x="410" y="420" font-size="14" fill="#C9A84C" opacity="0.5" writing-mode="vertical-rl">颜色不动点</text>

  <!-- 底部技术信息 -->
  <text x="250" y="462" text-anchor="middle" font-size="11" fill="#8B7D5E" font-family="monospace">CNSH v1.1.0 · 龍魂系统</text>
  <text x="250" y="480" text-anchor="middle" font-size="9" fill="#6B5D3E" font-family="monospace">UID9622 · 诸葛鑫 · CC-BY-NC-SA-4.0</text>
</svg>
