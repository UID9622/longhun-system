<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>龍魂系统状态看板 · LongHun Status</title>
<style>
  :root { --bg:#0b0f19; --panel:#111827; --text:#e5e7eb; --muted:#9ca3af; }
  body { background:var(--bg); color:var(--text); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; padding:2rem; }
  h1 { margin:0 0 1rem; font-size:1.8rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1rem; }
  .card { background:var(--panel); border-radius:12px; padding:1.2rem; border:1px solid #1f2937; }
  .card h2 { margin:0 0 .8rem; font-size:1.1rem; color:#93c5fd; }
  .level { font-size:2.5rem; font-weight:bold; }
  .ok { color:#22c55e; }
  .warn { color:#eab308; }
  .critical { color:#ef4444; }
  .maint { color:#6b7280; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th,td { text-align:left; padding:.5rem; border-bottom:1px solid #1f2937; }
  th { color:var(--muted); }
  .metric { display:flex; justify-content:space-between; padding:.4rem 0; border-bottom:1px solid #1f2937; }
  .footer { margin-top:2rem; color:var(--muted); font-size:.85rem; }
  pre { background:#000; padding:.6rem; border-radius:6px; overflow:auto; font-size:.8rem; }
</style>
</head>
<body>
<h1>🐉 龍魂系统状态看板</h1>
<p>DNA: #龍芯⚡️2026-06-24-LONGHUN-STATUS-DASHBOARD-v1.0</p>

<div class="grid">
  <div class="card">
    <h2>当前运行等级</h2>
    <div id="level" class="level">Loading...</div>
    <p id="level-desc"></p>
    <p id="reasons"></p>
  </div>

  <div class="card">
    <h2>系统指标</h2>
    <div id="metrics"></div>
  </div>

  <div class="card">
    <h2>请求策略</h2>
    <div id="policy"></div>
  </div>

  <div class="card" style="grid-column:1/-1;">
    <h2>最近审计记录</h2>
    <table id="audit">
      <thead><tr><th>时间</th><th>操作</th><th>状态</th><th>证据</th><th>统计</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="footer">
  龍魂系统 · UID9622 · 中国自主可控 · <span id="ts"></span>
</div>

<script>
// 静态占位数据；实际运行时由后端或定时脚本生成
const statusData = {
  level: "Operational",
  emoji: "🟢",
  description: "运行正常",
  score: 0,
  reasons: [],
  retry_after_seconds: 5,
  request_id: "demo-001",
  metrics: { cpu_percent: 0, memory_percent: 0, system_load: 0, disk_percent: 0 },
  allowed: true,
  degraded: false,
  error: null
};

const auditRecords = [
  { ts: "2026-06-24T23:45:00Z", op: "model_upgrade", status: "success", evidence: { model_id: "longhun-v6" }, stats: { duration_ms: 1234 } },
  { ts: "2026-06-24T23:40:00Z", op: "audit", status: "success", evidence: { artifact_path: "daily_review.py" }, stats: { hit_count: 5 } }
];

function render() {
  const el = document.getElementById("level");
  el.textContent = statusData.emoji + " " + statusData.level;
  el.className = "level " + (statusData.score >= 3 ? "critical" : statusData.score >= 1 ? "warn" : statusData.level === "Maintenance" ? "maint" : "ok");
  document.getElementById("level-desc").textContent = statusData.description;
  document.getElementById("reasons").textContent = statusData.reasons.join("; ") || "无告警";

  const m = statusData.metrics;
  document.getElementById("metrics").innerHTML = `
    <div class="metric"><span>CPU</span><span>${m.cpu_percent.toFixed(1)}%</span></div>
    <div class="metric"><span>内存</span><span>${m.memory_percent.toFixed(1)}%</span></div>
    <div class="metric"><span>系统负载</span><span>${m.system_load.toFixed(2)}</span></div>
    <div class="metric"><span>磁盘</span><span>${m.disk_percent.toFixed(1)}%</span></div>
  `;

  document.getElementById("policy").innerHTML = statusData.error
    ? `<pre>${JSON.stringify(statusData.error,null,2)}</pre>`
    : `<p>请求允许：${statusData.allowed ? "是" : "否"}</p><p>降级模式：${statusData.degraded ? "是" : "否"}</p>`;

  const tbody = document.querySelector("#audit tbody");
  tbody.innerHTML = auditRecords.map(r => `
    <tr>
      <td>${r.ts}</td>
      <td>${r.op}</td>
      <td>${r.status}</td>
      <td><pre>${JSON.stringify(r.evidence)}</pre></td>
      <td><pre>${JSON.stringify(r.stats)}</pre></td>
    </tr>
  `).join("");

  document.getElementById("ts").textContent = new Date().toLocaleString();
}
render();
</script>
</body>
</html>
