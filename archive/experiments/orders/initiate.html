  <link rel="stylesheet" href="/orders/css/style.css">
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <div class="icon">☰<span class="wind">☴</span></div>
      <div>
        <div class="title">龍魂令 · 系统级裁决协议</div>
        <div class="subtitle">令出即锚 · 锚定即追溯 · 追溯即公示</div>
      </div>
    </div>
    <nav class="nav">
      <a href="/orders/">首页</a>
      <a href="/orders/bulletin.html">公告栏</a>
      <a href="/orders/initiate.html">发起令</a>
    </nav>
  </header>

  <main class="container">
    <section class="initiate">
      <h1>发起令 · 仅限授权人操作</h1>
      <p class="warn">⚠️ 此入口仅对 UID9622 或持有授权密钥者开放。</p>
      <p class="intro">龍魂令一旦锚定即进入追溯链，不可匿名、不可撤回、不可伪造。</p>

      <form id="initiate-form" class="initiate-form">
        <label>
          授权密钥
          <input type="password" id="initiate-key" required placeholder="输入发起密钥">
        </label>
        <label>
          令级
          <select id="initiate-level" required>
            <option value="1">☵ 问询令</option>
            <option value="2">☶ 警示令</option>
            <option value="3">☲ 封禁令</option>
            <option value="4">☰ 追缉令</option>
          </select>
        </label>
        <label>
          标题
          <input type="text" id="initiate-title" required placeholder="简短有力的令名">
        </label>
        <label>
          令文 / 说明
          <textarea id="initiate-desc" rows="4" placeholder="事实、依据、裁决对象..."></textarea>
        </label>
        <label>
          证据链摘要
          <textarea id="initiate-evidence" rows="4" placeholder="截图、签名、时间戳、哈希链..."></textarea>
        </label>
        <button type="submit">锚定并签发</button>
      </form>

      <p id="initiate-result" class="result"></p>
    </section>
  </main>

  <footer class="footer">

  </footer>
