# ═══════════════════════════════════════════════════════════════════
# 龍魂体系 | 统一 pyproject.toml
# DNA: #龍芯⚡️2026-07-05-LONGHUN-ROOT-v1.0
# 创建者: UID9622（诸葛鑫·Lucky）
# 三色审计: 🟢 通过
# ═══════════════════════════════════════════════════════════════════
# 
# 【这是什么？】
# pyproject.toml 是整个 Python 项目的"身份证"和"配置中心"。
# 以前各子系统各自为政，依赖版本乱成一团。
# 现在统一在这里，所有子系统共享基线依赖。
#
# 【怎么用？】
#   pip install -e .                # 安装龍魂系统（开发模式）
#   pip install -e ".[dev]"         # 安装 + 开发工具
#   pip install -e ".[all]"         # 安装全部可选依赖

[project]
name = "longhun-system"
version = "5.0.0"
description = "龍魂系统 — 中国自主可控 AI 行为治理框架与数字主权基础设施"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "龙魂系统专属许可 — 遵守中华人民共和国法律" }
authors = [
    { name = "UID9622 · 诸葛鑫 · Lucky", email = "uid9622@longhun.dev" },
]
keywords = [
    "AI governance",
    "digital sovereignty",
    "Chinese programming language",
    "CNSH",
    "audit",
    "traceability",
    "three-color audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ══════════════════════════════════════════════════════════════════
# 基线依赖（所有子系统都需要的最小依赖集）
# ══════════════════════════════════════════════════════════════════
dependencies = [
    # 核心运行时
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",

    # 加密与安全
    "cryptography>=42.0.0",
    "pycryptodome>=3.20.0",

    # 数据与序列化
    "pyyaml>=6.0",
    "orjson>=3.9.0",

    # 网络与 API
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",

    # 日期与调度
    "python-dateutil>=2.8.0",

    # MCP 协议支持
    "mcp>=1.0.0",
]

# ══════════════════════════════════════════════════════════════════
# 可选依赖组（按子系统分组，按需安装）
# ══════════════════════════════════════════════════════════════════
[project.optional-dependencies]
# 开发工具
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

# CNSH 编译器
cnsh = [
    "lark>=1.1.0",
    "networkx>=3.2.0",
]

# 数据库
db = [
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
]

# 向量库 / AI
ai = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.3.0",
]

# 移动端监控
mobile = [
    "aes-256-gcm",
]

# Web 前端
web = [
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
]

# MCP 工具
mcp-tools = [
    "mcp>=1.0.0",
]

# 全量安装
all = [
    "longhun-system[dev,cnsh,db,ai,mobile,web,mcp-tools]",
]

# ══════════════════════════════════════════════════════════════════
# 脚本入口（命令行工具）
# ══════════════════════════════════════════════════════════════════
[project.scripts]
# 核心命令
lh = "bin.lh:main"
lh-status = "bin.longhun_status:main"
lh-launch = "bin.longhun_launcher:main"

# MCP 服务
cnsh-mcp = "integrations.mcp.cnsh_syntax_mcp_server:main"

# 工具
cnsh-runner = "cnsh.cnsh_runner:main"
cnsh-redlines = "cnsh.cnsh_redlines:main"

# ══════════════════════════════════════════════════════════════════
# 构建系统
# ══════════════════════════════════════════════════════════════════
[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

# ══════════════════════════════════════════════════════════════════
# 工具配置
# ══════════════════════════════════════════════════════════════════

[tool.setuptools]
# 显式列出包目录，避免 include 未预期的文件
packages = [
    "cnsh-core",
    "cnsh-core.cnsh-v2.1",
    "cnsh-core.cnsh-v2.1.cnsh_v21",
    "cnsh",
    "integrations.mcp",
    "audit",
    "systems",
    "governance",
    "engines",
    "executors",
]

[tool.setuptools.package-dir]
"integrations.mcp" = "integrations/mcp"

# ══════════════════════════════════════════════════════════════════
# Ruff 代码风格（CNSH 兼容配置）
# ══════════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
]
ignore = [
    "E501",  # 行长忽略（中文注释长）
    "E402",  # 模块级 import 不强制置顶（CNSH 需要路径初始化）
]

[tool.ruff.lint.isort]
known-first-party = [
    "cnsh_v21",
    "cnsh_unified",
    "cnsh_redlines",
    "cnsh_runner",
]

# ══════════════════════════════════════════════════════════════════
# Pytest
# ══════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "bin",
    "audit",
    "cnsh-core",
    "cnsh-core/engines",
    "cnsh-core/cnsh-v2.1",
    "cnsh-core/cnsh-v2.1/cnsh_v21",
    "cnsh",
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]

# Coverage 配置
[tool.coverage.run]
source = ["."]
omit = [
    "*/_archive/*",
    "*/backups/*",
    "*/venv/*",
    "*/.venv/*",
    "*/node_modules/*",
    "*/__pycache__/*",
    "*/brain/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_empty = true

# ══════════════════════════════════════════════════════════════════
# MyPy（类型检查，宽松模式兼容动态代码）
# ══════════════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false

# ══════════════════════════════════════════════════════════════════
# Basedpyright（类型检查 · CNSH 兼容配置）
# 策略：保留 ERROR 级严查，压制大规模不可修复的 WARNING
# CNSH 中文编程必然大量使用 dict 动态访问 → 压制 reportUnknown*
# 481+ 文件使用旧 typing → 压制 reportDeprecated（渐进迁移）
# ══════════════════════════════════════════════════════════════════
[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.10"

# ── ERROR 级保留（代码质量问题，必须修） ──
reportMissingTypeArgument = true        # 裸 Dict/List → 加类型参数
reportMissingImports = true             # 缺依赖导入
reportArgumentType = true               # 类型不匹配传参
reportReturnType = true                 # 返回类型不匹配
reportPossiblyUnboundVariable = true    # 可能未绑定变量
reportConstantRedefinition = true       # 常量重定义

# ── WARNING 级压制（CNSH 动态编程特点，大面积存在） ──
reportUnknownMemberType = false         # dict/JSON 动态字段访问
reportUnknownVariableType = false       # 动态变量类型推断
reportUnknownArgumentType = false       # 动态参数类型推断
reportUnknownParameterType = false      # 动态参数类型
reportUnknownLambdaType = false         # lambda 类型推断

# ── WARNING 级压制（项目历史负担 · 481+ 文件待渐进迁移） ──
reportDeprecated = false                # 旧 typing（Dict/List/Optional）
reportExplicitAny = false               # Any 类型（中文编程必须）
reportAny = false                       # Any 派生类型

# ── WARNING 级压制（CNSH 设计特点） ──
reportUnannotatedClassAttribute = false # 类属性缺注解（dataclass 模式外）
reportUnusedImport = false              # 批量修复未完成前先关
reportUnusedParameter = false           # 未用参数（大量 handler 签名）
reportImplicitRelativeImport = false    # 相对导入（CNSH 模块结构）
