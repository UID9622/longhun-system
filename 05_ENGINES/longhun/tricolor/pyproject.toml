[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longhun-tricolor"
version = "1.1.0"
authors = [
    {name = "诸葛鑫 (UID9622)", email = "uid9622@longhun-system"},
]
description = "龍魂·三色审计 SDK — 中文原生AI合规治理操作层标准"
requires-python = ">=3.8"
license = {text = "MulanPSL-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MulanPSL v2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]

[project.urls]
Source = "https://github.com/UID9622/longhun-system"

# 包在目录根下（非子目录），映射到 longhun_tricolor
[tool.setuptools.package-dir]
"longhun_tricolor" = "."
