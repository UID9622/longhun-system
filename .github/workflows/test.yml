name: 🐉 龍魂测试套件

# DNA: #龍芯⚡️丙午·丙酉·丙寅·申时-CI-TEST-UID9622
# 创建者: 诸葛鑫（UID9622）
# License: MulanPSL v2 (https://license.coscl.org.cn/MulanPSL2)
# 确认码: #CONFIRM🌌9622-ONLY-ONCE🧬LK9X-772Z
# GPG: A2D0092CEE2E5BA87035600924C3704A8CC26D5F
# 说明: 测试套件 v1.1 CI/CD 集成 · 端口类冒烟测试在 CI 无服务环境自动 skip

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          pip install pytest pytest-cov flake8 bandit
      - name: 代码审计测试
        run: |
          pytest tests/test_code_audit.py -m audit -v
      - name: 覆盖率门禁检查
        run: |
          pytest tests/ -m "functional and not api" --cov=08_BIN --cov-report=json || true
          python3 tests/coverage_check.py coverage.json 30

  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: 功能评估测试
        run: |
          pytest tests/test_functional.py -m functional -v

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: 冒烟测试
        run: |
          pytest tests/test_smoke.py -m smoke -v

  auto_iteration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: 自动迭代测试
        run: |
          pytest tests/test_auto_iteration.py -m auto_iteration -v

  report:
    runs-on: ubuntu-latest
    needs: [audit, functional, smoke, auto_iteration]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install pytest
      - name: 生成测试报告
        run: |
          pytest tests/ -v || true
          python3 tests/generate_report.py || true
      - name: 上传测试报告
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: test_reports/
