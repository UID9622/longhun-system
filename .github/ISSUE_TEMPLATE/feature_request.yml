# DNA: #龍芯⚡️丙午·乙未·戊子·戊午·䷙大畜-ISSUE-FEATURE-REQUEST-v1.0
name: ✨ 功能请求
description: 建议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你想要的功能，以及它解决什么问题。

  - type: textarea
    id: problem
    attributes:
      label: 你的功能请求是否与某个问题相关？
      description: 清晰描述问题是什么
      placeholder: "每次做 X 的时候，都需要手动 Y，很麻烦..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 描述你希望看到的功能
      placeholder: "希望可以自动完成 Y..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 其他可能的解决方案或变通办法

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 这个功能主要影响哪个模块
      options:
        - CNSH 语言/编译器
        - 红线熔断引擎
        - 三色审计
        - 人格内阁
        - MCP Server
        - 部署/运维
        - 文档
        - 其他
    validations:
      required: true
