# ═══════════════════════════════════════════════════
# 龍魂系统 · 完整容器编排
# DNA: #龍芯⚡️丙午·丙申·丙辰·巳时·需-DOCKER-COMPOSE-v2.0
# ═══════════════════════════════════════════════════
#
# 服务架构:
#   nginx (80/443) → web (:8777)  +  api (:9622)
#   web 提供前端门户页面
#   api 提供后端 REST + WebSocket
#
# 启动:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
#
# 仅本地开发:
#   docker compose --profile dev up -d
# ═══════════════════════════════════════════════════

services:
  # ─── 龍魂 API 后端 ───
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: longhun-api
    image: longhun/api:v2.0
    restart: unless-stopped
    ports:
      - "${LONGHUN_API_PORT:-9622}:9622"
    volumes:
      # 持久化数据
      - longhun_data:/app/L7_数据层
      - longhun_logs:/app/backend/logs
      # 本地开发模式：挂载代码实时更新
      - ./config:/app/config:ro
    environment:
      - LONGHUN_API_HOST=0.0.0.0
      - LONGHUN_API_PORT=9622
      - LONGHUN_LOG_LEVEL=${LONGHUN_LOG_LEVEL:-INFO}
      - LONGHUN_JWT_SECRET=${LONGHUN_JWT_SECRET:-change-me-in-production}
      - LONGHUN_DATA=/app/L7_数据层
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    networks:
      - longhun-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9622/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 龍魂 Web 门户 ───
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: longhun-web
    image: longhun/web:v2.0
    restart: unless-stopped
    ports:
      - "${LONGHUN_WEB_PORT:-8777}:8777"
    volumes:
      # 本地开发：挂载前端文件实时更新
      - ./portal:/app/portal:ro
      - ./web:/app/web:ro
      - ./web_server.py:/app/web_server.py:ro
    environment:
      - LONGHUN_API_URL=http://api:9622
      - LONGHUN_WEB_PORT=8777
      - LONGHUN_WEB_HOST=0.0.0.0
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - longhun-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8777/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Nginx 反向代理（生产用） ───
  nginx:
    image: nginx:1.27-alpine
    container_name: longhun-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/longhun888.com.nginx:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html/web:ro
      - ./portal:/usr/share/nginx/html/portal:ro
      # SSL 证书（如需要）
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - longhun-net
    profiles:
      - production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 待融入包监控（可选） ───
  package-watcher:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: longhun-package-watcher
    image: longhun/package-watcher:v1.0
    restart: unless-stopped
    volumes:
      - ${HOME}:/host/home:ro
      - ${HOME}/Downloads:/host/Downloads:ro
      - ./docs:/app/output
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    profiles:
      - watcher
      - full
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - longhun-net

networks:
  longhun-net:
    driver: bridge
    name: longhun-net

volumes:
  longhun_data:
    name: longhun_data
  longhun_logs:
    name: longhun_logs
