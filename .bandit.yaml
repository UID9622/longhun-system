# 跳过的测试（龍魂系统的合法使用场景）
skips:
  - B101   # assert 在测试中被使用
  - B311   # random 用于熵源而非密码学
  - B322   # input() 在 CLI 工具中合法使用

# 基线结果文件
baseline: .bandit-baseline.json
