    <script>
        const elements = {
            "甲": "木", "乙": "木", "丙": "火", "丁": "火",
            "戊": "土", "己": "土", "庚": "金", "辛": "金",
            "壬": "水", "癸": "水",
            "子": "水", "丑": "土", "寅": "木", "卯": "木",
            "辰": "土", "巳": "火", "午": "火", "未": "土",
            "申": "金", "酉": "金", "戌": "土", "亥": "水"
        };

        const elementColors = {
            "金": "jin",
            "木": "mu",
            "水": "shui",
            "火": "huo",
            "土": "tu"
        };

        function calculate() {
            const yearGan = document.getElementById('yearGan').value;
            const yearZhi = document.getElementById('yearZhi').value;
            const monthGan = document.getElementById('monthGan').value;
            const monthZhi = document.getElementById('monthZhi').value;
            const dayGan = document.getElementById('dayGan').value;
            const dayZhi = document.getElementById('dayZhi').value;
            const timeGan = document.getElementById('timeGan').value;
            const timeZhi = document.getElementById('timeZhi').value;

            if (!yearGan || !yearZhi || !monthGan || !monthZhi || !dayGan || !dayZhi || !timeGan || !timeZhi) {
                alert('请选择完整的四柱');
                return;
            }

            const scores = {
                "金": 0, "木": 0, "水": 0, "火": 0, "土": 0
            };

            const weights = {
                "年": {"天干": 1.0, "地支": 0.8},
                "月": {"天干": 1.5, "地支": 1.2},
                "日": {"天干": 2.0, "地支": 1.6},
                "时": {"天干": 1.2, "地支": 1.0}
            };

            // 计算分数
            scores[elements[yearGan]] += weights["年"]["天干"];
            scores[elements[yearZhi]] += weights["年"]["地支"];
            scores[elements[monthGan]] += weights["月"]["天干"];
            scores[elements[monthZhi]] += weights["月"]["地支"];
            scores[elements[dayGan]] += weights["日"]["天干"];
            scores[elements[dayZhi]] += weights["日"]["地支"];
            scores[elements[timeGan]] += weights["时"]["天干"];
            scores[elements[timeZhi]] += weights["时"]["地支"];

            // 生成HTML
            let html = '<div class="wuxing-section">';
            const total = Object.values(scores).reduce((a, b) => a + b, 0);

            for (const [element, score] of Object.entries(scores)) {
                const percentage = (score / total * 100).toFixed(1);
                const color = elementColors[element];
                let status = '适中';
                if (percentage > 40) status = '过旺';
                else if (percentage < 15) status = '偏弱';

                html += `
                    <div class="card">
                        <div class="element ${color}">
                            <span class="element-name">${element}</span>
                            <span>${percentage}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress ${color}" style="width: ${percentage}%"></div>
                        </div>
                        <div style="margin-top: 10px; font-size: 0.9em; color: #cbd5e1;">
                            分值: ${score.toFixed(2)} · 评估: ${status}
                        </div>
                    </div>
                `;
            }

            html += '</div>';

            const maxElement = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            const maxPercentage = (scores[maxElement] / total * 100).toFixed(1);

            let statusClass = 'green';
            if (maxPercentage > 40) statusClass = 'red';
            else if (maxPercentage > 25) statusClass = 'yellow';

            html += `
                <div class="status ${statusClass}">
                    🔮 主导五行: ${maxElement} (${maxPercentage}%)
                </div>
            `;

            document.getElementById('results').innerHTML = html;
        }

        // 演示模式：自动加载默认四柱
        window.addEventListener('load', () => {
            document.getElementById('yearGan').value = '甲';
            document.getElementById('yearZhi').value = '子';
            document.getElementById('monthGan').value = '丙';
            document.getElementById('monthZhi').value = '午';
            document.getElementById('dayGan').value = '庚';
            document.getElementById('dayZhi').value = '申';
            document.getElementById('timeGan').value = '壬';
            document.getElementById('timeZhi').value = '戌';
            calculate();
        });
    </script>
