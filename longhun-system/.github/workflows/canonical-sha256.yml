# When this directory is the Git repository root (standalone longhun-system).
name: canonical-sha256

on:
  push:
    branches: [main, release-snapshot]
    paths:
      - "BehavCrypto_v1.0/**"
      - "scripts/canonical-sha256/**"
      - ".github/workflows/canonical-sha256.yml"
  pull_request:
    branches: [main, release-snapshot]
    paths:
      - "BehavCrypto_v1.0/**"
      - "scripts/canonical-sha256/**"
      - ".github/workflows/canonical-sha256.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CANONICAL_SHA256
        run: bash scripts/canonical-sha256/verify.sh
