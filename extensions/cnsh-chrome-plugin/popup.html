<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>龍魂 CNSH · 快速面板</title>
  <style>
    :root {
      --bg: #0f0820;
      --bg2: #1a1030;
      --fg: #e8e0ff;
      --accent: #8b5cf6;
      --gold: #fbbf24;
      --pink: #ec4899;
      --cyan: #7dd3fc;
      --green: #10b981;
      --red: #ef4444;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 360px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
    }
    header {
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--bg2) 0%, #2d1b4e 100%);
      border-bottom: 1px solid rgba(139, 92, 246, 0.3);
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--gold);
    }
    header .sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }
    main { padding: 12px 16px 16px; }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tab {
      flex: 1;
      padding: 7px 4px;
      background: var(--bg2);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 5px;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .tab.active {
      background: rgba(139, 92, 246, 0.25);
      border-color: var(--accent);
      color: var(--gold);
    }
    textarea {
      width: 100%;
      min-height: 90px;
      background: var(--bg2);
      color: var(--fg);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 5px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    input[type="text"] {
      width: 100%;
      background: var(--bg2);
      color: var(--fg);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 5px;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 13px;
      margin-bottom: 8px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin: 8px 0 3px;
    }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    button {
      width: 100%;
      padding: 10px 12px;
      margin-top: 10px;
      background: linear-gradient(135deg, var(--accent), #6d28d9);
      color: #fff;
      border: none;
      border-radius: 5px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button.ghost {
      background: transparent;
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: var(--fg);
      font-weight: 400;
    }
    .status {
      margin-top: 8px;
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 4px;
      display: none;
    }
    .status.ok { background: rgba(16, 185, 129, 0.15); color: var(--green); display: block; }
    .status.err { background: rgba(239, 68, 68, 0.15); color: var(--red); display: block; }
    .pane { display: none; }
    .pane.active { display: block; }
    footer {
      padding: 8px 16px;
      border-top: 1px solid rgba(139, 92, 246, 0.15);
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
    }
    .link { color: var(--cyan); cursor: pointer; }
    .link:hover { text-decoration: underline; }
    .dna-display {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--gold);
      background: rgba(251, 191, 36, 0.08);
      padding: 4px 6px;
      border-radius: 3px;
      margin-top: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header>
    <h1>⚡ 龍魂 · CNSH 快速面板</h1>
    <div class="sub">布军 → 净化 → 入库 · UID9622</div>
  </header>

  <main>
    <div class="tabs">
      <div class="tab active" data-pane="inbox">🧩 Inbox</div>
      <div class="tab" data-pane="dna">🧬 DNA</div>
      <div class="tab" data-pane="heart">💖 人心</div>
    </div>

    <!-- Inbox Pane -->
    <div class="pane active" data-pane="inbox">
      <label>标题 / 资源名</label>
      <input type="text" id="inbox-title" placeholder="自动取当前页标题" />
      <label>内容（可从选中导入）</label>
      <textarea id="inbox-content" placeholder="粘贴或手写..."></textarea>
      <button class="ghost" id="inbox-pull">⤵️ 导入当前选中</button>
      <button id="inbox-submit">🧩 送入 Inbox</button>
    </div>

    <!-- DNA Pane -->
    <div class="pane" data-pane="dna">
      <label>核心概念</label>
      <input type="text" id="dna-concept" placeholder="一句话总结这条DNA" />
      <label>技术点</label>
      <textarea id="dna-tech" placeholder="具体可复用的技术点..."></textarea>
      <div class="row">
        <div>
          <label>方向</label>
          <input type="text" id="dna-direction" placeholder="AI/前端/易经..." />
        </div>
        <div>
          <label>纯度 %</label>
          <input type="text" id="dna-purity" value="70" />
        </div>
      </div>
      <button id="dna-submit">🧬 入 DNA 库</button>
    </div>

    <!-- Heart Pane -->
    <div class="pane" data-pane="heart">
      <label>洞察标题</label>
      <input type="text" id="heart-title" placeholder="这次洞察的一句话" />
      <label>洞察内容</label>
      <textarea id="heart-insight" placeholder="发生了什么,我看到了什么..."></textarea>
      <label>人生场景</label>
      <input type="text" id="heart-scene" placeholder="职场/家庭/亲密关系..." />
      <button id="heart-submit">💖 录入人心算法</button>
    </div>

    <div class="status" id="status"></div>
  </main>

  <footer>
    <span class="link" id="open-options">⚙️ 配置</span>
    <span>v0.1.0 · 龍芯⚡️</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
