<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 龍魂系統演变分析仪表板</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #151a3f 100%);
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #00d4ff;
            padding-bottom: 20px;
        }
        .header h1 {
            background: linear-gradient(90deg, #00d4ff, #00f5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(21, 26, 63, 0.8);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        .stat-label {
            color: #a0aec0;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #00f5ff;
            margin-bottom: 10px;
        }
        .stat-description {
            color: #a0aec0;
            font-size: 0.85em;
        }
        .evolution-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 10px;
            font-weight: bold;
        }
        .badge-extension { background: #4ade80; color: #000; }
        .badge-upgrade { background: #3b82f6; color: #fff; }
        .badge-maintenance { background: #f59e0b; color: #000; }
        
        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-card {
            background: rgba(21, 26, 63, 0.8);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .chart-title {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
        canvas { max-height: 300px; }
        
        .evolution-timeline {
            background: rgba(21, 26, 63, 0.8);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .timeline-item {
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(0, 212, 255, 0.05);
            border-left: 4px solid #00d4ff;
            border-radius: 6px;
            position: relative;
        }
        
        .timeline-version {
            color: #00f5ff;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .timeline-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-left: 10px;
        }
        
        .type-extension { background: #4ade80; color: #000; }
        .type-upgrade { background: #3b82f6; color: #fff; }
        .type-fix { background: #f59e0b; color: #000; }
        
        .timeline-desc {
            color: #a0aec0;
            font-size: 0.9em;
            margin-top: 8px;
        }
        
        .timeline-time {
            color: #a0aec0;
            font-size: 0.8em;
            margin-top: 5px;
        }
        
        .health-meter {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            height: 30px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #00d4ff;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            color: #00d4ff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐉 龍魂系統演变分析仪表板</h1>
            <p>DNA: #龍芯⚡️2026-06-07-EVOLUTION-DASHBOARD-v1.0</p>
            <p>一眼看清: 扩展 vs 升级 vs 维护</p>
        </div>
        
        <div class="controls">
            <button onclick="loadSampleData()">📥 加载示例数据</button>
            <button onclick="generateReport()">📊 生成报告</button>
            <button onclick="exportData()">💾 导出数据</button>
        </div>
        
        <!-- 核心统计卡片 -->
        <div class="dashboard-grid">
            <!-- 扩展 -->
            <div class="stat-card">
                <div class="stat-label">📈 扩展</div>
                <div class="stat-value" id="extensions">0</div>
                <div class="stat-description">新增功能模块</div>
                <div class="evolution-badge badge-extension">新功能增加</div>
                <div class="health-meter">
                    <div class="health-fill" id="extension-meter" style="width: 0%">0%</div>
                </div>
            </div>
            
            <!-- 升级 -->
            <div class="stat-card">
                <div class="stat-label">⬆️ 升级</div>
                <div class="stat-value" id="upgrades">0</div>
                <div class="stat-description">功能改进和优化</div>
                <div class="evolution-badge badge-upgrade">性能提升</div>
                <div class="health-meter">
                    <div class="health-fill" id="upgrade-meter" style="width: 0%; background: linear-gradient(90deg, #3b82f6, #06b6d4);">0%</div>
                </div>
            </div>
            
            <!-- 维护 -->
            <div class="stat-card">
                <div class="stat-label">🔧 维护</div>
                <div class="stat-value" id="maintenance">0</div>
                <div class="stat-description">Bug修复和稳定性</div>
                <div class="evolution-badge badge-maintenance">问题解决</div>
                <div class="health-meter">
                    <div class="health-fill" id="maintenance-meter" style="width: 0%; background: linear-gradient(90deg, #f59e0b, #f97316);">0%</div>
                </div>
            </div>
            
            <!-- 系统健康 -->
            <div class="stat-card">
                <div class="stat-label">🏥 系统健康</div>
                <div class="stat-value" id="health">0%</div>
                <div class="stat-description">成功率和可靠性</div>
                <div id="health-badge" class="evolution-badge">就绪</div>
                <div class="health-meter">
                    <div class="health-fill" id="health-meter" style="width: 0%; background: linear-gradient(90deg, #4ade80, #10b981);">0%</div>
                </div>
            </div>
        </div>
        
        <!-- 图表区域 -->
        <div class="charts-section">
            <div class="chart-card">
                <div class="chart-title">📊 演变分布</div>
                <canvas id="evolutionChart"></canvas>
            </div>
            
            <div class="chart-card">
                <div class="chart-title">📈 版本发展趋势</div>
                <canvas id="versionChart"></canvas>
            </div>
            
            <div class="chart-card">
                <div class="chart-title">🎯 可靠性指标</div>
                <canvas id="reliabilityChart"></canvas>
            </div>
            
            <div class="chart-card">
                <div class="chart-title">💾 存储效率</div>
                <canvas id="storageChart"></canvas>
            </div>
        </div>
        
        <!-- 演变时间线 -->
        <div class="evolution-timeline">
            <h2 style="color: #00d4ff; margin-bottom: 20px;">⏰ 演变时间线</h2>
            <div id="timeline"></div>
        </div>
    </div>
    
    <script>
        // 全局图表实例
        let charts = {};
        
        function loadSampleData() {
            // 模拟数据
            const data = {
                extensions: 7,
                upgrades: 12,
                maintenance: 5,
                health: 94.5,
                versions: [
                    { version: "1.0.0", type: "extension", desc: "初始发布", time: "2026-05-20" },
                    { version: "1.1.0", type: "extension", desc: "添加 3 个新技能", time: "2026-05-25" },
                    { version: "1.1.1", type: "maintenance", desc: "修复导出 Bug", time: "2026-05-26" },
                    { version: "1.2.0", type: "upgrade", desc: "优化性能 +30%", time: "2026-05-28" },
                    { version: "1.2.1", type: "maintenance", desc: "修复内存泄漏", time: "2026-05-29" },
                    { version: "1.3.0", type: "upgrade", desc: "改进 UI 响应", time: "2026-06-01" },
                    { version: "1.3.1", type: "maintenance", desc: "安全更新", time: "2026-06-02" },
                    { version: "1.4.0", type: "extension", desc: "添加日志系统", time: "2026-06-07" }
                ],
                logs: {
                    success: 850,
                    failure: 50,
                    total: 900
                },
                storage: {
                    original: 5240,
                    compressed: 1580,
                    saved: 3660
                }
            };
            
            updateDashboard(data);
        }
        
        function updateDashboard(data) {
            // 更新数字
            document.getElementById('extensions').textContent = data.extensions;
            document.getElementById('upgrades').textContent = data.upgrades;
            document.getElementById('maintenance').textContent = data.maintenance;
            document.getElementById('health').textContent = data.health.toFixed(1) + '%';
            
            const total = data.extensions + data.upgrades + data.maintenance;
            document.getElementById('extension-meter').style.width = (data.extensions / total * 100) + '%';
            document.getElementById('upgrade-meter').style.width = (data.upgrades / total * 100) + '%';
            document.getElementById('maintenance-meter').style.width = (data.maintenance / total * 100) + '%';
            document.getElementById('health-meter').style.width = data.health + '%';
            
            // 更新图表
            updateCharts(data);
            
            // 更新时间线
            updateTimeline(data.versions);
        }
        
        function updateCharts(data) {
            const total = data.extensions + data.upgrades + data.maintenance;
            
            // 演变分布
            if (charts.evolution) charts.evolution.destroy();
            const evolutionCtx = document.getElementById('evolutionChart').getContext('2d');
            charts.evolution = new Chart(evolutionCtx, {
                type: 'doughnut',
                data: {
                    labels: ['扩展 (新功能)', '升级 (改进)', '维护 (修复)'],
                    datasets: [{
                        data: [data.extensions, data.upgrades, data.maintenance],
                        backgroundColor: ['#4ade80', '#3b82f6', '#f59e0b'],
                        borderColor: '#0a0e27',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { labels: { color: '#fff' } } }
                }
            });
            
            // 版本发展趋势
            if (charts.version) charts.version.destroy();
            const versionCtx = document.getElementById('versionChart').getContext('2d');
            charts.version = new Chart(versionCtx, {
                type: 'line',
                data: {
                    labels: data.versions.map(v => v.version),
                    datasets: [{
                        label: '累计版本',
                        data: Array.from({length: data.versions.length}, (_, i) => i + 1),
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { labels: { color: '#fff' } } },
                    scales: {
                        y: { ticks: { color: '#a0aec0' }, grid: { color: 'rgba(0,212,255,0.1)' } },
                        x: { ticks: { color: '#a0aec0' }, grid: { color: 'rgba(0,212,255,0.1)' } }
                    }
                }
            });
            
            // 可靠性指标
            if (charts.reliability) charts.reliability.destroy();
            const reliabilityCtx = document.getElementById('reliabilityChart').getContext('2d');
            const successRate = (data.logs.success / data.logs.total * 100).toFixed(1);
            charts.reliability = new Chart(reliabilityCtx, {
                type: 'bar',
                data: {
                    labels: ['成功', '失败'],
                    datasets: [{
                        label: '日志统计',
                        data: [data.logs.success, data.logs.failure],
                        backgroundColor: ['#4ade80', '#ff006e'],
                        borderColor: '#0a0e27',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { labels: { color: '#fff' } } },
                    scales: {
                        y: { ticks: { color: '#a0aec0' }, grid: { color: 'rgba(0,212,255,0.1)' } },
                        x: { ticks: { color: '#a0aec0' }, grid: { color: 'rgba(0,212,255,0.1)' } }
                    }
                }
            });
            
            // 存储效率
            if (charts.storage) charts.storage.destroy();
            const storageCtx = document.getElementById('storageChart').getContext('2d');
            charts.storage = new Chart(storageCtx, {
                type: 'pie',
                data: {
                    labels: ['已压缩', '节省空间'],
                    datasets: [{
                        data: [data.storage.compressed, data.storage.saved],
                        backgroundColor: ['#3b82f6', '#4ade80'],
                        borderColor: '#0a0e27',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { labels: { color: '#fff' } } }
                }
            });
        }
        
        function updateTimeline(versions) {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = versions.reverse().map(v => {
                const types = {
                    extension: { class: 'type-extension', label: '扩展' },
                    upgrade: { class: 'type-upgrade', label: '升级' },
                    maintenance: { class: 'type-fix', label: '维护' }
                };
                const type = types[v.type];
                
                return `
                    <div class="timeline-item">
                        <div class="timeline-version">
                            ${v.version}
                            <span class="timeline-type ${type.class}">${type.label}</span>
                        </div>
                        <div class="timeline-desc">${v.desc}</div>
                        <div class="timeline-time">${v.time}</div>
                    </div>
                `;
            }).join('');
        }
        
        function generateReport() {
            alert('📊 报告已生成！\n\n所有数据已导出到本地数据库。');
        }
        
        function exportData() {
            alert('💾 数据已导出！\n\nJSON 格式文件已保存到: ~/longhun-evolution.json');
        }
        
        // 页面加载时自动加载示例数据
        window.addEventListener('load', () => {
            loadSampleData();
        });
    </script>
</body>
</html>
