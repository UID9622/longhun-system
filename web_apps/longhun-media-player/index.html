<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐉 龍魂 · 全媒体播放器 v1.1</title>
  <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #161616;
      --accent: #00ff66;
      --accent2: #00ffff;
      --text: #eeeeee;
      --muted: #888888;
      --danger: #ff4d4d;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header { margin-bottom: 16px; }
    header h1 { font-size: 1.6rem; margin: 0; color: var(--accent); }
    header p { margin: 6px 0 0; color: var(--muted); font-size: 0.85rem; }
    .status-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .dna {
      word-break: break-all;
      font-family: "SF Mono", Consolas, monospace;
    }
    .status-badge {
      padding: 2px 8px;
      border-radius: 12px;
      background: #222;
      color: var(--accent);
      border: 1px solid #333;
    }
    .file-input {
      margin-bottom: 16px;
      padding: 14px;
      background: var(--panel);
      border: 1px dashed #444;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .file-input:hover { border-color: var(--accent); }
    .file-input input { display: none; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    .video-wrap {
      background: var(--panel);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #222;
    }
    .side-panel { display: flex; flex-direction: column; gap: 16px; }
    .panel {
      background: var(--panel);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #222;
    }
    .panel h2 { font-size: 1rem; margin: 0 0 12px; color: var(--accent); }
    .search-box {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 10px;
      background: #000;
      color: var(--text);
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .search-box:focus { outline: none; border-color: var(--accent); }
    .transcript, .ocr-list {
      max-height: 260px;
      overflow-y: auto;
      font-size: 0.85rem;
    }
    .transcript-line {
      padding: 6px 0;
      border-bottom: 1px solid #222;
      cursor: pointer;
      transition: background 0.15s;
    }
    .transcript-line:hover { background: #1e1e1e; }
    .transcript-line.hidden { display: none; }
    .transcript-time {
      color: var(--accent2);
      font-size: 0.75rem;
      margin-right: 8px;
      font-family: "SF Mono", Consolas, monospace;
    }
    .ocr-item { border-bottom: 1px solid #222; padding: 8px 0; }
    .ocr-item:last-child { border-bottom: none; }
    .ocr-time { color: var(--accent2); font-size: 0.75rem; }
    .embed-code {
      background: #000;
      padding: 12px;
      border-radius: 6px;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 0.78rem;
      word-break: break-all;
      color: #aaa;
    }
    .copy-btn {
      margin-top: 10px;
      padding: 8px 14px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }
    .copy-btn:hover { background: #00cc52; }
    .vjs-theme-longhun {
      --vjs-primary-color: var(--accent);
      --vjs-secondary-color: #111;
    }
    @media (max-width: 640px) {
      body { padding: 12px; }
      header h1 { font-size: 1.25rem; }
      .panel { padding: 12px; }
      .transcript, .ocr-list { max-height: 220px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🐉 龍魂 · 全媒体播放器 v1.1</h1>
      <p>本地播放 · 语音识别 · 画面文字识别 · 可嵌入网页</p>
    </header>

    <div class="status-bar">
      <div class="dna" id="dna-display">DNA: #龍芯⚡️丙午·丙申·辛酉·酉时·䷦蹇-MEDIA-PLAYER-REFINE-V1.1-P0-714d6fd6</div>
      <span class="status-badge" id="status-display">就绪</span>
    </div>

    <label class="file-input">
      <input type="file" id="videoInput" accept="video/*">
      📁 点击或拖拽选择本地视频文件
    </label>

    <div class="grid">
      <div class="video-wrap">
        <video id="longhun-player" class="video-js vjs-theme-longhun vjs-big-play-centered" controls preload="auto" width="100%" height="540" data-setup='{}'>
          <p class="vjs-no-js">请启用 JavaScript 以使用龍魂播放器</p>
        </video>
      </div>

      <div class="side-panel">
        <div class="panel">
          <h2>🎙️ 语音文稿</h2>
          <input type="search" class="search-box" id="asr-search" placeholder="搜索文稿关键字...">
          <div class="transcript" id="asr-panel">选择视频后，将由后端生成 ASR 文稿。演示模式下点击时间戳可跳转。</div>
        </div>
        <div class="panel">
          <h2>🖼️ 画面文字</h2>
          <div class="ocr-list" id="ocr-panel">选择视频后，将由后端生成 OCR 结果。</div>
        </div>
        <div class="panel">
          <h2>📎 嵌入代码</h2>
          <div class="embed-code" id="embed-code">&lt;iframe src="..." width="960" height="720" frameborder="0"&gt;&lt;/iframe&gt;</div>
          <button class="copy-btn" id="copy-btn">复制嵌入代码</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
  <script>
    const player = videojs('longhun-player', { fluid: true });
    const videoInput = document.getElementById('videoInput');
    const asrPanel = document.getElementById('asr-panel');
    const asrSearch = document.getElementById('asr-search');
    const ocrPanel = document.getElementById('ocr-panel');
    const embedCode = document.getElementById('embed-code');
    const copyBtn = document.getElementById('copy-btn');
    const statusDisplay = document.getElementById('status-display');

    function setStatus(text, type) {
      statusDisplay.textContent = text;
      statusDisplay.style.color = type === 'ok' ? 'var(--accent)' : (type === 'warn' ? '#ffcc00' : 'var(--danger)');
    }

    function renderTranscript(segments) {
      asrPanel.innerHTML = '';
      if (!segments.length) {
        asrPanel.textContent = '暂无 ASR 结果';
        return;
      }
      segments.forEach(function(seg) {
        const div = document.createElement('div');
        div.className = 'transcript-line';
        div.dataset.text = seg.text.toLowerCase();
        div.innerHTML = '<span class="transcript-time">[' + seg.start.toFixed(1) + 's]</span>' + escapeHtml(seg.text);
        div.addEventListener('click', function() {
          player.currentTime(seg.start);
          player.play();
        });
        asrPanel.appendChild(div);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function filterTranscript(query) {
      const q = query.toLowerCase();
      const lines = asrPanel.querySelectorAll('.transcript-line');
      lines.forEach(function(line) {
        line.classList.toggle('hidden', q && (line.dataset.text || '').indexOf(q) === -1);
      });
    }

    asrSearch.addEventListener('input', function() {
      filterTranscript(this.value);
    });

    copyBtn.addEventListener('click', function() {
      const code = embedCode.textContent;
      navigator.clipboard.writeText(code).then(function() {
        const original = copyBtn.textContent;
        copyBtn.textContent = '已复制 ✓';
        setTimeout(function() { copyBtn.textContent = original; }, 1500);
      }).catch(function() {
        copyBtn.textContent = '复制失败';
      });
    });

    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        if (player.paused()) { player.play(); } else { player.pause(); }
      }
    });

    videoInput.addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;

      setStatus('演示模式', 'warn');
      const url = URL.createObjectURL(file);
      player.src({ type: file.type, src: url });
      player.load();

      // 演示文稿：点击时间戳可跳转
      const demoSegments = [
        { start: 0.0, text: '选择视频后，后端将生成 ASR 文稿。' },
        { start: 5.2, text: '点击左侧时间戳，视频会跳转到对应位置。' },
        { start: 12.8, text: '使用上方搜索框可过滤文稿内容。' },
        { start: 20.0, text: '按空格键可播放/暂停（搜索框内除外）。' },
      ];
      renderTranscript(demoSegments);

      ocrPanel.innerHTML = '<div class="ocr-item"><div>本地演示模式：后端处理完成后，将在此处显示画面文字。</div></div>';
      embedCode.textContent = '<iframe src="./' + file.name + '.html" width="960" height="720" frameborder="0"></iframe>';
    });
  </script>
</body>
</html>
