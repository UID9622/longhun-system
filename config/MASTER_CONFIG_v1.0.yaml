        name: "天 (Heaven/Timing)"
        symbol: "H"
        default: 0.35
        description: "時勢·大環境·外部條件"

      human:
        name: "人 (Human/Will)"
        symbol: "P"
        default: 0.50
        floor: 0.34
        floor_meaning: "低於0.34=黃旗·需要加持"

      earth:
        name: "地 (Earth/Resources)"
        symbol: "E"
        default: 0.15
        description: "條件·資源·客觀環境"

