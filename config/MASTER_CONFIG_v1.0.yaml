    factors:
      F2_sharpness:
        name: "銳度 (Sharpness)"
        weight: 0.4
        type: "positive"
        meaning: "主控的行為銳度/果決度"

      F6_long_term:
        name: "長期視角 (Long-term perspective)"
        weight: 0.4
        type: "positive"
        meaning: "是否考慮長期後果"

      F3_density:
        name: "密度 (Decision density)"
        weight: 0.2
        type: "positive"
        meaning: "決策的密度/強度"

      F1_absence:
        name: "缺席 (Absence)"
        weight: -0.5
        type: "negative"
        meaning: "L0-L5間隔有多大"

      F5_pleasing:
        name: "討好傾向 (Pleasing tendency)"
        weight: -0.3
        type: "negative"
        meaning: "自我審查傾向"

    color_thresholds:
      green_top: 0.30
      yellow_top: 0.67
      red_top: 0.85

  three_talent_system:
    name: "三才權重系統"
    formula: "sancai(H,E,P) = H×0.25 + E×0.25 + P×max(0.5, 1-(H×0.3+E×0.3))"

    components:
