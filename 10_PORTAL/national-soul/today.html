  if (!HISTORY_DB[k]) HISTORY_DB[k] = v;
  else HISTORY_DB[k] = [...HISTORY_DB[k], ...v];
}

// 渲染
const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function buildSelectors(month, day) {
  const ms = document.getElementById('month-select');
  const ds = document.getElementById('day-select');

  ms.innerHTML = monthNames.map((n,i) => `<option value="${i+1}" ${i+1===month?'selected':''}>${n}</option>`).join('');

  const daysInMonth = new Date(2024, month, 0).getDate();
  ds.innerHTML = Array.from({length:daysInMonth}, (_,i) =>
    `<option value="${i+1}" ${i+1===day?'selected':''}>${i+1}日</option>`
  ).join('');
}

function goToDate() {
  const m = parseInt(document.getElementById('month-select').value);
  const d = parseInt(document.getElementById('day-select').value);
  renderDate(m, d);
}

function renderDate(month, day) {
  document.getElementById('month-day-display').innerHTML = `${month}<span class="slash">/</span>${day}`;
  document.getElementById('year-hint') && (document.getElementById('year-hint').textContent = `历史上的今天 —— ${month}月${day}日`);

  const key = `${month}-${day}`;
  const events = HISTORY_DB[key] || [];
  const timeline = document.getElementById('timeline');
  const empty = document.getElementById('empty-state');

  if (events.length === 0) {
    timeline.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const sorted = [...events].sort((a,b) => b.year - a.year);

  timeline.innerHTML = sorted.map(e => {
    const tagMap = {
      war: 'tag-war', science: 'tag-science', culture: 'tag-culture',
      politics: 'tag-politics', society: 'tag-society'
    };
    const tagLabel = {
      war:'战史', science:'科技', culture:'文化', politics:'政治', society:'社会'
    };
    return `
    <div class="event-item" style="animation:fadeIn 0.5s both;">
      <span class="event-year">${e.year}年</span>
      <span class="event-tag ${tagMap[e.tag]||'tag-society'}">${tagLabel[e.tag]||'事件'}</span>
      <div class="event-title">${e.title}</div>
      <div class="event-desc">${e.desc}</div>
    </div>`;
  }).join('');

  document.querySelectorAll('.event-item').forEach((el,i) => {
    el.style.animationDelay = `${i*80}ms`;
  });
}

// 初始化
const today = new Date();
const currentMonth = today.getMonth() + 1;
const currentDay = today.getDate();
buildSelectors(currentMonth, currentDay);
renderDate(currentMonth, currentDay);

// 动画
const s = document.createElement('style');
s.textContent = '@keyframes fadeIn{from{opacity:0;transform:translateX(-12px);}to{opacity:1;transform:translateX(0);}}';
document.head.appendChild(s);
</script>
