/* 侧边栏：卷轴+屏风 */

/* 输入区：砚台 */
.input-block {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 8px;
  padding: 10px 0;
}
.input-block .slash-hint {
  color: var(--text-tertiary);
  font-size: 14px;
  padding: 6px 0;
}
.input-area {
  flex: 1;
  min-height: 48px;
  max-height: 200px;
  overflow-y: auto;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  font-size: 16px;
  line-height: 1.6;
  outline: none;
  resize: none;
  font-family: var(--font-serif);
  box-shadow: inset 0 1px 3px rgba(44,36,27,0.04);
}
.input-area:focus {
  border-color: var(--selected-border);
  box-shadow: 0 0 0 2px var(--selected), inset 0 1px 3px rgba(44,36,27,0.04);
}
.input-area:empty::before {
  content: "输入 '/' 查看法诀，输入 '@' 请神人格…";
  color: var(--text-tertiary);
}

/* 命令/提及菜单 */
.command-menu, .mention-menu {
  position: absolute;
  bottom: 100%;
  left: 0;
  width: 300px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: 8px 0;
  z-index: 1000;
  display: none;
  margin-bottom: 10px;
  font-family: var(--font-serif);
}
.command-menu.show, .mention-menu.show { display: block; }
.command-item, .mention-item {
  padding: 9px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  font-size: 14px;
}
.command-item:hover, .command-item.active, .mention-item:hover, .mention-item.active { background: var(--bg-secondary); }
.command-item .cmd-icon {
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 15px;
  background: var(--bg-secondary);
  border-radius: 50%;
  border: 1px solid var(--border);
}
.command-item .cmd-info { flex: 1; }
.command-item .cmd-name { font-weight: 600; color: var(--text); }
.command-item .cmd-desc { font-size: 12px; color: var(--text-secondary); }

/* 状态栏 */
.statusbar {
  height: 32px;
  border-top: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  font-size: 12px;
  color: var(--text-tertiary);
  flex-shrink: 0;
  background: rgba(239,233,217,0.6);
}
.statusbar-left, .statusbar-right { display: flex; align-items: center; gap: 14px; }
.statusbar .indicator {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--jade);
  box-shadow: 0 0 8px var(--jade);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* 加载动画：太极 */
.typing-dots {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(90deg, var(--ink) 50%, var(--bg) 50%);
  border: 1px solid var(--border);
  animation: taiji-spin 1.2s linear infinite;
  position: relative;
}
.typing-dots::before, .typing-dots::after {
  content: "";
  position: absolute;
  border-radius: 50%;
}
.typing-dots::before {
  width: 14px; height: 14px;
  background: var(--ink);
  top: 0; left: 7px;
  box-shadow: inset 0 0 0 4px var(--bg);
}
.typing-dots::after {
  width: 14px; height: 14px;
  background: var(--bg);
  bottom: 0; left: 7px;
  box-shadow: inset 0 0 0 4px var(--ink);
}
@keyframes taiji-spin {
  to { transform: rotate(360deg); }
}

/* 滚动条 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

/* 水墨涟漪 */
.ink-ripple {
  position: fixed;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(26,20,16,0.08) 0%, transparent 70%);
  pointer-events: none;
  transform: scale(0);
  animation: ripple 0.8s ease-out forwards;
  z-index: 9999;
}
@keyframes ripple {
  to { transform: scale(4); opacity: 0; }
}

/* 终端面板 */
.terminal-panel {
  position: fixed;
  bottom: 0;
  left: var(--sidebar-width);
  right: 0;
  height: 0;
  background: var(--bg);
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 20px rgba(44,36,27,0.1);
  display: flex;
  flex-direction: column;
  transition: height 0.25s ease;
  z-index: 50;
  overflow: hidden;
}
.terminal-panel.open { height: 360px; }
.terminal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-family: var(--font-mono);
  flex-shrink: 0;
}
.terminal-title { display: flex; align-items: center; gap: 8px; }
.terminal-tools { display: flex; align-items: center; gap: 6px; }
.terminal-tool-btn {
  padding: 4px 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-secondary);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-mono);
}
.terminal-tool-btn:hover { background: var(--bg-hover); }
.terminal-tool-btn.active { border-color: var(--accent); color: var(--accent); }
.terminal-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.terminal-input-line {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  background: var(--bg-secondary);
  flex-shrink: 0;
}
.terminal-prompt {
  font-family: var(--font-mono);
  font-size: 13px;
  padding-top: 4px;
  white-space: nowrap;
}
.terminal-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: inherit;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  resize: none;
  padding: 4px 0;
  min-height: 24px;
  max-height: 120px;
}
.terminal-close {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
}

/* 终端主题 */
.terminal-theme-paper {
  --term-bg: var(--bg);
  --term-text: var(--text);
  --term-prompt: var(--accent);
  --term-dir: var(--jade);
  --term-error: var(--accent);
  --term-warn: #c9a227;
  --term-info: #4a7c59;
}
.terminal-theme-green {
  --term-bg: #0a120a;
  --term-text: #33ff33;
  --term-prompt: #33ff33;
  --term-dir: #88ff88;
  --term-error: #ff5555;
  --term-warn: #ffff55;
  --term-info: #55ff55;
}
.terminal-theme-dark {
  --term-bg: #1a1a1f;
  --term-text: #e4e4e7;
  --term-prompt: #60a5fa;
  --term-dir: #34d399;
  --term-error: #f87171;
  --term-warn: #fbbf24;
  --term-info: #22d3ee;
}
.terminal-panel.terminal-theme-paper,
.terminal-panel.terminal-theme-green,
.terminal-panel.terminal-theme-dark {
  background: var(--term-bg);
  color: var(--term-text);
}
.terminal-panel.terminal-theme-green .terminal-header,
.terminal-panel.terminal-theme-dark .terminal-header,
.terminal-panel.terminal-theme-green .terminal-input-line,
.terminal-panel.terminal-theme-dark .terminal-input-line {
  background: rgba(255,255,255,0.04);
  border-color: rgba(255,255,255,0.1);
}
.terminal-panel.terminal-theme-green .terminal-tool-btn,
.terminal-panel.terminal-theme-dark .terminal-tool-btn {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.15);
  color: var(--term-text);
}
.terminal-prompt { color: var(--term-prompt); }
.term-dir { color: var(--term-dir); }
.term-error { color: var(--term-error); }
.term-warn { color: var(--term-warn); }
.term-info { color: var(--term-info); }

@media (max-width: 768px) {
  .sidebar { position: fixed; left: -280px; top: 0; bottom: 0; z-index: 200; transition: left .2s; }
  .sidebar.open { left: 0; }
  .editor { padding: 30px 12px 100px; }
  .editor-inner { padding: 28px 20px; }
  .page-title { font-size: 32px; }
  .terminal-panel { left: 0; }
  .terminal-panel.open { height: 280px; }
}

<script>
// 兼容本地直接访问和 Nginx 子路径反代
const API_BASE = window.location.origin + window.location.pathname.replace(/\/$/, '');
let pages = JSON.parse(localStorage.getItem('notionBridgePages') || '[]');
let currentPageId = null;
let currentPanel = null;
let commandQuery = '';
let mentionQuery = '';
let selectedCommandIndex = 0;
let selectedMentionIndex = 0;

const COMMANDS = [

  { id: 'kimi', icon: '🌙', name: 'Kimi', desc: '调用 Kimi API' },

  { icon: '📜', name: '老子·道法自然', ipa: 'laozi' },
  { icon: '🔬', name: '墨子·逻辑实证', ipa: 'mozi' },
  { icon: '💼', name: '管仲·治理经济', ipa: 'guanzhong' },
  { icon: '🔴', name: '审计·三色熔炉', ipa: 'audit' },
];

const THEMES = [
  { id: 'theme-xuanji', label: '玄機閣' },
  { id: 'theme-cyber', label: '赛博龍魂' },
  { id: 'theme-minimal', label: '极简白纸' },
];

const WUXING_META = {

  '金': { name: '金·收敛', emoji: '⚜️', color: '#c9a227' },
  '水': { name: '水·流动', emoji: '💧', color: '#4a7c9c' },
};

const BAGUA_DESC = {
  '乾': '开天启问', '坤': '厚德载物', '震': '雷动变革',
  '巽': '风行渗透', '坎': '水险渊深', '离': '火光照物',
  '艮': '山止为界', '兑': '泽悦交流'
};

// Init
if (pages.length === 0) {
  newPage();
} else {
  loadPage(pages[0].id);
}
renderPageList();
updateStatus();
initTheme();
initCouncilMode();
initBaguaIndicator();

const modeSelect = document.getElementById('chatModeSelect');
if (modeSelect) {
  modeSelect.value = localStorage.getItem('notionBridgeChatMode') || 'auto';
  modeSelect.addEventListener('change', () => {
    localStorage.setItem('notionBridgeChatMode', modeSelect.value);
  });
}

function newPage() {
  const id = 'page_' + Date.now();
  const page = { id, title: '新对话', blocks: [], createdAt: new Date().toISOString() };
  pages.unshift(page);
  savePages();
  loadPage(id);
  renderPageList();
}

function loadPage(id) {
  currentPageId = id;
  showChat();
  const page = pages.find(p => p.id === id) || pages[0];
  document.getElementById('pageTitle').value = page.title;
  document.getElementById('breadcrumbTitle').textContent = page.title;
  renderBlocks(page.blocks);
  renderPageList();
  document.getElementById('chatInput').focus();
}

function savePages() {
  localStorage.setItem('notionBridgePages', JSON.stringify(pages));
}

function renderPageList() {
  const list = document.getElementById('pageList');
  list.innerHTML = pages.map(p => `
    <div class="page-item ${p.id === currentPageId && !currentPanel ? 'active' : ''}" onclick="loadPage('${p.id}')" oncontextmenu="deletePage(event,'${p.id}')">
      <span class="icon">${p.icon || '💬'}</span>
      <span class="title">${escapeHtml(p.title)}</span>
    </div>
  `).join('');
}

function renderBlocks(blocks) {
  const container = document.getElementById('blocks');
  if (blocks.length === 0) {
    container.innerHTML = `
      <div class="block" style="color:var(--text-tertiary);padding:24px 0;">
        <div class="block-handle">⋮⋮</div>
        <div class="block-content">
          <p>输入 <b>/</b> 启用法诀，例如：<b>/问卦</b> 求问、<b>/kimi</b> 借月之力、<b>/本地模型</b> 唤醒龍芯。</p>
          <p style="margin-top:10px">输入 <b>@</b> 请神人格，例如：@诸葛亮。</p>
        </div>
      </div>
    `;
    return;
  }
  container.innerHTML = blocks.map((b, i) => `
    <div class="block" data-index="${i}">
      <div class="block-handle">⋮⋮</div>
      <div class="block-content">${renderBlockContent(b)}</div>
    </div>
  `).join('');
  updateWordCount();
}

function renderBlockContent(block) {
  if (block.type === 'user') {
    return `<div class="user-message-content">${markdownToHtml(block.content)}</div>`;
  }

  if (block.type === 'ai') {
    return renderAiBlockContent(block);
  }

  return `<div class="ai-message-wrap"><div class="audit-white">${markdownToHtml(block.content)}</div></div>`;
}

function renderAiBlockContent(block) {
  const provider = block.provider || block.model_provider || 'auto';
  const model = block.model || block.model_name || '';
  const mode = block.mode || 'auto';
  const audit = block.audit_status || 'yellow';
  const auditEmoji = audit === 'green' ? '🟢' : audit === 'yellow' ? '🟡' : audit === 'red' ? '🔴' : '⚪';
  const auditClass = 'audit-' + audit;

  const fallback = Array.isArray(block.fallback_chain) && block.fallback_chain.length
    ? `<span class="fallback-chain" title="${escapeHtml(block.fallback_chain.map(c => `${c.provider || '?'}: ${c.reason || ''}`).join(' | '))}">🔁 ${block.fallback_chain.map(c => c.provider || '?').join(' → ')}</span>`
    : '';

  const isCouncil = Array.isArray(block.council_members) && block.council_members.length;
  let councilHtml = '';
  if (isCouncil) {
    const bagua = block.bagua_state || {};
    const members = block.council_members;
    const participated = members.filter(m => m.status === 'participated');
    const similarities = block.similarities || [];
    const similarityText = similarities.map(s => `${s.pair}: ${s.similarity}`).join(' · ');

    const wuxingBar = `<div class="wuxing-bar">` +
      members.map(m => {
        const meta = WUXING_META[m.role] || { name: m.role, emoji: '●' };
        const activeClass = m.status === 'participated' ? 'participated' : '';
        const title = `${meta.name} (${m.provider}/${m.model})\n权重 ${m.weight || 0}\n${m.status === 'participated' ? '参与本轮议事' : '补位委员'}`;
        return `<span class="wuxing-badge ${activeClass}" title="${escapeHtml(title)}">${meta.emoji} ${m.role} ${m.provider}</span>`;
      }).join('') +
      `</div>`;

    const synthesisDetails = members.map(m => {
      const meta = WUXING_META[m.role] || { name: m.role, emoji: '●' };
      return `<div class="member-reply"><span class="role">${meta.emoji} ${meta.name}</span> · ${m.provider}/${m.model}<br><span style="color:var(--text-secondary)">${escapeHtml(m.reply_preview || '')}</span></div>`;
    }).join('');

    councilHtml = `
      ${wuxingBar}
      <details class="synthesis-panel ${auditClass}">
        <summary>展开合成过程 · ${participated.length} 位委员 · 共识度 ${((block.consensus_score || 0) * 100).toFixed(0)}% · ${similarityText || '无相似度'}</summary>
        ${synthesisDetails}
      </details>
    `;
  }

  const bagua = block.bagua_state || {};
  const modeLabel = isCouncil
    ? `${bagua.emoji || '☰'} ${bagua.state || '乾'}·${BAGUA_DESC[bagua.state] || '启'}`
    : mode;

  return `
    <div class="ai-message-wrap">
      <div class="ai-model-badge">
        <span class="provider">${escapeHtml(provider)}</span>
        <span class="mode">${escapeHtml(modeLabel)}</span>
        <span style="color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;" title="${escapeHtml(model)}">${escapeHtml(model)}</span>
        ${fallback}
        <span class="audit-pill">${auditEmoji} 三色审计</span>
      </div>
      <div class="${auditClass}">${markdownToHtml(block.content)}</div>
      ${councilHtml}
    </div>
  `;
}

function markdownToHtml(md) {
  if (!md) return '';
  // 先转义
  let html = md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // 代码块（优先处理，避免内部被转义两次）
  const codeBlocks = [];
  html = html.replace(/```([\s\S]*?)```/g, (m, code) => {
    codeBlocks.push('<pre><code>' + code.replace(/^\n|\n$/g, '') + '</code></pre>');
    return '\u0000CODE' + (codeBlocks.length - 1) + '\u0000';
  });

  // 行内代码
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // 粗体 / 斜体 / 删除线 / 链接（在段落化之前处理）
  html = html.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  html = html.replace(/_([^_]+)_/g, '<em>$1</em>');
  html = html.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // 标题
  html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>');

  // 引用
  html = html.replace(/^&gt; (.*$)/gim, '<blockquote>$1</blockquote>');

  // 列表：把连续的多行合并为一个 ul/ol
  html = html.replace(/(^\- .+(\n|$))+/gim, m => '<ul>' + m.trim().split('\n').map(l => '<li>' + l.replace(/^\- /, '') + '</li>').join('') + '</ul>');
  html = html.replace(/(^\d+\. .+(\n|$))+/gim, m => '<ol>' + m.trim().split('\n').map(l => '<li>' + l.replace(/^\d+\. /, '') + '</li>').join('') + '</ol>');

  // 段落：非空行且不是标签开头 → 包成 p
  html = html.split('\n').map(line => {
    if (!line.trim()) return '';
    if (/^<(?:h[1-6]|ul|ol|blockquote|pre)\b/.test(line)) return line;
    return '<p>' + line + '</p>';
  }).join('\n');

  // 还原文代码块占位
  html = html.replace(/\u0000CODE(\d+)\u0000/g, (m, i) => codeBlocks[+i]);

  // 清理空 p
  html = html.replace(/<p><\/p>/g, '');

  return html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Input handling
const input = document.getElementById('chatInput');
input.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    await sendMessage(text);
    input.value = '';
    input.style.height = 'auto';
    hideMenus();
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (isCommandMenuVisible()) {
      e.preventDefault();
      navigateCommandMenu(e.key === 'ArrowDown' ? 1 : -1);
    } else if (isMentionMenuVisible()) {
      e.preventDefault();
      navigateMentionMenu(e.key === 'ArrowDown' ? 1 : -1);
    }
  } else if (e.key === 'Escape') {
    hideMenus();
  }
});

input.addEventListener('input', (e) => {
  const text = input.value;
  const cmdMatch = text.match(/\/(\w*)$/);
  const mentionMatch = text.match(/@(\w*)$/);
  if (cmdMatch) {
    commandQuery = cmdMatch[1].toLowerCase();
    showCommandMenu();
  } else if (mentionMatch) {
    mentionQuery = mentionMatch[1].toLowerCase();
    showMentionMenu();
  } else {
    hideMenus();
  }
  autoResize(input);
});

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

async function sendMessage(text) {
  const page = pages.find(p => p.id === currentPageId);
  page.title = document.getElementById('pageTitle').value || text.slice(0, 20) || '新对话';
  page.blocks.push({ type: 'user', content: text });
  savePages();
  renderBlocks(page.blocks);

  // Detect provider from slash command
  let provider = 'auto';
  let cleanText = text;
  const lower = text.toLowerCase();
  if (lower.startsWith('/kimi')) { provider = 'kimi'; cleanText = text.replace(/^\/?kimi\s*/i, ''); }
  else if (lower.startsWith('/local')) { provider = 'local'; cleanText = text.replace(/^\/?local\s*/i, ''); }
  else if (lower.startsWith('/deepseek')) { provider = 'deepseek'; cleanText = text.replace(/^\/?deepseek\s*/i, ''); }
  else if (lower.startsWith('/ask') || lower.startsWith('/问卦')) { cleanText = text.replace(/^\/?(ask|问卦)\s*/i, ''); }

  const routeMode = document.getElementById('chatModeSelect').value || 'auto';
  const useCouncil = isCouncilMode();

  // Loading
  const loadingId = 'loading_' + Date.now();
  page.blocks.push({ id: loadingId, type: 'loading', content: '' });
  renderBlocks(page.blocks);

  try {
    const payload = useCouncil
      ? { message: cleanText, mode: 'council', session_id: currentPageId, use_persona: true }
      : { message: cleanText, provider, mode: routeMode, session_id: currentPageId, use_persona: true };

    const res = await fetch(`${API_BASE}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    page.blocks = page.blocks.filter(b => b.id !== loadingId);

    if (useCouncil) {
      page.blocks.push({
        type: 'ai',
        content: data.reply || data.response || '[无回复]',
        provider: data.model_provider || 'council',
        model: data.model_name || 'wuxing-council-v1.0',
        mode: 'council',
        audit_status: data.audit_status || 'yellow',
        consensus_score: data.consensus_score || 0,
        bagua_state: data.bagua_state || {},
        council_members: data.council_members || [],
        synthesis_log: data.synthesis_log || {},
        similarities: data.similarities || [],
        fallback_chain: data.fallback_chain || []
      });
      refreshBaguaState();
    } else {
      page.blocks.push({
        type: 'ai',
        content: data.response || data.message || '[无回复]',
        provider: data.model_provider || provider,
        model: data.model_name || '',
        mode: data.mode || routeMode,
        audit_status: data.audit_status || 'yellow',
        fallback_chain: data.fallback_chain || []
      });
    }
  } catch (err) {
    page.blocks = page.blocks.filter(b => b.id !== loadingId);
    page.blocks.push({ type: 'ai', content: '请求失败：' + err.message, provider: 'error' });
  }
  savePages();
  renderBlocks(page.blocks);
  renderPageList();
  scrollToBottom();
}

  editor.scrollTop = editor.scrollHeight;
}

// Command menu
function showCommandMenu() {
  const menu = document.getElementById('commandMenu');
  const filtered = COMMANDS.filter(c => c.name.toLowerCase().includes(commandQuery) || c.id.includes(commandQuery));
  selectedCommandIndex = 0;
  menu.innerHTML = filtered.map((c, i) => `
    <div class="command-item ${i === 0 ? 'active' : ''}" data-index="${i}" data-id="${c.id}" onclick="applyCommand('${c.id}')">
      <div class="cmd-icon">${c.icon}</div>
      <div class="cmd-info">
        <div class="cmd-name">${escapeHtml(c.name)}</div>
        <div class="cmd-desc">${escapeHtml(c.desc)}</div>
      </div>
    </div>
  `).join('');
  menu.classList.add('show');
}

function hideCommandMenu() {
  document.getElementById('commandMenu').classList.remove('show');
}

function isCommandMenuVisible() {
  return document.getElementById('commandMenu').classList.contains('show');
}

function navigateCommandMenu(dir) {
  const items = document.querySelectorAll('.command-item');
  if (!items.length) return;
  items[selectedCommandIndex]?.classList.remove('active');
  selectedCommandIndex = (selectedCommandIndex + dir + items.length) % items.length;
  items[selectedCommandIndex]?.classList.add('active');
}

function applyCommand(id) {
  const cmd = COMMANDS.find(c => c.id === id);
  if (!cmd) return;
  const input = document.getElementById('chatInput');
  const text = input.value;
  const newText = text.replace(/\/(\w*)$/, '/' + cmd.id + ' ');
  input.value = newText;
  input.focus();
  hideMenus();
  if (['h1','h2','code'].includes(id)) {
    insertFormatBlock(id);
  }
}

function insertFormatBlock(type) {
  const page = pages.find(p => p.id === currentPageId);
  const prefix = type === 'h1' ? '# ' : type === 'h2' ? '## ' : '```\n\n```';
  page.blocks.push({ type: 'user', content: prefix });
  savePages();
  renderBlocks(page.blocks);
}

// Mention menu
function showMentionMenu() {

  const filtered = PERSONAS.filter(p => p.name.toLowerCase().includes(mentionQuery) || p.ipa.includes(mentionQuery));
  selectedMentionIndex = 0;
  menu.innerHTML = filtered.map((p, i) => `
    <div class="mention-item ${i === 0 ? 'active' : ''}" data-index="${i}" onclick="applyMention('${p.name}')">
      <span>${p.icon}</span>
      <span>${escapeHtml(p.name)}</span>

}

function hideMentionMenu() {
  document.getElementById('mentionMenu').classList.remove('show');
}

function isMentionMenuVisible() {
  return document.getElementById('mentionMenu').classList.contains('show');
}

function navigateMentionMenu(dir) {
  const items = document.querySelectorAll('.mention-item');
  if (!items.length) return;
  items[selectedMentionIndex]?.classList.remove('active');
  selectedMentionIndex = (selectedMentionIndex + dir + items.length) % items.length;
  items[selectedMentionIndex]?.classList.add('active');
}

function applyMention(name) {
  const input = document.getElementById('chatInput');
  input.value = input.value.replace(/@(\w*)$/, '@' + name + ' ');
  input.focus();
  hideMenus();
}

function hideMenus() {

}

// ============================================================
let terminalOpen = false;
let terminalCwd = '/opt/longhun-system';
let terminalHistory = [];
let terminalHistoryIndex = -1;
const ANSI_COLORS = {
  '30': '#2c241b', '31': '#b93a32', '32': '#4a7c59', '33': '#c9a227',
  '34': '#4a6fa5', '35': '#8b5a7c', '36': '#5a8b8b', '37': '#5c4d3c',
  '90': '#8a7b68', '91': '#e0665c', '92': '#6ab77a', '93': '#e8c84d',
  '94': '#6a9ae6', '95': '#c77db8', '96': '#6ac4c4', '97': '#f8f4e8'
};

function toggleTerminal() {
  terminalOpen = !terminalOpen;
  const panel = document.getElementById('terminalPanel');
  panel.classList.toggle('open', terminalOpen);
  if (terminalOpen) {
    document.getElementById('terminalInput').focus();
    if (!document.getElementById('terminalBody').children.length) {
      appendTerminal('system', '龍魂终端已连接 · 白名单命令 + 项目目录内执行 · 按 ↑↓ 翻看历史');
      updateTerminalCwd();
    }
  }
}

function setTerminalTheme(theme) {
  const panel = document.getElementById('terminalPanel');
  panel.classList.remove('terminal-theme-paper', 'terminal-theme-green', 'terminal-theme-dark');
  panel.classList.add('terminal-theme-' + theme);
  document.querySelectorAll('.terminal-tool-btn[data-theme]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === theme);
  });
  localStorage.setItem('notionBridgeTerminalTheme', theme);
}

function clearTerminal() {
  document.getElementById('terminalBody').innerHTML = '';
}

function appendTerminal(type, text) {
  const body = document.getElementById('terminalBody');
  const line = document.createElement('div');
  line.className = 'term-line';
  if (type === 'command') {
    line.innerHTML = `<span class="terminal-prompt">$</span> <span class="term-info">${escapeHtml(text)}</span>`;
  } else if (type === 'error') {
    line.innerHTML = `<span class="term-error">${escapeHtml(text)}</span>`;
  } else if (type === 'system') {
    line.innerHTML = `<span class="term-warn"># ${escapeHtml(text)}</span>`;
  } else {
    line.innerHTML = ansiToHtml(text);
  }
  body.appendChild(line);
  body.scrollTop = body.scrollHeight;
}

function ansiToHtml(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/\x1b\[0?m/g, '</span>');
  html = html.replace(/\x1b\[(\d+)m/g, (match, code) => {
    const color = ANSI_COLORS[code];
    if (color) return `</span><span style="color:${color}">`;
    return '';
  });
  html = html.replace(/\n/g, '<br>');
  return `<span>${html}</span>`;
}

function updateTerminalCwd() {
  document.getElementById('terminalCwd').textContent = terminalCwd;
  document.getElementById('terminalPrompt').textContent = terminalCwd.replace('/opt/longhun-system', '~') + ' $';
}

async function runTerminalCommand(cmd) {
  if (!cmd.trim()) return;
  terminalHistory.push(cmd);
  terminalHistoryIndex = terminalHistory.length;
  appendTerminal('command', cmd);
  const input = document.getElementById('terminalInput');
  input.value = '';
  input.style.height = 'auto';

  try {
    const res = await fetch(`${API_BASE}/api/terminal/exec?${new URLSearchParams({ cmd, cwd: terminalCwd, timeout: '30' })}`);
    const data = await res.json();
    if (data.cwd) terminalCwd = data.cwd;
    updateTerminalCwd();
    if (data.ok) {
      appendTerminal('output', data.output || '(无输出)');
    } else {
      appendTerminal('error', data.output || '执行失败');
    }
  } catch (err) {
    appendTerminal('error', '网络错误：' + err.message);
  }
}

const terminalInput = document.getElementById('terminalInput');
terminalInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    runTerminalCommand(terminalInput.value);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (terminalHistoryIndex > 0) {
      terminalHistoryIndex--;
      terminalInput.value = terminalHistory[terminalHistoryIndex];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (terminalHistoryIndex < terminalHistory.length - 1) {
      terminalHistoryIndex++;
      terminalInput.value = terminalHistory[terminalHistoryIndex];
    } else {
      terminalHistoryIndex = terminalHistory.length;
      terminalInput.value = '';
    }
  }
});
terminalInput.addEventListener('input', () => autoResize(terminalInput));

// 恢复终端主题
const savedTerminalTheme = localStorage.getItem('notionBridgeTerminalTheme') || 'paper';
setTerminalTheme(savedTerminalTheme);
</script>
