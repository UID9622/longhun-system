<script>
(function() {
  'use strict';

  // ── 配置 ──
  const CONFIG = {
    // 🔧 修改为实际API地址：同域用 '/api'，跨域用 'https://uid9622.cn/api'
    API_BASE: '/api',
    // API版本前缀
    API_PREFIX: '/v1/li',
    // 是否启用流式
    USE_STREAM: true,
    // 流式失败回退到普通模式
    STREAM_FALLBACK: true,
  };

  // ── DOM ──
  const $ = (sel) => document.querySelector(sel);
  const root = $('#lh-ai-root');
  const toggleBtn = $('#lh-toggle-btn');
  const panel = $('#lh-panel');
  const closeBtn = $('#lh-close-btn');
  const messagesEl = $('#lh-messages');
  const welcomeEl = $('#lh-welcome');
  const inputEl = $('#lh-input');
  const sendBtn = $('#lh-send-btn');
  const personaSelect = $('#lh-persona-select');
  const badgeEl = $('#lh-badge');

  // ── 状态 ──
  let isOpen = false;
  let isTyping = false;
  let sessionId = localStorage.getItem('lh_chat_sid') || genId();
  localStorage.setItem('lh_chat_sid', sessionId);

  function genId() { return 's' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function fmtContent(text) {
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }

  // ── 面板控制 ──
  function openPanel() {
    isOpen = true;
    panel.classList.add('open');
    badgeEl.style.display = 'none';
    inputEl.focus();
    // 如果欢迎信息还在，初始化
  }

  function closePanel() {
    isOpen = false;
    panel.classList.remove('open');
  }

  function togglePanel() {
    isOpen ? closePanel() : openPanel();
  }

  toggleBtn.addEventListener('click', togglePanel);
  closeBtn.addEventListener('click', closePanel);

  // Esc 关闭
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isOpen) { closePanel(); }
  });

  // ── 消息渲染 ──
  function addMsg(text, role, meta={}) {
    if (welcomeEl) welcomeEl.style.display = 'none';

    const div = document.createElement('div');
    div.className = 'lh-msg ' + role;

    let inner = '';

    if (role === 'bot') {
      if (meta.persona) {
        inner += `<span class="lh-persona-tag">🧠 ${esc(meta.persona)}</span>`;
      }
      inner += `<div class="lh-msg-content">${fmtContent(text)}</div>`;
      if (meta.dna) {
        inner += `<span class="lh-dna-tag">🧬 ${esc(meta.dna)}</span>`;
      }
      if (meta.kbUsed > 0) {
        inner += `<span class="lh-kb-tag">📚 引用 ${meta.kbUsed} 个知识源</span>`;
      }
      if (meta.timeMs) {
        inner += `<span class="lh-ts">${meta.timeMs}ms · ${meta.model || ''}</span>`;
      }
    } else {
      inner += `<div class="lh-msg-content">${fmtContent(text)}</div>`;
    }

    div.innerHTML = inner;
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function addLoading() {
    if (welcomeEl) welcomeEl.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'lh-msg bot';
    div.id = 'lh-typing-msg';
    div.innerHTML = '<div class="lh-typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function removeLoading() {
    const el = document.getElementById('lh-typing-msg');
    if (el) el.remove();
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── API调用 ──
  function apiUrl(path) {
    return CONFIG.API_BASE + CONFIG.API_PREFIX + path;
  }

  async function callChatApi(message, persona) {
    const resp = await fetch(apiUrl('/chat'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: message,
        persona: persona || null,
        session_id: sessionId,
      }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: 'Network error' }));
      throw new Error(err.detail || `HTTP ${resp.status}`);
    }
    return resp.json();
  }

  async function callStreamApi(message, persona, onChunk, onDone) {
    const resp = await fetch(apiUrl('/chat/stream'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: message,
        persona: persona || null,
        session_id: sessionId,
      }),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.chunk) onChunk(data.chunk);
            if (data.meta) onChunk(null, data.meta);
            if (data.done) { onDone(data); return; }
            if (data.error) throw new Error(data.error);
          } catch(e) {
            if (e.message && !e.message.includes('JSON')) throw e;
          }
        }
      }
    }
    onDone({});
  }

  // ── 发送消息 ──
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isTyping) return;
    isTyping = true;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    // 显示用户消息
    addMsg(text, 'user');

    if (CONFIG.USE_STREAM) {
      // 流式模式
      const loadingEl = addLoading();
      let fullText = '';
      let meta = {};
      let streamFailed = false;
      let currentMsgEl = null;

      try {
        await callStreamApi(text, personaSelect.value,
          (chunk, metaData) => {
            if (metaData) { meta = metaData; return; }
            if (chunk) {
              if (!currentMsgEl) {
                removeLoading();
                currentMsgEl = addMsg('', 'bot', {
                  persona: meta.persona,
                  kbUsed: meta.knowledge_count || 0,
                });
              }
              fullText += chunk;
              // 更新内容
              const contentEl = currentMsgEl.querySelector('.lh-msg-content');
              if (contentEl) contentEl.innerHTML = fmtContent(fullText);
              scrollBottom();
            }
          },
          (doneData) => {
            if (!currentMsgEl && !fullText) {
              // 没收到任何chunk
              removeLoading();
              streamFailed = true;
            } else if (currentMsgEl) {
              // 补齐DNA和时间
              if (doneData.dna || doneData.time_ms) {
                const dnaEl = currentMsgEl.querySelector('.lh-dna-tag');
                if (dnaEl && doneData.dna) dnaEl.textContent = '🧬 ' + doneData.dna;
                const tsEl = currentMsgEl.querySelector('.lh-ts');
                if (tsEl && doneData.time_ms) tsEl.textContent = doneData.time_ms + 'ms';
              }
            }
          }
        );
      } catch(e) {
        streamFailed = true;
        removeLoading();
      }

      if (streamFailed && CONFIG.STREAM_FALLBACK) {
        // 回退普通模式
        try {
          addLoading();
          const data = await callChatApi(text, personaSelect.value);
          removeLoading();
          addMsg(data.reply, 'bot', {
            persona: data.persona,
            dna: data.dna,
            kbUsed: data.knowledge_used || 0,
            timeMs: data.time_ms,
            model: data.model,
          });
        } catch(e2) {
          removeLoading();
          addMsg('⚠️ 龍魂引擎暂时无法响应。请稍后再试。', 'bot');
        }
      } else if (streamFailed) {
        addMsg('⚠️ 流式连接异常，已重试。', 'bot');
      }
    } else {
      // 普通模式
      addLoading();
      try {
        const data = await callChatApi(text, personaSelect.value);
        removeLoading();
        addMsg(data.reply, 'bot', {
          persona: data.persona,
          dna: data.dna,
          kbUsed: data.knowledge_used || 0,
          timeMs: data.time_ms,
          model: data.model,
        });
      } catch(e) {
        removeLoading();
        addMsg('⚠️ ' + (e.message || '连接失败，请稍后再试。'), 'bot');
      }
    }

    isTyping = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  // ── 事件绑定 ──
  sendBtn.addEventListener('click', sendMessage);

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // 自适应高度
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // 快捷提问
  if (welcomeEl) {
    welcomeEl.addEventListener('click', (e) => {
      const cap = e.target.closest('[data-prompt]');
      if (cap) {
        inputEl.value = cap.dataset.prompt;
        sendMessage();
      }
    });
  }

  // 如果从未打开过，首次不自动弹出，只显示小红点
  if (!localStorage.getItem('lh_chat_opened')) {
    badgeEl.style.display = 'block';
  }

  toggleBtn.addEventListener('click', () => {
    localStorage.setItem('lh_chat_opened', '1');
  });

  // ── 调试接口 ──
  window.lhAI = {
    config: CONFIG,
    sessionId,
    open: openPanel,
    close: closePanel,
    send: (msg) => { inputEl.value = msg; sendMessage(); },
  };

  console.log('🐉 龍魂官网AI助手 v3.0 已就绪');
  console.log('   📡 API:', CONFIG.API_BASE + CONFIG.API_PREFIX);
  console.log('   🔑 Session:', sessionId);
  console.log('   🌊 Stream:', CONFIG.USE_STREAM ? 'ON' : 'OFF');
  console.log('   🧠 Personas:', ['generalist', 'auditor', 'coder', 'philosopher', 'guardian', 'teacher'].join(', '));
  console.log('   💡 lhAI.send("提问内容") 可编程调用');
})();
</script>
