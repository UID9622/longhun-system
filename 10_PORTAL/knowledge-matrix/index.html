// ═══════════════════
// Router
// ═══════════════════
let currentRoute = 'home';
let currentSkillId = null;
let currentCat = 'all';
let currentTab = 'usage';

function navigate(route) {
  currentRoute = route;
  // Parse route
  if (route === 'home') {
    currentSkillId = null; currentCat = 'all';
  } else if (route.startsWith('skill/')) {
    currentSkillId = route.replace('skill/','');
  } else if (route.startsWith('category/')) {
    currentCat = route.replace('category/','');
  } else if (route === 'api') {
    // just api page
  }
  // Update browser URL hash so back/forward works
  if (window.location.hash !== '#'+route) {
    history.pushState(null,'','#'+route);
  }
  render();
  window.scrollTo(0,0);
}

// Handle browser back/forward
window.addEventListener('popstate', ()=>{
  const hash = window.location.hash.replace('#','') || 'home';
  currentRoute = hash;
  if (hash==='home') { currentSkillId=null; currentCat='all'; }
  else if (hash.startsWith('skill/')) currentSkillId = hash.replace('skill/','');
  else if (hash.startsWith('category/')) currentCat = hash.replace('category/','');
  render();
  window.scrollTo(0,0);
});

function doSearch(q) {
  if (!q || q.length < 1) {
    if (currentRoute === 'search') navigate('home');
    return;
  }
  currentRoute = 'search';
  currentSearchQuery = q;
  render();
}
let currentSearchQuery = '';

function getSkill(id) { return SKILLS.find(s=>s.id===id); }

// ═══════════════════
// Render
// ═══════════════════
function render() {
  updateNavButtons();
  updateBreadcrumb();

  const mc = document.getElementById('main-content');
  const r = currentRoute;

  if (r === 'home') renderHome(mc);
  else if (r.startsWith('skill/')) renderSkillDetail(mc, currentSkillId);
  else if (r.startsWith('category/')) renderCategory(mc, currentCat);
  else if (r === 'api') renderAPI(mc);
  else if (r === 'search') renderSearch(mc, currentSearchQuery);
  else renderHome(mc);
}

function updateNavButtons() {
  document.querySelectorAll('#topbar-btns button').forEach(b=>b.classList.remove('active'));
  const r = currentRoute;
  if (r==='home') document.getElementById('nav-home')?.classList.add('active');
  else if (r.startsWith('category/')) document.getElementById('nav-cat')?.classList.add('active');
  else if (r==='api') document.getElementById('nav-api')?.classList.add('active');
}

function updateBreadcrumb() {
  const b = document.getElementById('breadcrumb');
  let html = `<a href="javascript:navigate('home')">🏠 首页</a>`;
  const r = currentRoute;
  if (r.startsWith('skill/')) {
    const s = getSkill(currentSkillId);
    html += ` <span class=sep>›</span> <a href="javascript:navigate('category/${encodeURIComponent(s?.cat||'all')}')">${s?.cat||'技能'}</a>`;
    html += ` <span class=sep>›</span> <span class=current>${s?.name||currentSkillId}</span>`;
  } else if (r.startsWith('category/')) {
    html += ` <span class=sep>›</span> <span class=current>${currentCat==='all'?'全部分类':currentCat}</span>`;
  } else if (r==='api') {
    html += ` <span class=sep>›</span> <span class=current>API文档</span>`;
  } else if (r==='search') {
    html += ` <span class=sep>›</span> <span class=current>搜索: ${currentSearchQuery}</span>`;
  }
  b.innerHTML = html;
}

        <td><code>${a.host}</code></td>

    });
    html += `</tbody></table>`;
  });

  html += `<div class="info-box" style="margin-top:20px">
    <strong>📌 调用说明：</strong>
    所有内部API通过 <code>https://uid9622.cn/api/...</code> 经由Nginx反向代理访问（公网），
    或直接 <code>127.0.0.1:PORT</code> 访问（鲲鹏本地）。外网不可直连本地端口。
  </div>`;

  mc.innerHTML = html;
}

// ── SEARCH ──
function renderSearch(mc, q) {
  const lower = q.toLowerCase();
  const results = SKILLS.filter(s=>
    s.name.toLowerCase().includes(lower) ||
    s.desc.toLowerCase().includes(lower) ||
    s.tags.some(t=>t.toLowerCase().includes(lower)) ||
    s.cat.toLowerCase().includes(lower) ||
    (s.cmd||'').toLowerCase().includes(lower)
  );

  let html = `<h2 style="color:var(--gold)">🔍 搜索: "${q}"</h2>
    <p style="color:var(--text-dim);margin-bottom:16px">找到 ${results.length} 个结果</p>`;

  if (results.length===0) {
    html += `<div class="empty"><div class="icon">🔍</div>未找到匹配的技能/引擎</div>`;
  } else {
    html += `<div class="cards-grid">`;
    results.forEach(s=>{
      // Highlight match in desc
      let desc = s.desc;
      if (lower.length>0) {
        const re = new RegExp(`(${escapeRegex(lower)})`,'gi');
        desc = desc.replace(re, '<mark style="background:var(--gold);color:#000;padding:0 2px">$1</mark>');
      }
      html += `<div class="card" onclick="navigate('skill/${s.id}')">
        <span class="card-cat">${s.cat}</span>
        <div class="card-title">${s.name}</div>
        <div class="card-desc">${desc.substring(0,120)}…</div>
        <div class="card-meta">${s.tags.map(t=>`<span class="badge badge-blue">${t}</span>`).join('')}</div>
      </div>`;
    });
    html += `</div>`;
  }
  mc.innerHTML = html;
}

// ── Helpers ──
function switchTab(btn, tabId, skillId) {
  const parent = btn.parentElement.parentElement;
  parent.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  parent.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  const tab = document.getElementById(tabId);
  if (tab) tab.classList.add('active');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

// ── Init ──
function init() {
  const initHash = window.location.hash.replace('#','') || 'home';
  currentRoute = initHash;
  if (initHash==='home'){currentSkillId=null;currentCat='all';}
  else if (initHash.startsWith('skill/')) currentSkillId=initHash.replace('skill/','');
  else if (initHash.startsWith('category/')) currentCat=initHash.replace('category/','');
  render();
}
window.addEventListener('DOMContentLoaded', init);
</script>
