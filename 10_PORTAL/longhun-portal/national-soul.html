<!-- 誓言墙 -->
<h2 class="section-title">🏮 孔明灯墙</h2>
<p class="section-subtitle" id="wall-subtitle">0 人已接力誓言</p>
<div class="vow-wall" id="vow-wall"></div>

<script>
// ── 初始化 ──
const STORAGE_KEY = 'longhun_national_soul_vows';
let vows = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

// ── 三色审计函数 ──
function tricolorAudit(name, text, uid) {
  const trimmed = text.trim();
  const len = trimmed.length;
  const nameLen = name.trim().length;

  // 🔴 拒绝规则
  const redPatterns = [
    { test: len < 4, reason: '誓言过短（≥4字）' },
    { test: len > 500, reason: '誓言过长（≤500字）' },
    { test: /(.)\1{8,}/.test(trimmed), reason: '无意义重复字符' },
    { test: /[〈〈〈|※※※].{0,50}[※※※|》》》]/.test(trimmed), reason: '不文明用语' },
    { test: /[\u4e00-\u9fff]/.test(trimmed) && nameLen < 1, reason: '姓名不能为空' },
  ];
  for (const r of redPatterns) {
    if (r.test) return { status: 'BLOCK', emoji: '🔴', r_score: 30, reason: r.reason };
  }

  // 🟡 审查规则
  let yellowScore = 0;
  if (/1[3-9]\d{9}/.test(trimmed)) yellowScore += 20;  // 手机号
  if (/@/.test(trimmed)) yellowScore += 15;              // 邮箱
  if (/[a-zA-Z]/.test(trimmed) && trimmed.length > 20) {
    const enRatio = (trimmed.match(/[a-zA-Z\s]/g) || []).length / trimmed.length;
    if (enRatio > 0.5) yellowScore += 20;
  }
  if (uid && !/^UID\d{4,8}$/i.test(uid)) yellowScore += 15;
  if (/!{2,}|？{2,}|哈{3,}|啊{3,}/.test(trimmed)) yellowScore += 10;

  // 六维评分
  const diversity = new Set(trimmed).size / Math.max(len, 1);
  const humanWelfare = Math.min(95, Math.round(75 + diversity * 20 - (yellowScore > 0 ? 10 : 0)));
  const fairness = Math.min(95, Math.round(80 + (nameLen > 0 ? 5 : 0)));
  const controllability = Math.min(95, Math.round(85 - (yellowScore > 0 ? 10 : 0)));
  const transparency = 85;
  const traceability = uid ? 90 : 75;
  const privacy = Math.min(95, Math.round(90 - (yellowScore > 0 ? 15 : 0)));

  const r = Math.round(
    humanWelfare * 0.20 + fairness * 0.20 + controllability * 0.15 +
    transparency * 0.15 + traceability * 0.15 + privacy * 0.15
  );

  if (r >= 85) return { status: 'SAFE', emoji: '🟢', r_score: r };
  if (r >= 60) return { status: 'REVIEW', emoji: '🟡', r_score: r, reason: yellowScore > 0 ? '需人工终审' : '存疑内容' };
  return { status: 'BLOCK', emoji: '🔴', r_score: r, reason: 'R值过低' };
}

// ── 提交誓言 ──
function submitVow() {
  const name = document.getElementById('vow-name').value.trim();
  const uid = document.getElementById('vow-uid').value.trim();
  const location = document.getElementById('vow-location').value.trim();
  const text = document.getElementById('vow-text').value.trim();
  const result = document.getElementById('audit-result');

  if (!text) { result.textContent = '⚠️ 请填写誓言内容'; result.className = 'audit-result show red'; return; }

  const audit = tricolorAudit(name, text, uid);

  // 审计结果
  let html = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
    <span style="font-size:2rem">${audit.emoji}</span>
    <div><strong>R = ${audit.r_score}</strong><br>${audit.status === 'SAFE' ? '🟢 通过 · 自动入碑' : audit.status === 'REVIEW' ? '🟡 待终审 · 人工复核' : '🔴 拒绝 · ' + (audit.reason || '')}</div>
  </div>`;

  if (audit.status === 'BLOCK') {
    result.innerHTML = html;
    result.className = 'audit-result show red';
    return;
  }

  // 保存
  const vow = {
    id: 'VOW-' + Date.now().toString(36),
    name: name || '匿名',
    uid: uid || '',
    location: location || '',
    text: text,
    audit: audit,
    timestamp: new Date().toISOString(),
  };
  vows.push(vow);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(vows));

  html += `<div style="color:var(--gold-light);margin-top:8px">${audit.emoji === '🟢' ? '✅ 誓言已入碑' : '📨 已提交待终审'}</div>`;
  result.innerHTML = html;
  result.className = `audit-result show ${audit.status === 'SAFE' ? 'green' : 'yellow'}`;

  document.getElementById('vow-text').value = '';
  renderVows();
}

// ── 渲染誓言墙 ──
function renderVows() {
  const wall = document.getElementById('vow-wall');
  const safe = vows.filter(v => v.audit.status === 'SAFE');
  wall.innerHTML = safe.length === 0
    ? '<p style="text-align:center;color:var(--text-muted);grid-column:1/-1;padding:60px 0">🍃 尚未有人留下誓言 · 你是第一个</p>'
    : safe.map(v => `<div class="vow-card">
      <div class="vow-text">"${v.text}"</div>
      <div class="vow-meta">
        <span>${v.name}${v.location ? ' · ' + v.location : ''}</span>
        <span class="tricolor-badge tricolor-green">🟢 R=${v.audit.r_score}</span>
      </div>
    </div>`).join('');

  // 统计
  const total = vows.length;
  const safeCount = safe.length;
  const reviewCount = vows.filter(v => v.audit.status === 'REVIEW').length;
  const blockedCount = vows.filter(v => v.audit.status === 'BLOCK').length;
  document.getElementById('count-total').textContent = total;
  document.getElementById('count-safe').textContent = safeCount;
  document.getElementById('count-review').textContent = reviewCount;
  document.getElementById('count-blocked').textContent = blockedCount;
  document.getElementById('wall-subtitle').textContent = `${safeCount} 人已接力誓言`;
}

// ── 导出待终审 ──
function exportVows() {
  const pending = vows.filter(v => v.audit.status === 'REVIEW');
  if (pending.length === 0) { alert('暂无待终审誓言'); return; }
  const blob = new Blob([JSON.stringify(pending, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const now = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
  a.href = URL.createObjectURL(blob);
  a.download = `national-soul-vows-audit-${now}.json`;
  a.click();
}

// ── 清空 ──
function clearVows() {
  if (!confirm('确定清空所有誓言？（仅测试用）')) return;
  vows = [];
  localStorage.removeItem(STORAGE_KEY);
  renderVows();
}

// ── 字数统计 ──
document.getElementById('vow-text').addEventListener('input', function() {
  document.getElementById('vow-count').textContent = this.value.length;
});

// ── 初始渲染 ──
renderVows();

// ── 关闭导航 ──
document.querySelectorAll('.nav-links a').forEach(a => {
  a.addEventListener('click', () => document.querySelector('.nav-links').classList.remove('open'));
});
</script>
