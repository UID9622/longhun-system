<script>
const bottomLines = [
  { id:1, name:'德在技术前', question:'这个功能在帮人还是在收割人?' },
  { id:2, name:'路径对齐', question:'产出文件是否在正确位置？' },
  { id:3, name:'不让付出者寒心', question:'系统设计是否让奉献者吃亏？' },
  { id:4, name:'信息主权不可让渡', question:'数据有没有流向平台？' },
  { id:5, name:'外化内不化', question:'底座是否被改动？369不动点是否完整？' },
];

async function runScan() {
  document.getElementById('main-content').innerHTML = '<div class="loading"><div class="spin" style="font-size:40px;">⚙️</div><div>扫描中...</div></div>';
  // 模拟扫描 — 实际通过API或本地脚本执行
  setTimeout(() => renderResults(mockResults()), 800);
}

async function runIntegrated() {
  document.getElementById('main-content').innerHTML = '<div class="loading"><div class="spin" style="font-size:40px;">⚙️</div><div>五引擎集成扫描中...</div></div>';
  setTimeout(() => renderResults(mockIntegratedResults()), 1200);
}

function mockResults() {
  return {
    overall:'🟢',
    lines:[
      { status:'🟢', verdict:'德在技术前 — 通过', issues:[] },
      { status:'🟡', verdict:'发现3组同名文件', issues:[
        {file:'bin/browser_miner.py', sev:'🟡', label:'与_archive重复'},

      ]},
      { status:'🟢', verdict:'不让付出者寒心 — 通过', issues:[] },
      { status:'🟢', verdict:'信息主权不可让渡 — 通过 (境内合规)', issues:[] },
      { status:'🟢', verdict:'外化内不化 — 底座稳固', issues:[] },
    ]
  };
}

function mockIntegratedResults() {
  return {
    overall:'🟢',
    lines:[
      { status:'🟢', verdict:'德在技术前 — 通过 (扫描342文件，0红线)', issues:[] },
      { status:'🟡', verdict:'路径对齐 — 3组同名，1组已白名单', issues:[
        {file:'engines/lh_team_orchestrator.py', sev:'🟡', label:'collaboration/别名·白名单'},
      ]},
      { status:'🟢', verdict:'不让付出者寒心 — 通过 (零寒心叙事)', issues:[] },
      { status:'🟢', verdict:'信息主权不可让渡 — 通过 (数据全本地)', issues:[] },
      { status:'🟢', verdict:'外化内不化 — P0文件完整·369安在', issues:[] },
    ]
  };
}

function renderResults(data) {
  const indicatorCls = {'🟢':'indicator-green','🟡':'indicator-yellow','🔴':'indicator-red'};
  const icon = {'🟢':'✅','🟡':'⚠️','🔴':'🚨'};

  const linesHTML = bottomLines.map((bl,i) => {
    const r = data.lines[i] || {status:'🟡',verdict:'未扫描',issues:[]};
    return `
      <div class="card bottom-line">
        <div class="indicator ${indicatorCls[r.status]||'indicator-yellow'}">${icon[r.status]||'❓'}</div>
        <div class="line-name">底线${bl.id}: ${bl.name}</div>
        <div class="line-question">${bl.question}</div>
        <div class="line-verdict" style="color:${r.status==='🟢'?'var(--green)':r.status==='🔴'?'var(--red)':'var(--yellow)'}">
          ${r.verdict}
        </div>
      </div>
    `;
  }).join('');

  const hasRed = data.lines.some(l => l.status==='🔴');
  const hasYellow = data.lines.some(l => l.status==='🟡');
  const overall = hasRed?'🔴':hasYellow?'🟡':'🟢';
  const bannerCls = hasRed?'banner-red':hasYellow?'banner-yellow':'banner-green';

  const allIssues = data.lines.flatMap((l,i) =>
    (l.issues||[]).map(iss => ({...iss, lineName:bottomLines[i].name}))
  );

  document.getElementById('main-content').innerHTML = `
    <div class="overall-banner ${bannerCls}">
      总体判定: ${overall} — ${hasRed?'触碰红线！发布前必须修复':hasYellow?'有警告·建议人工审查':'五条底线全部通过'}
    </div>

    <div class="grid-5">${linesHTML}</div>

    ${allIssues.length>0?`
    <div class="card card-full">
      <h3>📋 问题清单 (${allIssues.length}条)</h3>
      <div class="issue-list">
        ${allIssues.map(iss => `
          <div class="issue-item">
            <span style="font-weight:bold;">${iss.sev}</span>
            <span style="font-size:11px;color:var(--text-dim)">[${iss.lineName}]</span>
            <span class="issue-file">${iss.file||'-'}</span>
            <span class="issue-label">${iss.label||''}</span>
          </div>
        `).join('')}
      </div>
    </div>`:`
    <div class="card card-full" style="text-align:center;padding:40px;">
      <div style="font-size:48px;color:var(--green);">✅</div>
      <div style="color:var(--green);margin-top:8px;">五条底线全部通过，可以发布</div>
    </div>`}

    <div class="timestamp">扫描时间: ${new Date().toLocaleString()}</div>
  `;
}

                if (!badge || !detail) return;
                
                if (data.status === 'alive') {
                    badge.textContent = '🟢 生态内';
                    badge.className = 'lh-status-badge lh-status-alive';
                    detail.innerHTML = '验证有效 · 到期: ' + (data.expiry || '—') + '<br>剩余: ' + (data.days_left || 0) + '天';
                    // 生态内不弹窗
                } else if (data.status === 'builder') {
                    badge.textContent = '⚪ 共建者';
                    badge.className = 'lh-status-badge lh-status-builder';
                    detail.innerHTML = '连续12月+ · 生态内全功能 + 治理投票';

                    badge.textContent = '🟡 生态外';
                    badge.className = 'lh-status-badge lh-status-expired';

                }
            })
            .catch(function() {
                // API不可达时不弹窗
            });
    }
    
    // 页面加载后2秒检查
    setTimeout(fetchStatus, 2000);
    
    // 暴露全局函数
    window.lhEcoRenew = function() {
        fetch(API_BASE + '/renew', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({uid: 'UID9622'}) })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.qr_code || data.payment_url) {
                    window.open(data.payment_url || data.qr_code, '_blank');
                }
                if (popup) popup.classList.remove('active');
                setTimeout(fetchStatus, 3000);
            });
    };
    window.lhEcoClose = function() {
        if (popup) popup.classList.remove('active');
    };
})();
</script>

                    window.open(data.payment_url || data.qr_code, '_blank');
                }
                if (popup) popup.classList.remove('active');
                setTimeout(fetchStatus, 3000);
            });
    };
    window.lhEcoClose = function() {
        if (popup) popup.classList.remove('active');
    };
})();
</script>
<!-- /龍魂生态准入弹窗 -->
</body>
</html>
