const starsGeo = new THREE.BufferGeometry();
const starCount = 2000;

for (let i = 0; i < starCount; i++) {

const helixPoints = 200;
function makeHelix(sign, colorHex) {
  const pts = [];
  for (let i = 0; i < helixPoints; i++) {
    const t = i / (helixPoints - 1);
    const θ = t * Math.PI * 6 * sign;
    const r = 1.7;
    const y = (t - 0.5) * 5.5;
    pts.push(new THREE.Vector3(Math.cos(θ)*r, y, Math.sin(θ)*r));

  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 160, 0.04, 8, false);
  const mat = new THREE.MeshPhongMaterial({
    color: colorHex, emissive: colorHex, emissiveIntensity: 0.4,
    transparent: true, opacity: 0.75
  });
  return new THREE.Mesh(geo, mat);

for (let k = 0; k < 3; k++) {
  const ringGeo = new THREE.TorusGeometry(2.8, 0.035, 12, 96);
  const ringMat = new THREE.MeshPhongMaterial({
    color: 0xffd56b, emissive: 0xffd56b, emissiveIntensity: 0.35,
    transparent: true, opacity: 0.85
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  // 三个环相互倾斜 60°·形成三维三才
  ring.rotation.x = (k / 3) * Math.PI * 2;
  ring.rotation.z = ((k+1) / 3) * Math.PI * 2;
  trinity.add(ring);
  trigonMeshes.push(ring);
}

// ════════════════════════════════════════════════════════════
// 【万物】─ 三生万物·64卦粒子束·围绕三才展开
// ════════════════════════════════════════════════════════════
const myriadGroup = new THREE.Group();
scene.add(myriadGroup);

// 64个"卦"·每卦6个粒子对应6个爻
const hexagramCount = 64;
const particlesPerHex = 6;
const totalParticles = hexagramCount * particlesPerHex;

const myriadGeo = new THREE.BufferGeometry();
const myriadPos = new Float32Array(totalParticles * 3);
const myriadCol = new Float32Array(totalParticles * 3);
const myriadSize = new Float32Array(totalParticles);

const baseRadius = 4.2;
for (let h = 0; h < hexagramCount; h++) {
  // 每个卦的基础角度·均匀分布球面
  const φ = Math.acos(1 - 2 * (h + 0.5) / hexagramCount);
  const θ = Math.PI * (1 + Math.sqrt(5)) * h;
  const cx = baseRadius * Math.sin(φ) * Math.cos(θ);
  const cy = baseRadius * Math.cos(φ);
  const cz = baseRadius * Math.sin(φ) * Math.sin(θ);
  for (let p = 0; p < particlesPerHex; p++) {
    const i = (h * particlesPerHex + p) * 3;
    // 每爻用二进制位偏移·阴 0·阳 1
    const bit = (h >> p) & 1;
    const offset = (bit === 1 ? 0.3 : -0.3) * (p / particlesPerHex + 0.5);
    myriadPos[i]   = cx + (Math.random() - 0.5) * 0.3 + offset * 0.2;
    myriadPos[i+1] = cy + (Math.random() - 0.5) * 0.3 + offset * 0.2;
    myriadPos[i+2] = cz + (Math.random() - 0.5) * 0.3 + offset * 0.2;

    myriadCol[i]   = 1.0;
    myriadCol[i+1] = 0.84;
    myriadCol[i+2] = 0.42;

    myriadSize[h * particlesPerHex + p] = bit === 1 ? 0.10 : 0.06;
  }
}
myriadGeo.setAttribute('position', new THREE.BufferAttribute(myriadPos, 3));
myriadGeo.setAttribute('color',    new THREE.BufferAttribute(myriadCol, 3));

const myriadMat = new THREE.PointsMaterial({
  size: 0.08, vertexColors: true, transparent: true, opacity: 0.75,
  sizeAttenuation: true, blending: THREE.AdditiveBlending
});
const myriadPoints = new THREE.Points(myriadGeo, myriadMat);
myriadGroup.add(myriadPoints);

// ════════════════════════════════════════════════════════════
// 【12锚轨道】─ 12条锚以轨道形式围绕中心·点击激活
// ════════════════════════════════════════════════════════════
const anchorOrbitGroup = new THREE.Group();
scene.add(anchorOrbitGroup);

const anchorMeshes = [];
ANCHORS.forEach((a, idx) => {
  const angle = (idx / ANCHORS.length) * Math.PI * 2;
  const orbitR = 6.5;
  const y = Math.sin(idx * 1.618) * 0.8;

  // 小球
  const g = new THREE.SphereGeometry(0.18, 16, 16);
  const m = new THREE.MeshPhongMaterial({
    color: a.color, emissive: a.color, emissiveIntensity: 0.6,
    transparent: true, opacity: 0.85
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(Math.cos(angle)*orbitR, y, Math.sin(angle)*orbitR);
  mesh.userData = { anchor: a, baseAngle: angle, baseY: y };
  anchorOrbitGroup.add(mesh);
  anchorMeshes.push(mesh);

  // 连线到核心
  const lineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0), mesh.position.clone()
  ]);
  const lineMat = new THREE.LineBasicMaterial({
    color: a.color, transparent: true, opacity: 0.18
  });
  const line = new THREE.Line(lineGeo, lineMat);
  line.userData.anchorIdx = idx;
  anchorOrbitGroup.add(line);
});

// ════════════════════════════════════════════════════════════
// 交互·鼠标控制
// ════════════════════════════════════════════════════════════
const state = {
  currentAnchor: null,
  rotationX: 0,
  rotationY: 0,
  targetRotX: 0,
  targetRotY: 0,
  isDragging: false,
  lastMouse: { x: 0, y: 0 },
  zoom: 14,
  targetZoom: 14,
  globalTime: 0,
  focusIntensity: 0,   // 0=巡游模式 1=聚焦某锚
  fiveElement: null,   // 当前激活的五行
  coreColor: new THREE.Color(0xffd56b),
  coreTarget: new THREE.Color(0xffd56b),
};

renderer.domElement.addEventListener('mousedown', e => {
  state.isDragging = true;
  state.lastMouse.x = e.clientX;
  state.lastMouse.y = e.clientY;
});
window.addEventListener('mousemove', e => {
  if (state.isDragging) {
    const dx = e.clientX - state.lastMouse.x;
    const dy = e.clientY - state.lastMouse.y;
    state.targetRotY += dx * 0.005;
    state.targetRotX += dy * 0.005;
    state.lastMouse.x = e.clientX;
    state.lastMouse.y = e.clientY;
  }
});
window.addEventListener('mouseup', () => state.isDragging = false);
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  state.targetZoom = Math.max(6, Math.min(30, state.targetZoom + e.deltaY * 0.01));
}, { passive: false });

// 触屏
let touchLast = null;
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    touchLast = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
});
renderer.domElement.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && touchLast) {
    e.preventDefault();
    const dx = e.touches[0].clientX - touchLast.x;
    const dy = e.touches[0].clientY - touchLast.y;
    state.targetRotY += dx * 0.005;
    state.targetRotX += dy * 0.005;
    touchLast = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
}, { passive: false });
renderer.domElement.addEventListener('touchend', () => touchLast = null);

// ════════════════════════════════════════════════════════════
// 构建锚点按钮
// ════════════════════════════════════════════════════════════
const wuxingClass = { '金':'metal', '木':'wood', '水':'water', '火':'fire', '土':'earth' };
const selectorEl = document.getElementById('anchor-selector');
ANCHORS.forEach((a, idx) => {
  const btn = document.createElement('div');
  btn.className = `anchor-btn ${wuxingClass[a.wuxing]}`;
  btn.innerHTML = `<div class="id">${a.id}</div><div class="dr">${a.dr}</div>`;
  btn.title = `${a.id} · dr=${a.dr} · ${a.wuxing}`;
  btn.addEventListener('click', () => activateAnchor(idx));
  selectorEl.appendChild(btn);
});

// ════════════════════════════════════════════════════════════
// 激活某条锚
// ════════════════════════════════════════════════════════════
function activateAnchor(idx) {
  const a = ANCHORS[idx];
  state.currentAnchor = idx;
  state.focusIntensity = 1;
  state.fiveElement = a.wuxing;

  // 按钮高亮
  document.querySelectorAll('.anchor-btn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });

  // 五行竖条
  document.querySelectorAll('.wuxing-bar .element').forEach(el => {
    el.classList.toggle('active', el.classList.contains(a.wuxing));
  });

  // 核心颜色平滑切换
  state.coreTarget.setHex(a.color);

  // DNA signage
  document.getElementById('dna-val').textContent = a.dna;
  document.getElementById('sha-val').textContent = a.sha;

  // 锚信息框
  document.getElementById('anchor-id').textContent = `${a.id} · dr=${a.dr} · ${a.wuxing}`;
  document.getElementById('anchor-sentence').textContent = a.sentence;
  const six = document.getElementById('six-tuple');
  six.innerHTML = `
    <div><span>DNA</span>${a.id}</div>
    <div><span>SHA16</span>${a.sha.slice(0,8)}...</div>
    <div><span>dr</span>${a.dr}</div>
    <div><span>五行</span>${a.wuxing}</div>
    <div><span>关键词</span>${a.keywords[0]}</div>
    <div><span>闸门</span>${a.dr===3||a.dr===9?'🔴':a.dr===6?'🟡':'🟢'}</div>
  `;

  // 道生一生二生三·渐次激活
  const stages = document.querySelectorAll('.genesis-stack .stage');
  stages.forEach(s => s.classList.remove('active'));
  // 依次激活
  [0, 1, 2, 3, 4].forEach((n, i) => {
    setTimeout(() => stages[n].classList.add('active'), i * 350);
  });

  // 让该锚的小球亮起来·其他的变暗
  anchorMeshes.forEach((m, i) => {
    m.material.emissiveIntensity = i === idx ? 1.5 : 0.3;
    m.material.opacity = i === idx ? 1 : 0.4;
    m.scale.setScalar(i === idx ? 1.6 : 1);
  });
}

// ════════════════════════════════════════════════════════════
// 动画循环
// ════════════════════════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);
  state.globalTime += 0.01;

  // 平滑相机
  state.rotationX += (state.targetRotX - state.rotationX) * 0.08;
  state.rotationY += (state.targetRotY - state.rotationY) * 0.08;
  state.zoom += (state.targetZoom - state.zoom) * 0.08;

  camera.position.x = state.zoom * Math.sin(state.rotationY) * Math.cos(state.rotationX);
  camera.position.y = state.zoom * Math.sin(state.rotationX);
  camera.position.z = state.zoom * Math.cos(state.rotationY) * Math.cos(state.rotationX);
  camera.lookAt(0, 0, 0);

  // 【一】核心平滑颜色渐变
  state.coreColor.lerp(state.coreTarget, 0.04);
  coreMesh.material.emissive.copy(state.coreColor);
  haloMesh.material.color.copy(state.coreColor);
  trigonMeshes.forEach(ring => {
    ring.material.emissive.copy(state.coreColor);
    ring.material.color.copy(state.coreColor);
  });

  // 【一】核心脉冲·369节拍
  const pulse369 = 1 + 0.08 * Math.sin(state.globalTime * 3) + 0.05 * Math.sin(state.globalTime * 6) + 0.03 * Math.sin(state.globalTime * 9);
  coreMesh.scale.setScalar(pulse369);
  coreMesh.rotation.x += 0.003;
  coreMesh.rotation.y += 0.005;

  // 【二】阴阳螺旋·缓慢反向旋转
  helixYang.rotation.y =  state.globalTime * 0.25;
  helixYin.rotation.y  = -state.globalTime * 0.25;

  // 【三】三才环·各自速度
  trigonMeshes.forEach((r, i) => {
    r.rotation.x += 0.002 * (i + 1);
    r.rotation.y += 0.003 * (i + 1);
  });

  // 【万物】粒子整体缓转
  myriadGroup.rotation.y += 0.0008;
  myriadGroup.rotation.x += 0.0004;

  // 万物粒子色·随当前锚的颜色平滑变化
  const targetR = state.coreColor.r;
  const targetG = state.coreColor.g;
  const targetB = state.coreColor.b;
  const posArr = myriadGeo.attributes.color.array;
  const colorsUpdate = state.globalTime % 1 < 0.02;
  if (colorsUpdate) {
    for (let i = 0; i < totalParticles; i++) {
      posArr[i*3]   += (targetR - posArr[i*3])   * 0.02;
      posArr[i*3+1] += (targetG - posArr[i*3+1]) * 0.02;
      posArr[i*3+2] += (targetB - posArr[i*3+2]) * 0.02;
    }
    myriadGeo.attributes.color.needsUpdate = true;
  }

  // 【锚轨道】缓慢自转·被激活的那个上浮
  anchorOrbitGroup.rotation.y += 0.0015;
  anchorMeshes.forEach((m, i) => {
    const baseAngle = m.userData.baseAngle;
    const breathe = 0.15 * Math.sin(state.globalTime * 1.5 + i);
    m.position.y = m.userData.baseY + breathe;
    if (i === state.currentAnchor) {
      m.position.y += 0.3 + 0.1 * Math.sin(state.globalTime * 3);
    }
  });

  // 星空·缓慢旋转
  stars.rotation.y += 0.0001;

  renderer.render(scene, camera);
}

// ════════════════════════════════════════════════════════════
// 启动·关闭加载过场·显示默认锚 T06 水·dr=1·最接地气
// ════════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = W() / H();
  camera.updateProjectionMatrix();
  renderer.setSize(W(), H());
});

animate();

setTimeout(() => {
  document.getElementById('loader').classList.add('hidden');
  // 默认激活 T06（数字治理宪法·护城河·dr=1·水·一生万物之始）
  activateAnchor(5);
}, 1400);

// 键盘·←→ 切换锚·空格随机
window.addEventListener('keydown', e => {
  if (state.currentAnchor === null) return;
  if (e.key === 'ArrowRight') activateAnchor((state.currentAnchor + 1) % 12);
  if (e.key === 'ArrowLeft')  activateAnchor((state.currentAnchor + 11) % 12);
  if (e.key === ' ') { e.preventDefault(); activateAnchor(Math.floor(Math.random() * 12)); }
});
</script>
