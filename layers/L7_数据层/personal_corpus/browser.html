const NOTES = __NOTES__;

const $=s=>document.querySelector(s);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let current=NOTES;
function renderList(){
  const box=$('#list'); box.innerHTML='';
  current.forEach((n,i)=>{
    const div=document.createElement('div'); div.className='item'; div.dataset.i=i;
    div.innerHTML='<div class="t">'+esc(n.title)+'</div><div class="m">'+(n.folder||'')+' · '+(n.modified||'')+' · '+n.chars+'字</div>';
    div.onclick=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));div.classList.add('active');show(n);};
    box.appendChild(div);
  });
  if(current.length){box.firstChild.classList.add('active');show(current[0]);}
  else $('#detail').innerHTML='<div class="empty">无匹配</div>';
}
function show(n){
  $('#detail').innerHTML='<h2>'+esc(n.title)+'</h2><div class="meta">'+esc(n.folder||'')+' · 创建 '+(n.created||'')+' · 修改 '+(n.modified||'')+' · '+n.chars+'字</div><div class="body">'+esc(n.text)+'</div>';
}
$('#q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  current = q ? NOTES.filter(n=>(n.title+' '+n.text).toLowerCase().includes(q)) : NOTES;
  renderList();
});
